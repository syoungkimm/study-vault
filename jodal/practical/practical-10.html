<style>
  :root {

    --brand: #1d4e89; --brand-soft: #e8f0fa; --ok: #1a7f4b; --ok-soft: #e6f4ec;
    --warn: #b54708; --warn-soft: #fdf1e7; --bad: #b42318; --bad-soft: #fdeceb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; line-height: 1.65; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header.top { background: var(--brand); color: #fff; padding: 28px 16px 24px; }
  header.top .inner { max-width: 860px; margin: 0 auto; }
  header.top h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header.top p { margin: 0; opacity: .85; font-size: .95rem; }
  header.top a.back { color: #fff; opacity: .85; font-size: .88rem; text-decoration: none; display: inline-block; margin-bottom: 8px; }
  header.top a.back:hover { text-decoration: underline; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .notice { font-size: .92rem; color: var(--muted); }
  .notice ul { margin: 8px 0 0; padding-left: 20px; }
  label.field { display: block; font-weight: 500; margin-bottom: 6px; }

  input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
  .section-title { font-size: 1.05rem; font-weight: 700; color: var(--brand); margin: 28px 0 12px; }

  .q-title { font-weight: 700; }

  .interim-box { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }

                padding: 4px 10px; border-radius: 6px; display: inline-block; }

  .result-hero.fail { background: var(--warn-soft); border-color: #f5d0b0; }
  .result-hero.fail .msg, .result-hero.fail .score { color: var(--warn); }

  table.subj { width: 100%; border-collapse: collapse; font-size: .92rem; }

  table.subj td.num, table.subj th.num { text-align: right; }
  .subj-fail { color: var(--bad); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; font-size: .85rem;
          text-decoration: none; color: inherit; background: #fff; }
  .chip b { display: block; font-size: 1rem; }
  .chip.full { background: var(--ok-soft); border-color: #b7e0c8; }
  .chip.mid { background: var(--warn-soft); border-color: #f5d0b0; }
  .chip.zero { background: var(--bad-soft); border-color: #f4c7c3; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 680px) { .cmp { grid-template-columns: 1fr; } }
  .box { border-radius: 8px; padding: 12px 14px; font-size: .93rem; white-space: pre-wrap; word-break: keep-all; }
  .box h4 { margin: 0 0 6px; font-size: .85rem; }
  .box.mine { background: #f8fafc; border: 1px solid var(--line); }
  .box.model { background: var(--brand-soft); border: 1px solid #c9dbf2; }
  .box.exp { background: #fffbea; border: 1px solid #f3e3a1; margin-top: 12px; white-space: normal; }
  .rubric { list-style: none; padding: 0; margin: 12px 0 0; font-size: .88rem; }
  .rubric li { padding: 4px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; }

  .rubric .miss .mark { color: var(--bad); }

  .q-score { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .empty { color: var(--muted); font-style: italic; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  footer.foot { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 40px; }

지체일수 불산입 기간과 법정 부과 상한선 규정을 서술하시오.", "points": 5, "answer": "· 면제 사유: ① 천재지변 등 불가항력, ② 관급재료 공급 지연, ③ 발주기관의 책임으로 인한 착수 지연·중단, ④ 발주기관의 설계도서 승인 지연\n· 불산입: 검사기간(14일 이내)은 지체일수에 넣지 않는다.\n· 부과 상한선: 지체상금 총액은 계약금액의 30%(100분의 30) 이하로 제한된다.", "rubric": [{"p": 0.75, "label": "면제 사유 ①: 불가항력(천재지변 등)", "k": [["불가항력", "천재지변", "자연재해", "태풍", "홍수", "지진", "전쟁"]]}, {"p": 0.75, "label": "면제 사유 ②: 관급재료(지급자재) 공급 지연", "k": [["관급", "지급자재"]]}, {"p": 0.75, "label": "면제 사유 ③: 발주기관 책임으로 인한 착수 지연·중단", "k": [["착수", "중단", "귀책", "발주자", "발주처", "발주기관", "발주청"]]}, {"p": 0.75, "label": "면제 사유 ④: 발주기관의 설계도서 승인 지연", "k": [["설계도서", "승인", "도면", "설계변경"]]}, {"p": 1.0, "label": "지체일수 불산입: 검사기간(14일 이내)", "k": [["검사"], ["14일"]], "s": ["불산입", "제외", "지체일수"]}, {"p": 1.0, "label": "부과 상한: 계약금액의 30%", "k": [["30%", "100분의30", "30/100"]], "s": ["상한", "한도", "계약금액"]}], "explanation": "면제를 받으려면 사유 발생 사실과 통지 기록을 남겨 두어야 합니다."}, {"no": 6, "type": "essay", "subject": "서술식", "title": "ISO 31000 조달 리스크 관리 4단계와 4대 대응 전략 [서술식]", "question": "ISO 31000에 따른 조달 리스크 관리 4단계를 순서대로 쓰고, 4대 리스크 대응 전략을 서술하시오.", "points": 5, "answer": "· 관리 4단계: ① 리스크 식별 → ② 리스크 분석·평가 → ③ 리스크 대응 → ④ 모니터링·검토\n· 4대 대응 전략\n- 회피: 위험 발생 원인을 사전에 제거함\n- 완화: 발생 확률이나 손실 규모를 줄임\n- 전가: 보증서, 보험, 하도급을 통해 위험을 제3자에게 넘김\n- 수용: 잔여 위험을 인지하고 직접 부담함", "rubric": [{"p": 2.0, "label": "4단계: 식별 → 분석·평가 → 대응 → 모니터링·검토", "seq": ["식별", "평가", "대응", "모니터링"], "s": [["식별"], ["분석", "평가"], ["대응"], ["모니터링", "검토", "복습"]]}, {"p": 3.0, "label": "4대 대응 전략: 회피 / 완화 / 전가 / 수용", "k": [["회피"], ["완화", "감소"], ["전가", "전이"], ["수용"]], "s": ["보증", "보험", "하도급", "제3자", "잔여"]}], "explanation": "보증서·보험 제출이 대표적인 위험 '전가' 전략입니다."}, {"no": 7, "type": "essay", "subject": "서술식", "title": "복수예비가격 제도의 작동 방식과 취지 [서술식]", "question": "복수예비가격 제도의 작동 방식(변동폭 포함)과 예정가격을 사전에 확정하지 않는 취지를 서술하시오.", "points": 5, "answer": "· 메커니즘: 기초금액을 기준으로(국가 ±2%, 지방 ±3%) 15개의 예비가격을 생성하고, 입찰자가 투찰 시 2개씩 추첨하여 가장 많이 선택된 4개 가격의 산술평균을 예정가격으로 결정한다.\n· 취지: 개찰 직전까지 예정가격을 확정하지 않고 입찰자의 무작위 추첨에 맡김으로써 예정가격 사전 유출과 담합 행위를 구조적으로 차단한다.", "rubric": [{"p": 2.5, "label": "메커니즘: 기초금액 기준 15개 예비가격 생성 → 2개씩 추첨 → 다빈도 4개 산술평균 = 예정가격", "k": [["15개"], ["4개"], ["산술평균", "평균"]], "s": ["기초금액", "추첨", "2개씩", "예정가격"]}, {"p": 1.0, "label": "변동폭: 국가 ±2%, 지방 ±3%", "k": [["2%"], ["3%"]], "s": ["국가", "지방", "±"]}, {"p": 1.5, "label": "취지: 예정가격을 개찰 직전까지 확정하지 않고 무작위 추첨 → 사전 유출·담합 차단", "k": [["담합", "유출"], ["추첨", "무작위", "확정하지"]], "s": ["사전", "차단", "개찰"]}], "explanation": "국가와 지방의 변동폭 차이(±2% / ±3%)가 단골 출제 포인트입니다."}, {"no": 8, "type": "essay", "subject": "서술식", "title": "협상 시 과업 변경과 가격 조정의 연동 원칙 [서술식]", "question": "협상에 의한 계약에서 기술협상 시 과업 내용의 추가·변경에 따른 가격 연동 조정 원칙 3가지를 서술하시오.", "points": 5, "answer": "· 입찰공고 요구 내용 기준: 공고에 없던 새로운 과업을 협상 단계에서 일방적으로 추가할 수 없다.\n· 과업 조정에 따른 가격 증감: 기술협상으로 과업이 추가·변경·삭제되면 그 조정 결과에 상당하는 금액을 조정한다.\n· 과업과 가격의 연동: 과업 조정과 가격 조정은 연동되어야 하며, 과업만 늘리고 가격을 고정하는 것은 부당한 특약으로 무효이다.", "rubric": [{"p": 1.5, "label": "원칙1: 입찰공고에 없던 새 과업을 협상에서 일방적으로 추가할 수 없음", "k": [["공고"], ["추가"]], "s": ["새로운", "과업", "일방적", "협상"]}, {"p": 1.5, "label": "원칙2: 과업이 추가·변경·삭제되면 상당하는 금액 조정", "k": [["금액", "가격"], ["조정"]], "s": ["추가", "변경", "삭제", "상당", "과업"]}, {"p": 2.0, "label": "원칙3: 과업과 가격은 연동, 과업만 늘리고 가격 고정은 부당 특약(무효)", "k": [["연동"], ["부당", "특약"]], "s": ["고정", "무효", "과업만", "늘리고"]}], "explanation": "협상 결과는 협상합의서·회의록으로 남겨 계약서 과업내용에 반영합니다."}, {"no": 9, "type": "essay", "subject": "서술식", "title": "원가계산 이윤 산정의 제외 항목과 산식 [서술식]", "question": "원가계산에 의한 이윤 산정 시 기준금액에서 제외되는 항목 3가지를 쓰고, 이윤 산식을 서술하시오.", "points": 5, "answer": "· 제외 항목: 재료비, 기술료, 외주가공비 (기술료와 외주가공비는 경비 중에서 뺀다.)\n· 이윤 산식: 이윤 = (노무비 + 경비 + 일반관리비) × 이윤율", "rubric": [{"p": 3.0, "label": "제외 항목: 재료비·기술료·외주가공비", "k": [["재료비"], ["기술료"], ["외주가공비"]], "s": ["제외", "경비", "빼"]}, {"p": 2.0, "label": "이윤 = (노무비 + 경비 + 일반관리비) × 이윤율", "k": [["노무비"], ["경비"], ["일반관리비"], ["이윤율"]], "s": ["합계", "곱", "×", "이윤"]}], "explanation": "이윤을 재료비까지 포함한 합계에 곱하는 실수가 가장 흔합니다."}, {"no": 10, "type": "essay", "subject": "서술식", "title": "업체 PC 장애와 나라장터 공식 장애의 대응 차이 [서술식]", "question": "전자입찰 마감 직전 이용자(업체) PC 장애가 발생한 경우와 나라장터 공식 장애가 발생한 경우의 대응 절차 차이를 0000", "70%", "최저입찰가격", "보정"]}, {"p": 0.55, "label": "[풀이] A사(80% 이상) = 20 × (7억 ÷ 9억)", "k": [["15.5556"], ["700000000"], ["900000000"]], "s": ["15.5556", "700000000", "900000000", "80%이상", "90%"]}, {"p": 0.7, "label": "[풀이] B사(80% 미만) = 20 × (7억 ÷ 8억) + 2 × [(8억−7억) ÷ (8억−7억)] = 19.5", "k": [["19.5"], ["800000000"], ["700000000"]], "s": ["19.5", "800000000", "700000000", "17.5", "80%미만"]}, {"p": 0.45, "label": "[풀이] C사(70% 미만) = 20 × 0.3 = 6", "k": [["0.3", "30%"]], "s": ["0.3", "70%미만"]}], "explanation": "80% 이상 구간은 비례식, 80% 미만 구간은 가산식, 70% 미만 투찰자는 배점의 30%입니다. 최저가 보정(70%)은 산식의 분자에만 쓰며, 정확히 70%인 B사를 30% 부여 대상으로 처리하는 실수가 잦습니다."}, {"no": 12, "type": "essay", "subject": "계산문제", "title": "물품 제조계약 지체상금 산출 [계산문제]", "question": "국가기관 물품 제조계약에서 아래 조건을 반영하여 지체상금을 구하시오.\n[조건]\n· 계약금액: 200,000,000원\n· 검사 후 인수한 기납부분 대가: 50,000,000원\n· 총 지체일수: 40일 (그 중 발주기관 승인 지연 면제일수: 10일)\n· 물품 제조·구매 1일당 지체상금률: 0.075% (1,000분의 0.75)\n※ 풀이 과정(산출식·대입)과 최종 답을 함께 쓰시오. (풀이 과정 50% + 최종 정답 50%로 채점)", "points": 5, "answer": "① 정당 지체일수 = 40일 − 10일 = 30일\n② 대상 금액 = 200,000,000원 − 50,000,000원 = 150,000,000원\n③ 지체상금 = 150,000,000원 × 0.00075 × 30일 = 3,375,000원", "rubric": [{"p": 0.75, "label": "[정답] 정당 지체일수 30일", "k": [["30일", "30"]]}, {"p": 0.75, "label": "[정답] 대상 금액 150,000,000원", "k": [["150000000"]]}, {"p": 1.0, "label": "[정답] 지체상금 3,375,000원", "k": [["3375000"]]}, {"p": 0.5, "label": "[풀이] 정당 지체일수 = 총 지체일수 40 − 면제일수 10 = 30", "k": [["40"], ["10"], ["30"]], "s": ["40", "10", "30", "지체일수", "면제"]}, {"p": 0.5, "label": "[풀이] 대상 금액 = 계약금액 200,000,000 − 기납부분 50,000,000 = 150,000,000", "k": [["200000000"], ["50000000"], ["150000000"]], "s": ["200000000", "50000000", "150000000", "계약금액", "기납부"]}, {"p": 1.5, "label": "[풀이] 지체상금 = 150,000,000 × 0.00075 × 30일 = 3,375,000", "k": [["150000000"], ["0.00075", "0.075%", "1000분의0.75", "1천분의0.75"], ["3375000"]], "s": ["150000000", "0.00075", "3375000", "지체상금", "30"]}], "explanation": "지체상금 = (계약금액 − 검사를 거쳐 인수한 기납부분) × 지체상금률 × (지체일수 − 면제일수)입니다. 기납부분을 빼는 것을 빠뜨리기 쉽습니다."   messages: { pass: "모의고사 합격을 축하합니다.", fail: "조금만 더 분발해주세요." },
  grading: {
    softMany: 2, softManyRate: 0.7, softOneRate: 0.3, groupPartRate: 0.4,
    suppFull: 0.5, keyOnlyRate: 0.83,
    auto: { full: 0.5, fullRate: 1.0, mid: 0.3, midRate: 0.8, low: 0.15, lowRate: 0.5 }
  }
};

<script>
/* =====================================================================
 * 모의고사 공통 채점 엔진 (브라우저/Node 공용)
 * ---------------------------------------------------------------------
 * 문항 유형
 *   essay  : 서술형. rubric(채점요소)이 있으면 그 기준으로, 없으면 모범답안(answer)에서
 *            자동으로 채점요소를 만들어 채점
 *   short  : 단답형. parts[] 소문항별로 keys(인정 답) 포함 여부 채점
 *   choice : 객관식. choices[] 와 answer(1부터 시작하는 번호, 복수정답은 배열)
 *
 * 채점 단계 (서술형)
 *   1) 정확한 핵심 키워드(rubric.k)가 있으면            → 배점 100%
 *      (단, 보조 표현 rubric.s 가 있는데 suppFull 비율 미만만 쓰였으면
 *       keyOnlyRate~100% 사이 비례 — 핵심어만 얹은 불완전 답안 방지)
 *   2) 없지만 유사 표현(rubric.s)이 softMany개 이상이면   → softManyRate
 *      1개면                                           → softOneRate
 *   3) rubric이 없으면 모범답안을 문장 단위로 나눠 핵심어 포함 비율로 자동 채점
 * ===================================================================== */
(function (root) {
  "use strict";

  const DEFAULT_GRADING = {
    softMany: 2, softManyRate: 0.7, softOneRate: 0.3, groupPartRate: 0.4,
    suppFull: 0.5, keyOnlyRate: 0.83,
    auto: { full: 0.5, fullRate: 1.0, mid: 0.3, midRate: 0.8, low: 0.15, lowRate: 0.5 }
  };

  const round1 = (n) => Math.round(n * 10) / 10;
  const round2 = (n) => Math.round(n * 100) / 100;

  /** 비교용 정규화: 공백·쉼표 제거, 소문자화, 전각 % 통일 */
  const normalize = (s) => String(s == null ? "" : s)
    .toLowerCase()
    .replace(/％/g, "%").replace(/[，,]/g, "")
    .replace(/퍼센트|프로/g, "%")
    .replace(AMOUNT_RE, amountToDigits)
    .replace(/\s+/g, "");

  /** 금액 표기 통일: "12백만원"·"1억2000만"·"3.5억"·"1천2백만" 처럼 한글 단위가 섞인 숫자를
   *  아라비아 숫자(예: 12000000)로 바꿔서, 키워드·답안이 표기 방식과 상관없이 일치하도록 한다.
   *  (공백으로 떨어진 뒤의 숫자는 단위가 붙어 있을 때만 같은 금액으로 이어 붙인다.) */
  const UNIT = { "십": 10, "백": 100, "천": 1000, "만": 1e4, "억": 1e8, "조": 1e12 };
  const AMOUNT_RE = /\d+(?:\.\d+)?\s*[억만천백십](?:(?:\s*\d+(?:\.\d+)?)?\s*[억만천백십])*(?:\d+(?:\.\d+)?(?![\d.]|\s*[억만천백십]))?/g;
  function amountToDigits(m) {
    let total = 0, section = 0, cur = null;
    const toks = m.match(/\d+(?:\.\d+)?|[억만천백십]/g);
    for (const t of toks) {
      if (/\d/.test(t)) { cur = parseFloat(t); continue; }
      const u = UNIT[t];
      if (u < 1e4) { section += (cur == null ? 1 : cur) * u; cur = null; }
      else {
        if (cur != null) section += cur;
        if (section === 0) section = 1;
        total += section * u; section = 0; cur = null;
      }
    }
    total += section + (cur == null ? 0 : cur);
    return String(Math.round(total));
  }

  /* ---------- 핵심어 추출 (자동 채점용) ---------- */
  const STOP = new Set(["등", "및", "또는", "대한", "위한", "통해", "따라", "경우", "있는", "하는", "한다", "이다",
    "때문", "것이다", "이를", "그리고", "하여", "있다", "된다", "해당", "각각", "모두", "대해", "관한", "같은", "또한"]);
  const JOSA = /(으로서|으로써|에서는|에게는|으로|에서|에게|까지|부터|처럼|보다|이다|한다|된다|하는|하여|하고|이며|하며|에는|에도|이나|이란|라는|라고|과|와|은|는|이|가|을|를|의|에|도|로|만|며)$/;

  function extractTerms(text) {
    let s = String(text || "");
    const c = s.indexOf(":");
    if (c > 0 && c <= 30) s = s.slice(c + 1);              // "정의:" 같은 머리말 제거
    s = s.replace(/(\d),(?=\d)/g, "$1").replace(/[①②③④⑤⑥⑦⑧⑨⑩➔→]/g, " ");
    const toks = s.match(/[가-힣A-Za-z0-9%.]+/g) || [];
    const out = [], seen = new Set();
    for (let t of toks) {
      t = t.replace(/^\.+|\.+$/g, "");
      if (!t) continue;
      if (/^\d{1,2}$/.test(t)) continue;                    // 번호(1, 2 ...) 제외
      if (/[가-힣]/.test(t)) {
        const stripped = t.replace(JOSA, "");
        if (stripped.length >= 2) t = stripped;
      }
      if (t.length < 2 && !/%/.test(t)) continue;
      if (STOP.has(t)) continue;
      const n = normalize(t);
      if (seen.has(n)) continue;
      seen.add(n); out.push(t);
    }
    return out;
  }

  /** 답안에 키워드가 있는지. 숫자만으로 된 키워드("4억"→400000000, "5" 등)는 앞뒤에 다른 숫자가
   *  붙어 있으면 인정하지 않는다. (예: 정답 4억에 40억·15를 쓴 경우를 걸러냄) */
  function has(t, n) {
    if (/^\d+(?:\.\d+)?$/.test(n)) {
      const tail = n.includes(".") ? "0*(?!\\d)" : "(?!\\d)";          // 소수는 19.5 = 19.5000
      const re = new RegExp("(?<!\\d)(?<!\\d\\.)" + n.replace(/\./g, "\\.") + tail);
      return re.test(t);
    }
    return t.includes(n);
  }

  /** 핵심어가 답안에 있는지 (어미 변화를 고려해 앞부분 일치도 인정) */
  function termHit(tNorm, term) {
    const n = normalize(term);
    if (!n) return false;
    if (has(tNorm, n)) return true;
    if (/[가-힣]/.test(n)) {
      if (n.length >= 3 && tNorm.includes(n.slice(0, -1))) return true;
      if (n.length >= 5 && tNorm.includes(n.slice(0, -2))) return true;
    }
    return false;
  }

  /** 모범답안 → 자동 채점요소 */
  function autoRubric(answer, points) {
    const lines = String(answer || "")
      .replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, "\n")
      .split(/\n+/)
      .flatMap(l => l.split(/(?<=[다요음임함]\.)\s+|;\s*/))
      .map(l => l.replace(/^\s*(\d+[.)]|\(\d+\)|[-•*])\s*/, "").trim())
      .filter(Boolean);
    const clauses = lines.map(l => ({ label: l, terms: extractTerms(l) })).filter(c => c.terms.length >= 2);
    if (!clauses.length) return [];
    const totalW = clauses.reduce((s, c) => s + c.terms.length, 0);
    return clauses.map(c => ({
      label: c.label.length > 60 ? c.label.slice(0, 58) + "…" : c.label,
      terms: c.terms,
      p: round2(points * c.terms.length / totalW)
    }));
  }

  function softHits(t, words) {
    const seen = new Set();
    (words || []).forEach(w => { const n = normalize(w); if (n && t.includes(n)) seen.add(n); });
    return seen.size;
  }

  /** 연산기호(×÷+−*)가 숫자 2개 이상과 함께 등장하면 산식(풀이)을 보여준 것으로 본다.
   *  한국어 산식은 "600,000,000원 × 지수조정률 5%"처럼 기호와 다음 숫자 사이에 단어가
   *  끼는 경우가 대부분이라 숫자-기호-숫자가 바로 붙어 있는지는 보지 않는다.
   *  [풀이] 채점요소는 이 증거가 전혀 없으면(=답만 나열) 점수를 주지 않는다 — 문항 라벨을 그대로
   *  베낀 답안이 우연히 보조 키워드와 겹쳐 부분점수를 받는 것을 막기 위함. */
  const OP_RE = /[×÷+\-−*]/;
  function hasCalcWork(text) {
    const s = String(text || "");
    if (!OP_RE.test(s)) return false;
    const nums = s.match(/[0-9][0-9,]*(?:\.[0-9]+)?/g) || [];
    return nums.length >= 2;
  }

  /* ---------- 서술형 ---------- */
  function gradeEssay(q, text, cfg) {
    const g = cfg;
    const t = normalize(text);
    const showedWork = hasCalcWork(text);
    const items = (q.rubric && q.rubric.length) ? q.rubric : autoRubric(q.answer, q.points);
    const detail = items.map(item => {
      let rate = 0, level = "miss";
      const isProcessItem = /^\[풀이\]/.test(item.label || "");
      if (t.length > 0 && !(isProcessItem && !showedWork)) {
        const hasExplicit = item.seq || (item.k && item.k.length);
        if (hasExplicit) {
          let strict;
          if (item.seq) {                                    // 순서까지 맞아야 하는 항목
            let pos = -1; strict = true;
            for (const kw of item.seq) {
              const i = t.indexOf(normalize(kw), pos + 1);
              if (i < 0) { strict = false; break; }
              pos = i;
            }
          } else {                                           // 그룹 AND, 그룹 안은 OR
            strict = item.k.every(group => group.some(kw => has(t, normalize(kw))));
          }
          if (strict) {
            rate = 1; level = "full";
            // 완결성 검사: 핵심 키워드 한두 개만 맞고 보조 표현(s)이 거의 없으면 만점 대신 감점한다.
            // s의 suppFull 비율 이상을 충족하면 만점, 미달이면 keyOnlyRate ~ 1.0 사이에서 비례 부여.
            if (!item.seq && item.s && item.s.length) {
              const total = new Set(item.s.map(normalize).filter(Boolean)).size;
              const sr = total ? softHits(t, item.s) / total : 1;
              // 보조 표현이 모범답안과 다른 어휘로 적힌 문항이 있어, 모범답안 자신의 충족률을 상한으로 삼는다
              // (모범답안은 항상 만점)
              const ref = total ? softHits(normalize(q.answer), item.s) / total : 1;
              const need = Math.min(g.suppFull, ref);
              if (sr < need) {
                rate = g.keyOnlyRate + (1 - g.keyOnlyRate) * (sr / need);
                level = "part";
              }
            }
          }
          else if (item.seq && Array.isArray(item.s)) {      // 순서 무관 일치 비율
            const found = item.s.filter(grp => grp.some(kw => t.includes(normalize(kw)))).length;
            if (found > 0) { rate = (found / item.s.length) * g.softManyRate; level = "part"; }
          } else {
            // 설명·방안형(키워드 묶음이 여럿)은 맞는 묶음 비율만큼 부분점수. 숫자가 든 묶음을 놓치면 이 부분점수는 없다.
            if (!item.seq && item.k && item.k.length > 1) {
              const miss = item.k.filter(grp => !grp.some(kw => has(t, normalize(kw))));
              if (!miss.some(grp => grp.some(kw => /\d/.test(kw)))) {
                const r = ((item.k.length - miss.length) / item.k.length) * (g.groupPartRate || 0);
                if (r > rate) { rate = r; level = "part"; }
              }
            }
            if (item.s && item.s.length) {
              const n = softHits(t, item.s);
              let r = 0;
              if (n >= g.softMany) r = g.softManyRate;
              else if (n >= 1) r = g.softOneRate;
              if (r > rate) { rate = r; level = "part"; }
            }
          }
        } else {                                             // 키워드 없는 항목: 핵심어 비율로 자동 판정
          const terms = item.terms || extractTerms(item.label);
          if (terms.length) {
            const ratio = terms.filter(w => termHit(t, w)).length / terms.length;
            const a = g.auto;
            if (ratio >= a.full) { rate = a.fullRate; level = "full"; }
            else if (ratio >= a.mid) { rate = a.midRate; level = "part"; }
            else if (ratio >= a.low) { rate = a.lowRate; level = "part"; }
          }
        }
      }
      return { label: item.label, p: round1(item.p), got: round1(item.p * rate), level };
    });
    const score = Math.min(q.points, detail.reduce((s, d) => s + d.got, 0));
    return { score: round1(score), detail };
  }

  /* ---------- 단답형 ---------- */
  function autoKeys(answer) {
    const a = String(answer || "");
    const num = a.replace(/(\d),(?=\d)/g, "$1").match(/\d+(\.\d+)?/);
    const keys = [normalize(a)];
    if (num) keys.push(num[0].replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, ""));
    return keys;
  }
  function gradeShort(q, arr) {
    const per = q.points / q.parts.length;
    const detail = q.parts.map((p, j) => {
      const t = normalize((arr || [])[j]);
      const keys = (p.keys && p.keys.length) ? p.keys : autoKeys(p.answer);
      const hit = t.length > 0 && keys.some(k => k && has(t, normalize(k)));
      return { label: `${p.label} → ${p.answer}`, p: round1(per), got: hit ? round1(per) : 0, level: hit ? "full" : "miss" };
    });
    const hits = detail.filter(d => d.level === "full").length;
    return { score: round1(Math.min(q.points, hits * per)), detail };
  }

  /* ---------- 객관식 ---------- */
  function toSet(v) { return new Set([].concat(v == null ? [] : v).map(Number).filter(n => !isNaN(n))); }
  function gradeChoice(q, ans) {
    const right = toSet(q.answer), mine = toSet(ans);
    const ok = right.size === mine.size && [...right].every(x => mine.has(x));
    return { score: ok ? q.points : 0, detail: [{ label: "정답 선택", p: q.points, got: ok ? q.points : 0, level: ok ? "full" : "miss" }] };
  }

  /* ---------- 문항 기본값 ---------- */
  function normalizeExam(exam) {
    const dp = exam.defaultPoints || 5;
    exam.questions.forEach((q, i) => {
      q.no = q.no || i + 1;
      q.type = q.type || "essay";
      q.points = Number(q.points) || dp;
      if (!q.subject) q.subject = "전체";
    });
    exam.pass = Object.assign({ percent: 60, subjectMinPercent: 0 }, exam.pass || {});
    return exam;
  }

  function mergeGrading(cfg) {
    const c = cfg || {};
    return Object.assign({}, DEFAULT_GRADING, c, { auto: Object.assign({}, DEFAULT_GRADING.auto, c.auto || {}) });
  }

  /* ---------- 단일 문항 채점 (중간 확인용) ---------- */
  function gradeQuestion(q, answer, gradingCfg) {
    const cfg = mergeGrading(gradingCfg);
    const r = q.type === "short" ? gradeShort(q, answer)
      : q.type === "choice" ? gradeChoice(q, answer)
      : gradeEssay(q, answer, cfg);
    return { no: q.no, subject: q.subject, max: q.points, score: r.score, detail: r.detail };
  }

  /* ---------- 전체 채점 ---------- */
  function gradeExam(exam, answers, gradingCfg) {
    const cfg = mergeGrading(gradingCfg);
    normalizeExam(exam);
    const items = exam.questions.map((q, i) => {
      const a = answers[i];
      const r = q.type === "short" ? gradeShort(q, a)
        : q.type === "choice" ? gradeChoice(q, a)
        : gradeEssay(q, a, cfg);
      return { no: q.no, subject: q.subject, max: q.points, score: r.score, detail: r.detail };
    });
    const total = round1(items.reduce((s, x) => s + x.score, 0));
    const max = items.reduce((s, x) => s + x.max, 0);
    const subjMap = new Map();
    items.forEach(x => {
      const s = subjMap.get(x.subject) || { name: x.subject, score: 0, max: 0 };
      s.score += x.score; s.max += x.max; subjMap.set(x.subject, s);
    });
    const subjects = [...subjMap.values()].map(s => ({ name: s.name, score: round1(s.score), max: s.max }));
    const percent = max ? total / max * 100 : 0;
    const subjFail = exam.pass.subjectMinPercent > 0 &&
      subjects.some(s => s.max && s.score / s.max * 100 < exam.pass.subjectMinPercent);
    const pass = percent >= exam.pass.percent && !subjFail;
    return { items, total, max, percent: round1(percent), subjects, pass, subjFail };
  }

  /* ---------- 표시용: 모범답안 텍스트 ---------- */
  function modelAnswerText(q) {
    if (q.type === "short") return q.parts.map(p => `${p.label} ${p.answer}`).join("\n");
    if (q.type === "choice") return [...toSet(q.answer)].map(n => `${n}번 ${q.choices[n - 1] || ""}`).join("\n");
    return q.answer || "";
  }
  function userAnswerText(q, a) {
    if (q.type === "short") return q.parts.map((p, j) => `${p.label} ${(a && a[j]) || "-"}`).join("\n");
    if (q.type === "choice") { const s = [...toSet(a)]; return s.length ? s.map(n => `${n}번 ${q.choices[n - 1] || ""}`).join("\n") : ""; }
    return a || "";
  }
  function isBlank(q, a) {
    if (q.type === "short") return !a || a.every(v => !String(v || "").trim());
    if (q.type === "choice") return toSet(a).size === 0;
    return !String(a || "").trim();
  }

  const api = { DEFAULT_GRADING, normalize, extractTerms, autoRubric, gradeExam, gradeQuestion, normalizeExam, mergeGrading,
    modelAnswerText, userAnswerText, isBlank, round1 };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.ExamEngine = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* =====================================================================
 * 1회용 채점기 (오프라인 전용)
 *   - 문제·정답·해설은 이 파일 안의 #exam-data 에 들어 있습니다.
 *   - 외부 서버·구글시트로 아무것도 보내지 않습니다.
 *   - 브라우저 저장소(localStorage·sessionStorage·쿠키)를 쓰지 않습니다.
 * ===================================================================== */
(function () {
  "use strict";
  const SITE = window.SITE || {};
  const Eng = window.ExamEngine;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const app = $("#app");

  function setHeader(title, sub) {
    $("#siteTitle").textContent = title || "모의고사";
    $("#siteSub").textContent = sub || "";
    document.title = title || "모의고사";
  }
  function showError(msg) {
    app.innerHTML = `<div class="card error">${msg}</div><div class="center"><a class="btn secondary" href="./">회차 목록으로</a></div>`;
  }

  /* ---------- 시험 ---------- */
  let exam, examId, timerId = null, submitting = false;

  function loadEmbedded() {
    return JSON.parse($("#exam-data").textContent);
  }

  function renderExam() {
    try { exam = loadEmbedded(); }
    catch (e) { return showError("문제 데이터를 읽지 못했습니다."); }
    examId = exam.id || "exam";
    Eng.normalizeExam(exam);
    setHeader(exam.title, exam.subtitle);

    const multi = exam.questions.some(q => q.type === "choice");
    let html = `<div class="card notice"><b>응시 안내</b><ul>
      <li>각 문항에 답안을 작성한 뒤 맨 아래 <b>[답안 제출]</b>을 누르면 자동 채점됩니다.</li>
      <li>서술형은 모범답안의 <b>핵심 채점요소</b> 포함 여부로 채점합니다. 정확한 용어가 없어도 <b>같은 취지의 표현</b>이 있으면 부분점수를 줍니다.</li>
      <li>단답형은 소문항별로 채점합니다. 숫자는 단위까지 쓰세요(예: 3,000만 원, 0.05%).</li>
      ${multi ? "<li>객관식은 보기를 선택하세요.</li>" : ""}
      <li>합격 기준: 총점 ${exam.pass.percent}% 이상${exam.pass.subjectMinPercent ? `, 과목별 ${exam.pass.subjectMinPercent}% 이상` : ""}${exam.timeLimitMin ? ` · 제한시간 ${exam.timeLimitMin}분` : ""}</li>
      <li>채점은 이 브라우저 안에서만 합니다. 답안과 점수를 외부로 보내지 않습니다.</li>
      <li>답안은 어디에도 저장하지 않습니다. 새로고침하면 지워지니 주의하세요.</li></ul></div>`;

    let prevSection = null;
    exam.questions.forEach(q => {
      if (q.section && q.section !== prevSection) html += `<div class="section-title">${esc(q.section)}</div>`;
      prevSection = q.section || prevSection;
      const no = String(q.no).padStart(2, "0");
      const typeLabel = q.type === "short" ? "단답형" : q.type === "choice" ? "객관식" : "약술형";
      html += `<div class="card" id="q${q.no}"><div class="q-head"><span class="q-no">문제 ${no}</span>
        ${q.title ? `<span class="q-title">${esc(q.title)}</span>` : ""}
        <span class="tag">${typeLabel} · ${q.points}점</span>${q.subject && q.subject !== "전체" ? `<span class="tag">${esc(q.subject)}</span>` : ""}</div>
        <div class="q-text">${esc(q.question)}</div>`;
      if (q.type === "short") {
        q.parts.forEach((p, j) => {
          html += `<div class="short-part"><label for="a${q.no}_${j}">${esc(p.label)}</label>
            <input type="text" id="a${q.no}_${j}" data-q="${q.no}" autocomplete="off"></div>`;
        });
      } else if (q.type === "choice") {
        const isMulti = Array.isArray(q.answer) && q.answer.length > 1;
        q.choices.forEach((c, j) => {
          html += `<label class="choice"><input type="${isMulti ? "checkbox" : "radio"}" name="a${q.no}" value="${j + 1}" data-q="${q.no}">
            <span>${esc(c)}</span></label>`;
        });
        if (isMulti) html += '<div class="meta">복수 정답 문항입니다.</div>';
      } else {
        html += `<textarea id="a${q.no}" data-q="${q.no}" placeholder="답안을 작성하세요."></textarea>
          <div class="meta"><span id="len${q.no}">0</span>자</div>`;
      }
      html += `<div class="meta" style="text-align:left;margin-top:10px">
          <button class="btn secondary small" type="button" data-check="${q.no}">이 문제 중간 확인</button></div>
        <div id="interim${q.no}"></div></div>`;
    });
    html += `<div class="center" style="margin-top:24px"><p id="unansweredWarn" class="notice hidden"></p>
      <button class="btn" id="submitBtn" type="button">답안 제출</button></div>`;
    app.innerHTML = html;

    app.removeEventListener("input", onInput);
    app.removeEventListener("click", onExamClick);
    app.addEventListener("input", onInput);
    app.addEventListener("click", onExamClick);
    $("#submitBtn").addEventListener("click", () => onSubmit(false));
    startTimer();
  }

  function onExamClick(e) {
    const btn = e.target.closest("[data-check]");
    if (btn) onInterimCheck(Number(btn.dataset.check));
  }

  function onInterimCheck(no) {
    const q = exam.questions.find(x => x.no === no);
    if (!q) return;
    const answer = collectOneAnswer(q);
    const it = Eng.gradeQuestion(q, answer, SITE.grading);
    const box = $("#interim" + no);
    box.innerHTML = `<div class="interim-box"><div class="q-head"><b>중간 확인 결과</b><span class="q-score">${it.score} / ${it.max}점</span></div>
      ${reviewBodyHtml(q, answer, it)}</div>`;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function reviewBodyHtml(q, answer, it) {
    const mine = Eng.userAnswerText(q, answer);
    const empty = Eng.isBlank(q, answer);
    const rub = (it.detail || []).map(d => `<li class="${d.level === "full" ? "hit" : d.level === "part" ? "partial" : "miss"}">
      <span class="mark">${d.level === "full" ? "✓" : d.level === "part" ? "△" : "✗"}</span>
      <span>${esc(d.label)}${d.level === "part" ? " (유사 표현 인정)" : ""}</span><span class="pt">${d.got} / ${d.p}</span></li>`).join("");
    return `<div class="cmp"><div class="box mine"><h4>내 답안</h4>${empty ? '<span class="empty">(미작성)</span>' : esc(mine)}</div>
      <div class="box model"><h4>모범 답안</h4>${esc(Eng.modelAnswerText(q))}</div></div>
      ${q.type === "choice" ? "" : `<ul class="rubric">${rub}</ul>`}
      ${q.explanation ? `<div class="box exp"><b>해설</b> ${esc(q.explanation)}</div>` : ""}`;
  }

  function onInput(e) {
    if (e.target.tagName === "TEXTAREA") $("#len" + e.target.dataset.q).textContent = e.target.value.length;
  }

  /* ---------- 답안 수집 ---------- */
  function collectOneAnswer(q) {
    if (q.type === "short") return q.parts.map((_, j) => $(`#a${q.no}_${j}`).value.trim());
    if (q.type === "choice") {
      const v = [...document.querySelectorAll(`input[name="a${q.no}"]:checked`)].map(i => Number(i.value));
      return Array.isArray(q.answer) && q.answer.length > 1 ? v : (v[0] != null ? v[0] : null);
    }
    return $(`#a${q.no}`).value.trim();
  }
  function collectAnswers() { return exam.questions.map(collectOneAnswer); }

  /* ---------- 타이머 ---------- */
  function startTimer() {
    const bar = $("#timerBar");
    if (!exam.timeLimitMin) { bar.classList.add("hidden"); return; }
    const start = Date.now();
    const end = start + exam.timeLimitMin * 60000;
    bar.classList.remove("hidden");
    const tick = () => {
      const left = Math.max(0, end - Date.now());
      const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
      bar.textContent = `남은 시간 ${m}:${String(s).padStart(2, "0")}`;
      bar.classList.toggle("low", left < 5 * 60000);
      if (left <= 0) { clearInterval(timerId); onSubmit(true); }
    };
    tick(); timerId = setInterval(tick, 1000);
  }
  function stopTimer() {
    if (timerId) clearInterval(timerId);
    $("#timerBar").classList.add("hidden");
  }

  /* ---------- 제출 (브라우저 안에서만 채점) ---------- */
  function onSubmit(force) {
    if (submitting) return;
    const answers = collectAnswers();
    const blank = exam.questions.filter((q, i) => Eng.isBlank(q, answers[i]) || (q.type === "short" && answers[i].some(v => !v))).map(q => q.no);
    const warn = $("#unansweredWarn");
    if (!force && blank.length && warn.dataset.confirmed !== "1") {
      warn.textContent = `미작성(또는 일부 미작성) 문항: ${blank.join(", ")}번. 그대로 제출하려면 [답안 제출]을 한 번 더 누르세요.`;
      warn.classList.remove("hidden"); warn.dataset.confirmed = "1"; return;
    }
    submitting = true; stopTimer();
    const result = Eng.gradeExam(exam, answers, SITE.grading);
    renderResult(answers, result);
  }

  /* ---------- 결과 ---------- */
  function renderResult(answers, r) {
    const msgs = Object.assign({ pass: "합격을 축하합니다.", fail: "조금만 더 분발해주세요." }, SITE.messages || {}, exam.messages || {});
    let html = `<div class="card result-hero ${r.pass ? "pass" : "fail"}">
      <div class="score">${r.total}<small> / ${r.max}점</small></div>
      <div class="msg">${esc(r.pass ? msgs.pass : msgs.fail)}</div>
      ${r.subjFail ? `<div class="notice" style="margin-top:6px">과목별 최소 점수(${exam.pass.subjectMinPercent}%) 미달 과목이 있습니다.</div>` : ""}</div>`;

    if (r.subjects.length > 1) {
      html += `<div class="card"><b>과목별 점수</b><table class="subj" style="margin-top:10px"><tr><th>과목</th><th class="num">점수</th><th class="num">만점</th><th class="num">득점률</th></tr>` +
        r.subjects.map(s => {
          const pct = s.max ? Math.round(s.score / s.max * 1000) / 10 : 0;
          const bad = exam.pass.subjectMinPercent && pct < exam.pass.subjectMinPercent;
          return `<tr><td>${esc(s.name)}</td><td class="num">${s.score}</td><td class="num">${s.max}</td><td class="num ${bad ? "subj-fail" : ""}">${pct}%${bad ? " (과락)" : ""}</td></tr>`;
        }).join("") + "</table></div>";
    }

    html += `<div class="card"><b>문항별 점수</b> <span class="notice">(누르면 해당 문항으로 이동)</span><div class="grid" style="margin-top:12px">` +
      r.items.map(it => {
        const cls = it.score >= it.max ? "full" : it.score > 0 ? "mid" : "zero";
        return `<a class="chip ${cls}" href="#r${it.no}">Q${String(it.no).padStart(2, "0")}<b>${it.score}</b></a>`;
      }).join("") + "</div></div>";

    html += '<div class="section-title">문항별 정답 비교 및 해설</div>';
    exam.questions.forEach((q, i) => {
      const it = r.items[i];
      html += `<div class="card" id="r${q.no}"><div class="q-head"><span class="q-no">문제 ${String(q.no).padStart(2, "0")}</span>
        ${q.title ? `<span class="q-title">${esc(q.title)}</span>` : ""}<span class="q-score">${it.score} / ${it.max}점</span></div>
        <div class="q-text">${esc(q.question)}</div>
        ${reviewBodyHtml(q, answers[i], it)}</div>`;
    });
    html += `<div class="actions"><button class="btn secondary" type="button" id="printBtn">결과 인쇄 / PDF 저장</button>
      <button class="btn secondary" type="button" id="retryBtn">다시 풀기</button>
      <a class="btn" href="./">다른 회차 선택</a></div>`;
    app.innerHTML = html;
    $("#printBtn").addEventListener("click", () => window.print());
    $("#retryBtn").addEventListener("click", () => { submitting = false; renderExam(); window.scrollTo({ top: 0 }); });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  renderExam();
})();

</script>
</body>
</html>
