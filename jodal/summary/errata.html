<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="NaverBot" content="noindex, nofollow">
<meta name="Yeti" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교재 정오표</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --ink: #1f2933; --muted: #616e7c; --line: #dde3ea;
    --brand: #1d4e89; --brand-soft: #e8f0fa; --old: #b42318; --new: #1a7f4b;
    --warn: #b54708; --warn-soft: #fdf1e7; --err-soft: #fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --card: #1b2027; --ink: #e6e9ee; --muted: #9aa5b1; --line: #2c333d;
      --brand: #7fb0ec; --brand-soft: #1d2a3a; --old: #ff8a80; --new: #6fd3a0;
      --warn: #f0b44c; --warn-soft: #33270f; --err-soft: #3a1f1f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
         font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  .crumb { font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
  .crumb a { color: var(--brand); text-decoration: none; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px;
          padding: 6px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
  .chip b { color: var(--brand); margin-left: 4px; }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip[aria-pressed="true"] b { color: #fff; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tools input, .tools select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
                 background: var(--card); color: var(--ink); font: inherit; }
  .tools input { flex: 1 1 240px; min-width: 0; }
  .tools button { padding: 9px 14px; border: 1px solid var(--brand); color: var(--brand); background: var(--card);
                  border-radius: 8px; font: inherit; font-size: .9rem; cursor: pointer; }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }
  h2.book { font-size: 1.1rem; margin: 28px 0 10px; color: var(--brand); display: flex; gap: 8px; align-items: baseline; }
  h2.book small { color: var(--muted); font-weight: 400; font-size: .85rem; }
  .tw { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { background: var(--brand-soft); font-size: .82rem; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.pg { white-space: nowrap; font-weight: 700; }
  td.b { color: var(--old); } td.a { color: var(--new); }
  td.b, td.a { white-space: pre-wrap; min-width: 200px; }
  .sub { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .date { white-space: nowrap; font-size: .82rem; color: var(--muted); }
  .newtag { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--warn); background: var(--warn-soft);
            border-radius: 4px; padding: 0 6px; margin-left: 4px; }
  .box { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; color: var(--muted); }
  .box.err { background: var(--err-soft); border-style: solid; color: var(--ink); }
  .box a { color: var(--brand); }
  footer { margin-top: 32px; color: var(--muted); font-size: .82rem; }
  footer a { color: var(--brand); }
  @media (max-width: 720px) {
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
    td { border: 0; padding: 4px 14px; }
    td[data-l]::before { content: attr(data-l); display: block; font-size: .75rem; color: var(--muted); font-weight: 700; }
    td.b, td.a { min-width: 0; }
  }
  @media print {
    .tools, .bar, .crumb { display: none; } body { background: #fff; }
    .tw { border: 0; overflow: visible; } h2.book { break-after: avoid; } tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="../../">study-vault</a> / <a href="../">jodal</a> / <a href="./">summary</a> / errata</div>
  <h1>교재 정오표</h1>
  <p class="meta" id="meta">원본 사이트에서 불러오는 중…</p>

  <div class="bar" id="chips" role="group" aria-label="교재 필터"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="내용 검색 (예: 낙찰하한율, 선금)">
    <select id="dateSel" aria-label="반영일"><option value="">반영일 전체</option></select>
    <button type="button" id="reloadBtn">새로고침</button>
    <button type="button" id="csvBtn">CSV 저장</button>
    <button type="button" onclick="window.print()">인쇄</button>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>

  <footer>
    원본: <a href="https://www.jodalmaster.net/textbook/" target="_blank" rel="noopener noreferrer">주요(긴급) 개정 정오표</a>.
    이 페이지를 열 때마다 원본을 새로 읽습니다. 교재명과 페이지 순으로 정렬해 보여 줍니다.
    작성자 이름·이메일 등 개인정보는 화면에 쓰지 않고 저장하지도 않습니다.
  </footer>
</div>

<script>
(function () {
  "use strict";
  var API = "https://www.jodalmaster.net/textbook/api.php";
  var BOOKS = ["공공조달의 이해", "공공조달 계획분석", "공공계약관리", "공공조달 관리실무"];
  var rows = [], books = BOOKS.slice(), sel = "", latest = "";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  /* "[수정 1] …\n[수정 2] …" 형식을 번호별로 나눈다 */
  function splitItems(v) {
    var s = v == null ? "" : String(v);
    var out = {}, re = /\[수정\s*(\d+)\]\s*/g, m, last = null, lastIdx = 0;
    while ((m = re.exec(s))) {
      if (last !== null) out[last] = s.slice(lastIdx, m.index).trim();
      last = +m[1]; lastIdx = re.lastIndex;
    }
    if (last !== null) out[last] = s.slice(lastIdx).trim();
    else if (s.trim()) out[1] = s.trim();
    return out;
  }
  var pageNo = function (p) { var m = String(p || "").match(/\d+/); return m ? +m[0] : 1e6; };
  var bookIdx = function (b) { var i = BOOKS.indexOf(b); return i < 0 ? 99 : i; };
  /* 원본 사이트와 같은 기준: 처리 완료(resolved)된 긴급 정오표만 */
  var isUrgent = function (t) {
    return t.status === "resolved" && (t.isUrgent === true || String(t.is_urgent) === "1");
  };
  /* 페이지 칸이 비었으면 수정 전 내용에서 "224페이지", "p.165" 같은 표기를 찾는다 */
  function guessPage(text) {
    var s = String(text || ""), m = s.match(/p\.?\s*\d+(?:\s*[~,·-]\s*\d+)*/i) || s.match(/\d+(?:\s*[~,·-]\s*\d+)*\s*(?:페이지|쪽)/);
    return m ? m[0].trim() : "";
  }

  /* 필요한 칸만 꺼낸다. 이름·이메일·작성자 칸은 읽지 않는다. */
  function toRows(tickets) {
    var out = [];
    tickets.filter(isUrgent).forEach(function (t) {
      var f = {
        page: splitItems(t.page_content), loc: splitItems(t.location_content),
        before: splitItems(t.before_content), after: splitItems(t.after_content), reason: splitItems(t.reason_content)
      };
      var nums = {};
      Object.keys(f).forEach(function (k) { Object.keys(f[k]).forEach(function (n) { nums[n] = 1; }); });
      var list = Object.keys(nums).map(Number).sort(function (a, b) { return a - b; });
      if (!list.length) list = [0];
      list.forEach(function (n) {
        var pg = f.page[n] || "", guessed = false;
        if (!pg) { pg = guessPage(f.before[n]) || guessPage(f.loc[n]); guessed = !!pg; }
        out.push({
          book: String(t.textbook || "").trim(), page: pg, guessed: guessed, loc: f.loc[n] || "",
          before: f.before[n] || "", after: f.after[n] || "", reason: f.reason[n] || "",
          no: n, kind: t.suggestion_type || "", title: t.title || "",
          date: String(t.date || "").slice(0, 10), ticket: String(t.id || "")
        });
      });
    });
    out.sort(function (x, y) {
      return bookIdx(x.book) - bookIdx(y.book) || x.book.localeCompare(y.book) ||
        pageNo(x.page) - pageNo(y.page) || x.page.localeCompare(y.page) ||
        x.date.localeCompare(y.date) || (+x.ticket - +y.ticket) || (x.no - y.no);
    });
    return out;
  }

  function chips() {
    var html = '<button class="chip" data-b="" aria-pressed="' + (sel === "") + '">전체<b>' + rows.length + "</b></button>";
    books.forEach(function (b) {
      var n = rows.filter(function (r) { return r.book === b; }).length;
      html += '<button class="chip" data-b="' + esc(b) + '" aria-pressed="' + (sel === b) + '">' + esc(b) + "<b>" + n + "</b></button>";
    });
    $("#chips").innerHTML = html;
    document.querySelectorAll(".chip").forEach(function (c) {
      c.onclick = function () { sel = c.getAttribute("data-b"); chips(); render(); };
    });
  }

  function filtered() {
    var q = $("#q").value.trim().toLowerCase(), d = $("#dateSel").value;
    return rows.filter(function (r) {
      if (sel && r.book !== sel) return false;
      if (d && r.date !== d) return false;
      if (!q) return true;
      return [r.book, r.page, r.loc, r.kind, r.title, r.before, r.after, r.reason].join(" ").toLowerCase().indexOf(q) >= 0;
    });
  }

  function render() {
    var list = filtered();
    $("#count").textContent = list.length + "건 표시";
    if (!list.length) { $("#list").innerHTML = '<div class="box">조건에 맞는 정오표가 없습니다.</div>'; return; }
    var html = "";
    books.forEach(function (b) {
      var g = list.filter(function (r) { return r.book === b; });
      if (!g.length) return;
      html += '<h2 class="book">' + esc(b) + "<small>" + g.length + "건</small></h2>" +
        '<div class="tw"><table><thead><tr><th>페이지</th><th>위치</th><th>수정 전</th><th>수정 후</th><th>사유</th><th>반영일</th></tr></thead><tbody>' +
        g.map(function (r) {
          return "<tr>" +
            '<td class="pg" data-l="페이지">' + esc(r.page || "-") + (r.guessed ? '<span class="sub">본문에서 찾음</span>' : "") + "</td>" +
            '<td data-l="위치">' + esc(r.loc || "-") + (r.title ? '<span class="sub">' + esc(r.title) + "</span>" : "") + "</td>" +
            '<td class="b" data-l="수정 전">' + esc(r.before) + "</td>" +
            '<td class="a" data-l="수정 후">' + esc(r.after) + "</td>" +
            '<td data-l="사유">' + esc(r.reason || r.kind) + "</td>" +
            '<td class="date" data-l="반영일">' + esc(r.date) + (r.date && r.date === latest ? '<span class="newtag">NEW</span>' : "") + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    });
    $("#list").innerHTML = html;
  }

  function load() {
    $("#meta").textContent = "원본 사이트에서 불러오는 중…";
    fetch(API + "?v=" + Date.now(), { cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        var tickets = Array.isArray(j.tickets) ? j.tickets : Object.values(j.tickets || {});
        rows = toRows(tickets);
        books = BOOKS.concat(rows.map(function (r) { return r.book; })
          .filter(function (b, i, a) { return b && BOOKS.indexOf(b) < 0 && a.indexOf(b) === i; }));
        var dates = rows.map(function (r) { return r.date; })
          .filter(function (d, i, a) { return d && a.indexOf(d) === i; }).sort().reverse();
        latest = dates[0] || "";
        $("#dateSel").innerHTML = '<option value="">반영일 전체</option>' +
          dates.map(function (d) { return '<option value="' + esc(d) + '">' + esc(d) + "</option>"; }).join("");
        var n = tickets.filter(isUrgent).length;
        $("#meta").textContent = "정오표 " + n + "묶음 · 수정 " + rows.length + "건 · 최근 반영 " + (latest || "-") +
          " · 불러온 시각 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
        chips(); render();
      })
      .catch(function (e) {
        $("#meta").textContent = "불러오지 못했습니다.";
        $("#chips").innerHTML = ""; $("#count").textContent = "";
        $("#list").innerHTML = '<div class="box err">원본 사이트에서 정오표를 읽지 못했습니다. (' + esc(e.message) + ')<br>' +
          '잠시 후 [새로고침]을 누르거나 <a href="https://www.jodalmaster.net/textbook/" target="_blank" rel="noopener noreferrer">원본 페이지</a>에서 확인하세요.</div>';
      });
  }

  $("#csvBtn").onclick = function () {
    var head = ["교재명", "페이지", "위치", "수정 전", "수정 후", "사유", "반영일", "정오표 제목"];
    var cell = function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
    var lines = [head.map(cell).join(",")].concat(filtered().map(function (r) {
      return [r.book, r.page, r.loc, r.before, r.after, r.reason || r.kind, r.date, r.title].map(cell).join(",");
    }));
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "정오표_" + (sel || "전체") + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
  $("#q").addEventListener("input", render);
  $("#dateSel").addEventListener("change", render);
  $("#reloadBtn").onclick = load;
  load();
})();
</script>
</body>
</html>
