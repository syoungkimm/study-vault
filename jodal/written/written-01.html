문 1. 공공조달의 본질적 특성 및 민간 구매와의 비교 설명 중 가장 옳지 않은 것은?
① 공공조달은 이윤 극대화가 아닌 공익 실현, 예산 집행의 효율성(VFM), 사회적 가치 창출을 본원적 목적으로 한다.
② 공공조달은 세금을 재원으로 하므로 법정 절차 준수, 정보의 대외 공개, 엄격한 법적 책임성이 요구된다.
③ 민간 구매의 7R 항목에는 Right Product, Right Price, Right Time, Right Quality, Right Quantity, Right Customer, Right Place가 포함되며, Right Regulation은 포함되지 않는다.
④ 공공조달은 예산 절감이 최우선이므로 품목의 제반 사양과 상관없이 항상 최초 구매 단가가 가장 낮은 최저가 투찰자를 낙찰자로 선정해야 한다.
문 2. Harland 등의 조달 성숙도 7단계 모델(Procurment Maturity Model)에 대한 설명으로 옳은 것은?
① State 1은 법령 준수와 규정 이행을 최우선으로 하는 단계이다.
② State 3은 공공자금의 단순 효율적 사용을 넘어 비용 대비 가치(VFM)를 본격 추구하는 단계이다.
③ State 5는 조달을 국정 및 기관의 전략적 정책 성과를 견인하는 핵심 수단으로 활용하는 단계이다.
④ 우리나라 공공조달의 현재 성숙도는 단순 물품 구매 단계인 State 1 수준에 머물러 있다.
문 3. 조달주체 3분법상 조달청의 법적 지위에 관한 설명으로 옳은 것은?
① 조달청이 타 수요기관의 요청으로 구매계약을 대행 체결할 때 조달청의 지위는 '수요자'이다.
② 조달청이 타 수요기관의 계약을 대행할 때 실제 물품을 인수하여 사용하는 기관이 '수요자'이고, 조달청은 '계약 수탁자(이해관계자)'이다.
③ 조달청이 자사 청사에서 직접 사용할 소모품을 구매할 때 조달청의 지위는 '공급자'이다.
④ 조달청은 대한민국 모든 공공기관의 물품 구매를 독점적으로 전담하는 단일 중앙조달 지위만을 갖는다.
문 4. 공공조달의 국제 5대 기본원칙 및 OECD 12대 실행원칙에 대한 설명으로 옳지 않은 것은?
① 국제 5대 기본원칙에는 투명성, 비용 대비 가치(VFM), 경쟁성, 차별 금지 및 동등 대우, 책임성이 포함된다.
② OECD 2015 공공조달 12대 실행원칙에는 청렴성(Integrity)과 위험관리(Risk Management)가 명시되어 있다.
③ UNCITRAL 공공조달모델법(2011)은 비경쟁 방식인 수의계약을 원칙적인 조달방법으로 규정한다.
④ UNCITRAL 모델법상 대화기반 제안요청은 사양 확정이 어려운 복잡한 사업에서 공급자와 대화를 거쳐 사양을 확정하는 방식이다.
문 5. 전자조달 시스템에서 활용되는 5대 금액 지표에 대한 설명으로 옳은 것은?
① 사업금액: 부가가치세와 관급자재대를 제외한 pure 도급 예정액이다.
② 추정가격: 부가가치세와 관급자재대를 제외한 금액으로, GPA 국제입찰 및 수의계약 적용 기준이 된다.
③ 기초금액: 발주기관이 작성한 조사금액에서 부가가치세를 차감하여 사전에 비공개하는 금액이다.
④ 예정가격: 입찰 공고문에 사전 명시되어 공개되는 최저 투찰 기준 금액이다.
문 6. 예정가격 결정을 위한 복수예비가격 작성 범위 및 확정 메커니즘에 대한 설명으로 옳지 않은 것은?
① 국가계약법 적용 입찰은 기초금액 기준 ±2% 범위 내에서 복수예비가격 15개를 작성한다.
② 지방계약법 적용 입찰은 기초금액 기준 ±3% 범위 내에서 복수예비가격 15개를 작성한다.
③ 예정가격은 15개의 복수예비가격 중 입찰참가자들이 가장 많이 추첨한 4개 예비가격의 산술평균으로 확정된다.
④ 복수예비가격 4개를 산술평균하여 예정가격을 산출할 때 소수점 이하 금액은 반올림하여 원 단위까지 반영한다.
문 7. 물품목록번호(16자리) 및 세부품명번호(10자리)의 구성 체계로 올바른 것은?
① 물품목록번호: 물품분류번호(8자리) + 물품식별번호(8자리)
② 물품목록번호: 세부품명번호(10자리) + 업체등록번호(6자리)
③ 세부품명번호 10자리는 직접생산확인 및 중기간 경쟁제품 지정의 표준 단위로 활용되지 않는다.
④ 물품식별번호 8자리는 UNSPSC 국제표준 분류 코드를 그대로 사용한다.
문 8. 국가계약법상 1인 견적 수의계약과 2인 이상 전자견적 소액수의계약의 법정 한도 기준으로 옳은 것은?
① 일반 기업 대상 1인 견적 수의계약 한도: 추정가격 3,000만 원 이하
② 여성기업, 장애인기업, 사회적기업 등 우대기업 대상 1인 견적 수의계약 한도: 추정가격 5,000만 원 이하
③ 2인 이상 전자견적 소액수의계약(물품·일반용역)의 낙찰하한율: 예정가격의 80.495% 이상
④ 500만 원 이하의 소액구매는 정식 전자입찰 공고와 서면 계약서 작성을 반드시 거쳐야 한다.
문 9. 「중소기업제품 구매촉진 및 판로지원에 관한 법률」상 중소기업자 간 경쟁제품 지정 및 직접생산확인에 관한 설명으로 옳지 않은 것은?
① 중소기업자 간 경쟁제품으로 지정되려면 국내 직접생산 중소기업이 10개 이상, 연간 공공 구매실적이 10억 원 이상이어야 한다.
② 중소기업자 간 경쟁제품의 법정 지정 유효기간은 3년이다.
③ 직접생산확인증명서의 법정 발급 유효기간은 2년이다.
④ 중소기업자 간 경쟁제품 입찰에는 대기업의 하도급 지분 참가가 금액에 상관없이 전면 허용된다.
문 10. 공공기관의 녹색제품 우선구매 제도에 대한 설명으로 가장 옳지 않은 것은?
① 공공기관은 당해 연도 구매 총액의 50% 이상을 녹색제품으로 구매하도록 노력해야 한다.
② 녹색제품 3대 법정 인증에는 환경표지인증, 우수재활용(GR)인증, 환경성적표지인증이 포함된다.
③ 저탄소제품인증은 공공기관 매년 녹색제품 구매실적 공표 시 실적 합산 대상에 포함된다.
④ 환경표지인증은 환경부(한국환경산업기술원), GR인증은 산업통상자원부(자원순환산업진흥협회) 소관이다.
문 11. 조달청 '혁신제품 지정제도' 및 특례 지원에 관한 설명으로 옳지 않은 것은?
① 혁신제품으로 지정되면 지정 후 3년간 공공기관과 금액 제한 없이 수의계약 체결이 가능하다.
② 혁신제품을 구매하여 사용한 공공기관 담당 공무원에게 고의·중과실이 없으면 책임을 면제하는 '구매자 면책 제도'가 적용된다.
③ 혁신제품은 오직 대기업이 개발한 완성품에 한해서만 신청할 수 있다.
④ 조달청 예산으로 우선 구매하여 공공기관에 제공하고 테스트하는 '시범구매 사업'이 운영된다.
문 12. 사회적 약자 기업 및 복지 단체 생산품 우선구매 제도의 법적 성격 비교로 옳은 것은?
① 여성기업 제품 우선구매: 물품·용역 5% 이상, 공사 3% 이상 강제 의무 구매
② 장애인기업 제품 우선구매: 총 구매액의 1% 이상 강제 의무 구매
③ 중증장애인생산품 우선구매: 공공기관 총 구매액의 1% 이상 강력한 법적 강제 의무 구매
④ 사회적기업 제품 우선구매: 총 구매액의 10% 이상 강제 의무 구매
문 13. 공공계약 관련 소관 관할 부처의 연결이 올바르게 짝지어진 것은?
① 국가계약법 - 기획재정부(재정경제부) / 지방계약법 - 행정안전부
② 국가계약법 - 행정안전부 / 지방계약법 - 재정경제부
③ 조달사업법 - 산업통상자원부 / 판로지원법 - 기획재정부
④ 전자조달법 - 과학기술정보통신부 / 녹색제품구매법 - 중소벤처기업부
문 14. 서면 계약서 작성을 생략하고 견적서 등으로 갈음할 수 있는 소액계약 한도로 옳은 것은?
① 국가계약법: 2,000만 원 이하 / 지방계약법: 2,000만 원 이하
② 국가계약법: 3,000만 원 이하 / 지방계약법: 5,000만 원 이하
③ 국가계약법: 5,000만 원 이하 / 지방계약법: 3,000만 원 이하
④ 국가계약법: 1억 원 이하 / 지방계약법: 1억 원 이하
문 15. WTO 정부조달협정(GPA) 적용 대상 국제입찰의 추정가격 기준금액(고시금액)으로 옳은 것은?
① 국가기관 물품·용역: 2.3억 원 이상 / 국가기관 공사: 88억 원 이상
② 지방자치단체 물품·용역: 2.3억 원 이상 / 지자체 공사: 88억 원 이상
③ 국가기관 물품·용역: 3.5억 원 이상 / 국가기관 공사: 265억 원 이상
④ 지자체 물품·용역: 5.0억 원 이상 / 지자체 공사: 300억 원 이상
문 16. 공공계약의 민법상 법적 성질에 관한 설명으로 옳지 않은 것은?
① 국가나 지자체가 체결하는 공공계약은 사경제 주체로서 대등하게 체결하는 사법상 계약이다.
② 공공계약에는 민법상 사적 자치의 원칙과 신의성실의 원칙이 준용된다.
③ 발주기관이 계약상대자의 채무불이행으로 계약보증금을 국고에 귀속시킨 조치는 민사소송 대상이다.
④ 부정당업자 입찰참가자격 제한 처분은 사법상 통지에 불과하므로 민사소송으로 다투어야 한다.
문 17. 민법상 도급계약과 위임계약의 차이점에 대한 설명으로 옳지 않은 것은?
① 도급계약은 '일의 완성(결과)'을 목적으로 하고, 위임계약은 '사무 처리(과정)'를 목적으로 한다.
② 도급계약에서 수급인은 완성된 목적물에 하자가 있는 경우 무과실 하자담보책임을 진다.
③ 위임계약에서 수임인은 사무 처리 시 선량한 관리자의 주의의무(선관주의의무)를 다해야 한다.

③ 리스크 모니터링 → 리스크 식별 → 리스크 대응 → 리스크 평가

문 45. 리스크 대응 4대 전략과 구체적 실행 수단의 연결이 잘못된 것은?
① 위험 회피 (Avoidance): 기술적 리스크가 극도로 높은 신규 사업 추진을 전면 취소함.
② 위험 전가 (Transfer): 시공사에게 계약이행보증서 제출을 요구하거나 손해보험에 가입시킴.
③ 위험 완화 (Mitigation): 물가변동 조정(ESC) 조항을 명시하여 자재가 급등 충격을 완화함.
④ 위험 수용 (Acceptance): 제3자 보증기관을 통해 손실 위험을 100% 보증기관으로 넘김.

② 정성적 평가는 제안서평가위원회가 주관적 평가를 수행한다.

④ 발표회(PT) 진행 시 공정성을 위해 타 제안업체의 참관을 전면 허용해야 한다.

문 1. [정답] ④
해설: 공공조달은 단순 최저가 구매를 넘어 자산의 취득부터 운영, 유지보수, 폐기까지의 생애주기 전체 비용과 품질을 종합적으로 고려하는 비용 대비 가치(VFM: Value for Money)를 지향합니다. 따라서 오직 최초 구매 가격만을 기준으로 최저가를 낙찰하는 것은 올바르지 않습니다.
문 2. [정답] ③
해설: Harland 등의 조달 성숙도 7단계 모델에서 State 1(물품 조달) → State 2(법령 준수) → State 3(공공자금 효율적 사용) → State 4(상업적 접근) → State 5(VFM 본격 추구) → State 6(전략적 정책 성과 견인) → State 7(국제 조달 리더십)로 진화합니다. 따라서 VFM을 본격 추구하는 단계는 State 5이며, 전략적 정책 성과를 견인하는 단계는 State 6입니다.
문 3. [정답] ②
해설: 조달청이 타 수요기관의 중앙조달 요청을 받아 구매를 대행할 때 조달청은 계약 수탁자(이해관계자)의 지위에 서며, 물품을 실제로 인수하여 사용하는 기관이 수요자(발주기관)입니다. (조달청이 자체 청사 소모품을 직접 구매할 때만 '수요자'가 됩니다.)

<script>
// 작가님의 원문 텍스트를 인식하여 JSON 데이터로 변환하는 파싱(Parsing) 엔진
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱
    const aBlocks = aText.split(/^(?=문 \d+\.\s*\[정답\])/gm).filter(b => /^문 \d+\./.test(b));
    const ansMap = {};
    aBlocks.forEach(block => {
        const match = block.match(/문 (\d+)\.\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=문 \d+\.)/gm).filter(b => /^문 \d+\./.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/문 (\d+)\.\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (문 1 ~ 30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (문 31 ~ 50)",
    3: "제3과목: 공공계약관리 (문 51 ~ 80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);

    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }

    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>
</body>
</html>
