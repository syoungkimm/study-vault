문 1. [킬러] 조달청 「품질보증물품 지정 및 관리규정」상 품질보증물품 지정 제도 및 혜택에 관한 설명으로 가장 옳지 않은 것은?
① 품질보증물품으로 지정되면 지정기간 동안 조달청 납품검사(합동검사 및 전문기관검사)가 면제된다.
② 품질보증예비물품은 지정일로부터 1년간 납품검사가 면제된다.
③ 품질보증물품의 지정 유효기간은 등급(S등급, A등급, B등급)에 따라 3년에서 최대 5년까지 차등 부여된다.
④ 품질보증물품으로 지정된 제품이라 할지라도 건설공사 현장에 직접 납품되는 레미콘·아스콘 등 현장 품질관리 품목은 납품검사 면제 대상에서 전면 배제된다.

문 2. [품질관리] 공공조달 물품의 납품검사 및 품질점검 체계에 대한 설명으로 가장 옳지 않은 것은?
① 발주기관의 장은 납품검사 결과 불합격된 물품에 대하여 계약상대자에게 시정기간을 정하여 재납품을 요구할 수 있다.
② 전문기관검사는 추정가격이 일정 금액 이상이거나 국민의 생명·안전과 직결된 품목에 대해 조달청장이 지정한 전문검사기관이 수행한다.
③ 관급자재 및 주요 조달물품에 대한 품질점검 결과 불합격 판정을 받은 경우, 해당 품목은 나라장터 종합쇼핑몰에서 즉시 거래정지 처분을 받을 수 있다.
④ 하자검사는 하자담보책임기간 동안 연 1회 이상 정기적으로 실시해야 하며, 담보기간 만료 14일 전에는 반드시 최종 검사를 마쳐야 한다.

문 3. [안전관리] 「산업안전보건법」 및 「중대재해 처벌 등에 관한 법률」과 공공조달 계약의 연계에 대한 설명으로 가장 옳지 않은 것은?
① 공공기관이 공사 또는 용역 계약을 체결할 때에는 도급인의 안전보건조치 의무 이행을 위해 '안전보건이행서약서'를 제출받아야 한다.
② 건설공사 계약 시 발주자는 도급금액에 관계없이 관계 법령이 정하는 기준에 따라 산업안전보건관리비를 의무적으로 계상해야 한다.
③ 계약상대자가 사업장에서 중대재해를 발생시켜 처벌을 받은 경우, 조달청 적격심사 신인도 평가에서 감점 처리될 수 있다.
④ 산업안전보건관리비는 사후 정산이 불가능하므로, 시공사가 사용하지 않고 남긴 잔액은 시공사의 순이익으로 확정 귀속된다.

문 4. [환경/기술인증] 「중소기업제품 구매촉진 및 판로지원에 관한 법률」상 기술개발제품 인증 4종(NEP, NET, 성능인증, 우수조달물품)의 법정 유효기간 연결이 올바른 것은?
① NEP(신제품인증): 3년 / NET(신기술인증): 3년 / 성능인증(EPC): 3년 / 우수조달물품: 3년
② NEP(신제품인증): 5년 / NET(신기술인증): 5년 / 성능인증(EPC): 2년 / 우수조달물품: 1년
③ NEP(신제품인증): 3년 / NET(신기술인증): 2년 / 성능인증(EPC): 5년 / 우수조달물품: 5년
④ NEP(신제품인증): 2년 / NET(신기술인증): 1년 / 성능인증(EPC): 3년 / 우수조달물품: 2년

문 5. [킬러] 「녹색제품 구매촉진에 관한 법률」상 녹색인증 제품의 구분 및 공공기관 실적 인정에 대한 설명으로 옳지 않은 것은?
① 환경표지인증제품과 우수재활용(GR)인증제품은 법정 녹색제품에 해당하여 공공기관 구매실적에 합산된다.
② 환경성적표지(LCA) 인증을 받은 제품 중 온실가스 감축 기준을 충족하여 '저탄소제품'으로 인증받은 품목은 녹색제품 구매실적 공표 시 실적 합산 대상에 포함된다.
③ 환경표지인증은 환경부(한국환경산업기술원), GR인증은 산업통상자원부(자원순환산업진흥협회)가 담당한다.
④ 공공기관의 장은 매년 구매 총액의 50% 이상을 녹색제품으로 구매하도록 노력해야 할 법적 의무를 진다.

문 6. [숫자] 국가계약 법령과 지방계약 법령상 '서면 계약서 작성 생략'이 가능한 법정 한도 금액의 올바른 세트는?
① 국가계약법: 3,000만 원 이하 / 지방계약법: 5,000만 원 이하
② 국가계약법: 5,000만 원 이하 / 지방계약법: 3,000만 원 이하
③ 국가계약법: 2,000만 원 이하 / 지방계약법: 2,000만 원 이하
④ 국가계약법: 1억 원 이하 / 지방계약법: 1억 원 이하

문 7. [숫자] [2026 최신개정] 국가계약법 제28조에 따른 이의신청 및 국가계약분쟁조정위원회 재심 청구 기한으로 옳게 짝지어진 것은?
① 이의신청: 안 날부터 25일 이내 (사유발생일 30일 이내) / 재심 청구: 회신받은 날부터 30일 이내
② 이의신청: 안 날부터 10일 이내 (사유발생일 15일 이내) / 재심 청구: 회신받은 날부터 15일 이내
③ 이의신청: 안 날부터 15일 이내 (사유발생일 20일 이내) / 재심 청구: 회신받은 날부터 20일 이내
④ 이의신청: 안 날부터 60일 이내 (사유발생일 90일 이내) / 재심 청구: 회신받은 날부터 60일 이내

문 8. [킬러] 국가계약법 및 지방계약법상 부당특약에 관한 설명 중 가장 옳지 않은 것은?
① 계약상대자의 정당한 이익을 부당하게 제한하거나 위험을 전가하는 부당특약은 강행규정 위반으로 사법상 무효이다.
② 부당특약에 대하여 계약상대자는 계약 체결 후에도 이의신청 및 분쟁조정을 청구할 수 있다.
③ 발주기관이 부당특약 수용을 조건으로 입찰참가 자격을 부여한 경우, 해당 입찰공고는 유효하며 부당특약 조문만 자동 수정된 것으로 본다.
④ 지방계약법 제6조 제3항에서도 주민이나 계약상대자의 권리를 부당하게 제한하는 특약의 설정을 엄격히 금지하고 있다.

문 9. 경쟁입찰 참가자격 등록 및 물품목록정보 체계에 대한 설명으로 옳은 것은?
① 경쟁입찰참가자격 등록은 각 공공기관별로 개별 신청해야 하며 나라장터 통합 등록은 불가능하다.
② 물품목록번호(16자리) = 물품분류번호(8자리) + 물품식별번호(8자리)로 구성된다.
③ 세부품명번호 10자리는 개별 업체의 사업자등록번호와 연동되는 임의 코드이다.
④ 제조물품 등록 시 직접생산확인증명서는 제출할 필요가 없다.

문 10. [숫자] 국가계약법상 일반경쟁입찰, 협상에 의한 계약, GPA 국제입찰의 기본 입찰공고 기간(마감일 전날 역산)으로 옳게 연결된 것은?
① 일반경쟁: 최소 7일 / 협상계약(고시금액 이상): 최소 40일 / GPA 국제입찰: 최소 40일
② 일반경쟁: 최소 14일 / 협상계약(고시금액 이상): 최소 20일 / GPA 국제입찰: 최소 20일
③ 일반경쟁: 최소 5일 / 협상계약(고시금액 이상): 최소 30일 / GPA 국제입찰: 최소 30일
④ 일반경쟁: 최소 10일 / 협상계약(고시금액 이상): 최소 15일 / GPA 국제입찰: 최소 50일

문 11. 사전규격공개(사전규격공시) 제도 및 이의제기 처리에 관한 설명으로 옳지 않은 것은?
① 사전규격공개 기간은 원칙적으로 최소 5일 이상이다.
② 조달업체가 규격에 대해 이의제기를 신청한 경우, 발주기관은 접수일로부터 5일 이내에 처리 결과를 나라장터에 공개해야 한다.
③ 추정가격 5,000만 원 미만의 소액계약 및 긴급 재해복구 사업은 사전규격공개를 생략할 수 있다.
④ 사전규격공개에 이의제기가 접수되더라도 입찰공고는 당초 예정일에 강행하여 발주해야 한다.

문 12. [킬러] 입찰 관련 5대 금액 중 '추정가격(Estimated Price)'과 '기초금액'에 대한 설명으로 가장 옳지 않은 것은?
① 추정가격은 예산액에서 부가가치세 및 관급자재대를 제외한 금액으로, GPA 국제입찰 여부 및 수의계약 한도를 판단하는 기준이다.
② 기초금액은 발주기관이 조사한 원가 및 거래실례가격에 부가가치세를 포함하여 입찰공고 시 사전에 대외 공시하는 금액이다.
③ 국가계약법상 복수예비가격 15개는 기초금액의 ±2% 범위 내에서 생성된다.
④ 지방계약법상 복수예비가격 15개는 기초금액의 ±5% 범위 내에서 생성된다.

문 13. [숫자] 중소기업자 간 경쟁제품 지정 및 직접생산확인증명서의 법정 유효기간으로 옳은 것은?
① 경쟁제품 지정: 3년 / 직접생산확인증명서: 2년
② 경쟁제품 지정: 5년 / 직접생산확인증명서: 3년
③ 경쟁제품 지정: 2년 / 직접생산확인증명서: 1년
④ 경쟁제품 지정: 1년 / 직접생산확인증명서: 5년

문 14. 사회적 약자 기업 및 법정 우선구매 제도의 의무 구매 비율 연결이 올바른 것은?
① 여성기업: 물품·용역 5% 이상, 공사 3% 이상 (노력 의무)
② 장애인기업: 총 구매액의 1% 이상 (노력 의무)
③ 중증장애인생산품: 총 구매액의 1% 이상 (강제 의무)
④ 위 내용 모두 올바르게 설명됨

문 15. [킬러] 조달청 '혁신제품 지정제도'의 3가지 유형(패스트트랙 I, II, III) 및 혜택에 관한 설명으로 가장 옳지 않은 것은?
① FT I은 국가 R&D 성과물 중 혁신성이 인정된 제품, FT II는 상용화 전 시제품, FT III는 공공성·혁신성이 인정된 지정 품목이다.
② 혁신제품으로 지정되면 지정일로부터 3년간 금액 제한 없이 수의계약이 가능하다.

④ 혁신제품 구매 실적은 공공기관 평가 시 실적 산정 대상에서 엄격히 차단·제외된다.

① 취득비, 운영비, 유지보수비, 폐기비 등 전 생애주기 비용을 할인율을 적용하여 현재가치로 환산한다.

<script>
// 정밀 매칭 파싱 엔진 (문항 번호 기준 완벽 고정)
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱 (문항 번호별로 정확히 맵핑)
    const ansMap = {};
    aText.split(/^(?=문 \d+\.)/gm).forEach(block => {
        const match = block.match(/문 (\d+)\.\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=문 \d+\.)/gm).filter(b => /^문 \d+\./.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/문 (\d+)\.\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (문 1 ~ 30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (문 31 ~ 50)",
    3: "제3과목: 공공계약관리 (문 51 ~ 80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;


    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
        
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);


    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }


    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

}

window.onload = renderQuiz;
</script>
