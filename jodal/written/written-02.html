<script id="raw-questions" type="text/template">
문 1. 공공조달의 8대 핵심가치 중 '투명성(Transparency)'과 '책임성(Accountability)'에 대한 설명으로 가장 옳지 않은 것은?
① 투명성은 조달 절차, 입찰공고, 제안서 평가 결과, 계약 내역 등을 적시에 대외 공개하여 부정부패를 예방하는 원칙이다.
② 책임성은 조달 의사결정자와 집행자가 자신의 권한 행사와 결과에 대해 국민 및 검증기관에 정당하게 설명하고 책임을 지는 원칙이다.
③ 투명성 확보를 위해 나라장터를 통한 사전규격공개, 입찰 결과 공개, 수의계약 내역 공개 등이 운영된다.
④ 책임성 원칙에 따라 발주기관 담당자는 계약상대자의 불법적 이행에 대해 어떠한 법적·행정적 검증이나 감사도 받지 않는다.
문 2. Harland 등의 조달 성숙도 7단계 모델 중 'State 2(법령 준수)'와 'State 6(전략적 정책 성과 견인)' 단계에 대한 설명으로 옳은 것은?
① State 2는 최신 AI 기술을 활용하여 글로벌 조달 시장을 선도하는 단계이다.
② State 2는 관련 법령, 계약 예규 및 내부 규정을 엄격히 준수하는 것을 최우선 가치로 두는 단계이다.
③ State 6은 단순 물품 수급에 국한하여 최소 비용으로 소모품을 구매하는 초기 단계이다.
④ State 6은 비용 대비 가치(VFM) 개념을 전면 배제하고 오직 최저가 투찰만을 강제하는 단계이다.
문 3. 중앙조달 방식과 분산조달(자체조달) 방식의 상대적 장단점 비교 설명으로 옳지 않은 것은?
① 중앙조달 방식은 조달청 등 전문 기관이 집행하므로 대량 구매를 통한 단가 인하 및 조달 전문성 확보에 유리하다.
② 중앙조달 방식은 수요기관 개별의 특수하고 긴급한 요구사항을 즉각 반영하기에 절차상 한계가 있을 수 있다.
③ 분산조달 방식은 개별 수요기관이 직접 집행하므로 신속성과 유연성이 뛰어나나, 구매력 분산으로 단가 절감 효과가 상대적으로 낮다.
④ 대한민국 공공조달 시장은 모든 물자를 조달청이 100% 전담 구매하는 완전 중앙조달 단일 체계만을 채택하고 있다.
문 4. OECD 2015 공공조달 12대 실행원칙 중 '위험관리(Risk Management)' 및 '전자조달(E-Procurement)'에 관한 설명으로 가장 옳지 않은 것은?
① 위험관리는 조달 전 과정에서 발생할 수 있는 입찰 담합, 이행 지연, 부패 리스크 등을 사전에 식별하고 대응체계를 구축하는 원칙이다.
② 전자조달은 정보통신기술(ICT)을 활용하여 조달 과정의 효율성, 투명성을 높이고 진입장벽을 낮추는 원칙이다.
③ OECD 원칙에 따르면 전자조달 시스템 도입 시 입찰 정보의 대외 접근성을 최대한 제한하여 일부 특권 업체만 응찰하도록 해야 한다.
④ 조달 위험관리는 계약 체결 단계뿐만 아니라 수요 식별, 원가 산정, 이행 관리, 사후 정산 등 조달 전 생애주기에 걸쳐 집행된다.
문 5. UNCITRAL 공공조달모델법(2011)상 '전자역경매(Electronic Reverse Auction)' 및 '기본협정(Framework Agreement)'의 특징으로 옳은 것은?
① 전자역경매는 입찰자들이 지속적으로 더 높은 가격을 투찰하여 최고가를 제시한 자를 낙찰하는 방식이다.
② 전자역경매는 일정한 자격을 갖춘 입찰자들이 온라인상에서 내림차순으로 가격을 투찰하여 최저가를 유도하는 방식이다.
③ 기본협정은 1회성 단발성 계약에만 적용되며 장기적 반복 구매에는 적용할 수 없다.
④ 전자역경매 진행 중 타 입찰자의 실제 회사명과 사업자번호가 모든 참가자에게 실시간 노출되어야 한다.
문 6. 제한경쟁입찰을 부칠 때 발주기관이 제한할 수 있는 법정 자격 사유로 가장 옳지 않은 것은?
① 동등 이상 또는 유사한 사업의 이행 실적
② 특수한 기술, 공법, 장비 및 설비 보유 여부
③ 법인등기부상 본점 소재지 관할 지역 (고시금액 미만 물품·용역 등)
④ 대표자의 특정 학력, 종교, 개인적 친분 관계
문 7. 수의계약 사유 중 '단독공급원(Sole Source)'과 '단일공급원(Single Source)'의 개념을 바르게 비교한 것은?
① 단독공급원(Sole Source): 특허, 독점 기술 등으로 시장에 대체 가능한 공급자가 유일하게 1곳만 존재하는 경우이다.
② 단일공급원(Single Source): 시장에 공급 가능한 업체가 전혀 존재하지 않는 기술적 불가능 상태를 의미한다.
③ 단독공급원은 긴급한 재해복구를 위해 여러 업체 중 발주처가 임의로 1곳 지명하는 것이다.
④ 두 개념은 법적으로 완전히 동일하며 수의계약 사유서 작성 시 구별할 실익이 없다.
문 8. 추정가격 1억 원 미만 중기업·소기업·소상공인 대상 우선조달 및 중소기업협동조합 추천 소액수의계약에 관한 설명으로 옳은 것은?
① 중소기업자 간 경쟁제품이 아닌 일반 물품·용역 중 추정가격 1억 원 미만인 경우 소기업·소상공인 간 제한경쟁입찰로 집행하는 것이 원칙이다.
② 조합추천 소액수의계약 시 추정가격 2,000만 원 이상 1억 원 미만 구간에서는 조합으로부터 최소 2개사 이상만 추천받으면 된다.
③ 조합추천 소액수의계약은 대기업 제품의 조달시장 진입을 유도하기 위해 신설된 제도이다.
④ 소기업·소상공인 우선조달 적용 시 대기업의 지분 참가가 50%까지 허용된다.
문 9. 추정가격(Estimated Price)의 법적 정의 및 조달 실무상 활용 범위로 가장 옳지 않은 것은?
① 추정가격은 부가가치세와 관급자재대를 제외한 금액이다.
② 추정가격은 WTO GPA 국제입찰 대상 여부를 판단하는 법정 기준금액이 된다.
③ 추정가격은 수의계약 체결 가능 여부 및 제한경쟁입찰의 자격 제한 기준이 된다.
④ 추정가격은 예정가격 작성을 위해 조사를 거쳐 VAT를 합산하여 사전 공개하는 금액이다.
문 10. 복수예비가격 작성 및 예정가격 확정 메커니즘에 관한 설명으로 옳은 것은?
① 국가계약법 입찰 시 복수예비가격 15개는 기초금액 기준 ±5% 범위 내에서 작성된다.
② 입찰 참가자가 투찰 시 무작위로 추첨한 2개의 예비가격을 산술평균하여 예정가격을 정한다.
③ 가장 많이 추첨된 4개의 예비가격을 산술평균하여 예정가격을 확정하며, 소수점 이하 금액은 절사한다.
④ 예정가격은 입찰공고문에 기초금액과 함께 사전에 대외 공개하는 것이 원칙이다.
문 11. 세부품명번호 10자리의 체계 및 조달 실무상 중요한 이유로 가장 옳은 것은?
① 세부품명번호 10자리는 물품분류번호 8자리에 2자리를 추가한 것으로, 중기간 경쟁제품 지정 및 직접생산확인의 기준 단위가 된다.
② 세부품명번호 10자리는 개별 제조사의 특정 모델명과 시리얼번호를 의미한다.
③ 세부품명번호는 오직 건설 공사의 공종 분류에만 제한적으로 사용된다.
④ 세부품명번호 10자리가 동일하더라도 제품의 세부 성능과 규격은 완전히 동일한 것으로 간주되어 별도 검수가 불필요하다.
문 12. 중소기업자 간 경쟁제품의 직접생산확인증명서에 관한 설명으로 가장 옳지 않은 것은?
① 직접생산확인증명서의 법정 발급 유효기간은 발급일로부터 2년이다.
② 직접생산확인 신청 시 실제 제조 설비, 인력, 공장 등록 여부 등을 현장 실사 및 서류 검증한다.
③ 수주 후 타사에 일괄 하도급을 주거나 완제품을 단순 수입하여 납품한 사실이 적발되면 직접생산확인이 취소되고 부당이득금 환수 대상이 된다.
④ 직접생산확인증명서는 유통업체나 단순 무역상사도 제한 없이 자유롭게 발급받을 수 있다.
문 13. 「녹색제품 구매촉진에 관한 법률」상 공공기관의 녹색제품 구매 관리 규정에 대한 설명으로 옳은 것은?
① 공공기관의 장은 매년 녹색제품 구매이행계획을 수립하여 공표하고 구매 실적을 관할 부처에 제출해야 한다.
② 공공기관은 당해 연도 물품 구매액의 100%를 무조건 녹색제품으로만 집행해야 하는 절대 의무를 진다.
③ 저탄소제품인증은 공공기관 매년 녹색제품 구매실적 공표 시 실적 합산에 포함되어 평가받는다.
④ 녹색제품 구매 지침을 위반하더라도 감사원 감사나 경영평가 감점 대상이 되지 않는다.
문 14. 조달청 혁신제품의 3가지 유형(지정혁신, 유망혁신, 시제품) 및 특례 지원에 관한 설명으로 옳지 않은 것은?
① 혁신제품으로 지정되면 3년간 금액 제한 없이 수의계약 체결이 가능하다.
② 조달청 예산으로 시제품을 구매하여 공공기관에 제공하고 실증 테스트하는 '혁신시제품 시범구매 사업'이 운영된다.
③ 혁신제품을 구매한 공무원에게 고의·중과실이 없으면 손실 책임을 면제하는 '구매자 면책 제도'가 적용된다.
④ 혁신제품 구매 금액은 공공기관 경영평가 및 혁신구매 목표제 실적 산정에서 전액 제외된다.
문 15. 사회적 약자 기업 및 복지 단체 생산품 우선구매 제도의 법적 성격 비교로 옳은 것은?
① 여성기업 제품: 총 구매액의 10% 이상 강제 의무 구매
② 장애인기업 제품: 총 구매액의 5% 이상 강제 의무 구매
③ 중증장애인생산품: 공공기관 총 구매액의 1% 이상 법정 강제 의무 구매
④ 사회적기업 제품: 총 구매액의 3% 이상 강제 의무 구매
문 16. 국가계약법 제5조 제3항 및 제4항에 규정된 '부당특약 금지' 및 사법상 효력에 관한 설명으로 가장 옳은 것은?
① 발주기관이 계약상대자의 정당한 이익을 부당하게 제한하거나 위험을 전가하는 부당특약을 설정한 경우 당사자 간 각서가 있으면 유효하다.
② 부당특약 금지 조항은 강행규정이므로 이를 위반하여 설정된 특약은 사법상 무효가 된다.
③ 부당특약이 설정되더라도 시공사는 계약 체결 후 손해배상을 청구할 수 없다.
④ 공공계약에서는 발주처의 행정 목적 달성을 위해 계약상대자의 권리를 제한하는 특약을 자유롭게 설정할 수 있다.
문 17. 국가계약법과 지방계약법의 법령상 주요 차이점에 대한 설명으로 가장 옳지 않은 것은?

문 18. 조달사업법상 '제3자 단가계약'과 '다수공급자계약(MAS)'의 공통점 및 차이점으로 옳은 것은?
① 제3자 단가계약은 2인 이상의 다수 공급자와 체결하고, MAS는 오직 1인 기업과만 체결한다.
② 두 제도 모두 조달청이 사전 단가계약을 체결하고 나라장터 종합쇼핑몰에 등록하여 수요기관이 납품 요구하는 구조이다.
③ MAS는 규격이 단일하고 대체재가 없는 독점 제품에만 적용된다.
④ 제3자 단가계약은 일정 금액 이상 구매 시 의무적으로 2단계경쟁을 거쳐야 한다.
문 19. 공공입찰 절차에서 민법상 법리 연계에 관한 설명으로 가장 옳지 않은 것은?
① 발주기관의 입찰공고는 불특정 다수를 향한 '청약의 유인'에 해당한다.

③ 조달업체는 입찰서를 제출한 후 입찰 마감 전이라도 자유롭게 입찰을 철회할 수 있는 임의 철회권이 인정된다.

문 20. 쌍무계약인 공공계약에서 민법상 동시이행항변권(제536조) 및 채무자위험부담주의(제537조) 적용 설명으로 옳은 것은?
① 발주처가 선금 지급 의무를 불이행하더라도 시공사는 착공을 거부할 수 없다.
② 쌍방 귀책 사유 없는 불가항력(천재지변)으로 목적물이 유실된 경우, 채무자위험부담주의에 따라 시공사는 미시공 부분 대금을 청구할 수 없다.

④ 공공계약에는 민법상 쌍무계약의 원칙이 일절 적용되지 않는다.
문 21. 민법 제668조 단서에 따른 '건물 기타 토지의 공작물 도급계약'에서 수급인의 하자가 중대한 경우 도급인(발주처)의 계약 해제권 제한에 관한 설명으로 옳은 것은?
① 건물 기타 공작물이 완성된 후에는 하자가 중대하더라도 도급인은 계약을 해제할 수 없으며 하자보수 및 손해배상만 청구할 수 있다.
② 건물이 완공되었더라도 하자가 있으면 발주처는 언제든지 건물을 철거하고 계약을 소급 해제할 수 있다.
③ 도급계약은 공작물 완공 여부와 상관없이 무조건 소급 해제가 자유롭다.

문 29. [정답] ④

문 30. [정답] ①

문 31. [정답] ③

문 32. [정답] ②
해설: SWOT 분석의 WO(약점-기회) 전략은 내부적 약점(Weakness)을 보완하거나 극복하여 외부적 기회(Opportunity)를 적극 활용하는 전략입니다.
문 33. [정답] ①
해설: 기존 제품 및 기술을 대체할 수 있는 우수한 대체재가 시장에 활발히 등장할수록 기존 공급자의 독점적 시장 지배력은 약화되고 발주기관의 구매 교섭력이 향상됩니다.
문 34. [정답] ②
해설: Kraljic 매트릭스에서 공급 위험도는 낮으나 지출 규모(재무적 영향)가 큰 품목은 '레버리지(Leverage) 품목'으로, 다수 공급자 간 가격 경쟁 유도 및 제3자 단가계약을 통해 구매 효율성을 극대화하는 전략이 적합합니다.
문 35. [정답] ②
해설: 일상(Routine) 품목은 공급 위험과 재무 영향이 모두 낮으므로 카탈로그 구매, 전자조달 자동화 및 절차 간소화를 통해 행정 수수료와 거래비용을 절감하는 것이 핵심 전략입니다.
문 36. [정답] ③

문 37. [정답] ①
해설: 단순이동평균법은 과거 N개 기간의 실제 데이터에 모두 동일한 가중치(1/N)를 부여하는 반면, 가중이동평균법은 최근 데이터에 더 높은 가중치를 부여합니다.
문 38. [정답] ④
해설: 전문가 패널의 무기명 설문조사와 피드백을 반복하는 기법은 정성적(질적) 기법인 델파이(Delphi) 기법입니다. (회통분석은 인과관계 기반 정량적 기법입니다.)
문 39. [정답] ①
해설: 현재가치 산식 \(PV = \frac{C}{(1+r)^n}\)에서 분모의 할인율(\(r\))이 상승하면 미래 금액의 현재가치(\(PV\))는 감소합니다. (잔존가치는 LCC 총비용에서 차감 평가됩니다.)
문 40. [정답] ④

문 41. [정답] ①
해설: 소프트웨어(SW) 개발 사업의 과업 규모 측정 및 대가 산정을 위해 활용되는 표준 소프트웨어 공학 모형은 기능점수(Function Point, FP) 모형입니다.
문 42. [정답] ①

문 43. [정답] ①
해설: 간접노무비는 현장 직접 작업에 종사하지 않으나 현장 관리 및 감독업무를 수행하는 기술자, 관리자 등의 임금입니다. (이윤 산식 대상은 노무비+경비+일반관리비이며, 재료비는 배제됩니다.)

문 46. [정답] ④

문 47. [정답] ④

문 48. [정답] ③

문 49. [정답] ②

문 50. [정답] ①

문 51. [정답] ①

문 52. [정답] ①

문 54. [정답] ①

문 55. [정답] ①

문 61. [정답] ①

문 64. [정답] ①

문 65. [정답] ①

문 66. [정답] ①

문 67. [정답] ①

문 70. [정답] ①

문 71. [정답] ①
해설: 부정당업자 입찰참가자격 제한 처분에 갈음하는 과징금 대체 부과 비율은 계약금액의 10% 이상 30% 이하 범위입니다.
문 72. [정답] ①

문 74. [정답] ①

문 75. [정답] ①

문 76. [정답] ②

문 77. [정답] ④

문 78. [정답] ④
해설: 계약상대자의 단순 자금난, 자재 수급 예측 실패, 내부 노사 분규 등은 계약상대자의 귀책 사유에 해당하여 지체상금 면제 사유인 불가항력에 해당하지 않습니다.
문 79. [정답] ④
해설: 재해복구 긴급 구매(ㄱ), 방역사업 긴급 구매(ㄴ), 회피 목적이 아닌 명백한 사유 소명 승인(ㄷ) 모두 MAS 2단계경쟁 예외 허용 사유에 해당합니다.
문 80. [정답] ①
해설: 납품 물품의 제조상 결함으로 인한 제3자 피해에 대해서는 제조물책임법 및 계약 일반조건에 따라 계약상대자(제조·공급업체)가 모든 법적 손해배상 책임을 부담합니다.
</script>

<script>
// 파싱(Parsing) 엔진
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱
    const aBlocks = aText.split(/^(?=문 \d+\.\s*\[정답\])/gm).filter(b => /^문 \d+\./.test(b));
    const ansMap = {};
    aBlocks.forEach(block => {
        const match = block.match(/문 (\d+)\.\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=문 \d+\.)/gm).filter(b => /^문 \d+\./.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/문 (\d+)\.\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (문 1 ~ 30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (문 31 ~ 50)",
    3: "제3과목: 공공계약관리 (문 51 ~ 80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);

    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }

    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>
</body>
</html>
