문 1. 공공조달의 8대 핵심가치 중 '지속가능성(Sustainability)'과 '공정성(Fairness)'에 관한 설명으로 가장 옳지 않은 것은?
① 지속가능성은 현재의 조달 수요를 충족하면서도 미래 세대의 환경적·사회적·경제적 가치를 훼손하지 않는 환경친화적·사회적 책임 조달을 의미한다.
② 공정성은 모든 유효한 입찰 참가자에게 자격 요건과 평가 기준을 동등하게 적용하여 특정 업체에 대한 특혜나 불이익을 배제하는 원칙이다.
③ 공정성 확보를 위해 발주기관은 평가 위원 명단 및 세부 평가 항목과 배점 기준을 원칙적으로 사전에 공개해야 한다.
④ 지속가능성 원칙을 달성하기 위해 발주기관은 단기 예산 집행률 100% 달성을 목적으로 녹색제품 구매 의무나 법정 사회적 약자 기업 우선구매 유예 조치를 임의로 발령할 수 있다.

문 2. 대한민국 공공조달 법령 체계의 위계 및 효력 관계에 관한 설명으로 가장 옳지 않은 것은?
① 공공조달 관련 최상위 규범은 헌법상 재정 및 계약 관련 기본 원칙과 국회가 제정한 법률(국가계약법, 지방계약법, 조달사업법 등)이다.
② 대통령령(시행령)과 부령(시행규칙)은 법률에서 위임된 사항과 시행에 필요한 세부 절차 규정을 다룬다.
③ 기획재정부장관 또는 행정안전부장관이 제정한 계약예규(계약일반조건, 집행기준 등)가 상위 법률 조항과 정면으로 상충되는 경우 상위법 우위의 원칙에 따라 계약예규가 우선 적용된다.
④ 계약당사자 간 체결된 개별 계약서 및 계약특약은 법령의 강행규정에 위배되지 않는 한 당사자를 구속하는 법적 효력을 갖는다.

문 3. 조달사업법상 조달청의 중앙조달 범위 및 수요기관의 자체조달에 관한 설명으로 가장 옳은 것은?
① 모든 공공기관은 금액과 품목에 상관없이 100% 무조건 조달청에 계약 체결을 위탁해야만 한다.
② 수요기관은 조달사업법 시행령이 정한 의무조달요청 대상 금액(수요물자 1억 원, 종합공사 30억 원 등) 이상인 경우 조달청장에게 계약 체결을 요청해야 하며, 임의로 자체 조달을 부칠 수 없다.
③ 조달청장이 중앙조달로 계약 체결한 물품에 대해 수요기관이 직접 납품요구(주문)를 집행할 때 조달청의 지위는 '공급자'이다.
④ 자체조달을 집행하는 지방자치단체는 조달청의 나라장터(KONEPS)를 이용할 수 없으며 반드시 자체 전자조달시스템을 구축해야 한다.

문 4. WTO 정부조달협정(GPA) 및 한-EU FTA 등 국제조달 규정에 관한 설명으로 옳지 않은 것은?
① GPA는 가입국 간 정부조달 시장의 무역 장벽을 제거하고 내국민 대우 및 무차별 원칙을 적용하는 다자간 협정이다.
② 양허표상 양허 하한선(고시금액) 이상인 공공계약에 대해 국제입찰을 부쳐야 한다.
③ GPA 적용 대상 국제입찰의 법정 기본 입찰공고 기간은 마감일 전날부터 역산하여 최소 40일 전이다.
④ 발주기관은 GPA 양허 대상 공사에 대해 별도의 법적 근거 없이 단순히 국내 중소기업을 보호하겠다는 행정적 사유만으로 GPA 적용을 임의로 전면 배제할 수 있다.

문 5. UNCITRAL 공공조달모델법(2011)상 10대 조달방법 중 '경쟁적 대화(Competitive Dialogue)'와 '연속협상(Sequential Negotiations)'의 비교 설명으로 가장 옳지 않은 것은?
① 경쟁적 대화는 발주기관이 최적의 대안을 도출하기 위해 참가 자격을 갖춘 업체들과 대화를 거쳐 사양을 확정한 후 최종 제안서를 제출받는 방식이다.
② 연속협상은 종합 평가 1위 업체부터 순차적으로 협상을 진행하여 타결 시 계약을 체결하고, 결렬 시 차순위자와 협상하는 방식이다.
③ 연속협상 진행 시 발주기관은 협상 효율성을 높이기 위해 1위 협상대상자와 2위 협상대상자를 동시에 한자리에 불러 병행 협상할 수 있다.
④ 대화기반 제안요청은 복잡한 신기술 사업이나 융복합 조달 분야에서 유용하게 활용된다.

문 6. 국가계약법 시행령상 제한경쟁입찰에 부칠 때 '지역제한' 및 '실적제한' 요건에 관한 설명으로 옳지 않은 것은?
① 실적제한 시 요구하는 동등 이상 또는 유사 사업 실적은 계약목적물의 규모 또는 양의 1배(100%) 이내로 제한해야 한다.
② 지역제한입찰을 적용할 때는 법인등기부상 본점 소재지(개인사업자는 사업자등록증상 사업장 소재지)를 기준으로 제한해야 한다.
③ 지역제한입찰은 추정가격이 기획재정부장관이 고시하는 금액(국가기관 물품·용역 2.3억 원, 공사 88억 원) 미만인 사업에 한해 적용할 수 있다.
④ 발주기관은 사업의 시급성을 이유로 특정 법인의 '지점'이나 '연락사무소' 소재지만을 기준으로 지역제한 자격을 설정할 수 있다.

문 7. 지명경쟁입찰에 관한 설명으로 가장 옳지 않은 것은?
① 특정한 기술·설비·실적을 보유한 자가 10인 이내인 경우 지명경쟁입찰에 부칠 수 있다.
② 발주기관은 지명경쟁입찰을 집행할 때 대상자를 최소 5인 이상 지명해야 한다.
③ 지명 대상자가 5인 미만인 경우에는 경쟁성이 성립하지 않으므로 어떠한 경우에도 지명경쟁입찰을 집행할 수 없다.
④ 지명된 대상자 중 2인 이상이 참가 신청(투찰)을 해야 입찰이 유효하게 성립한다.

문 8. 경쟁입찰 유찰에 따른 수의계약 체결 요건 및 절차에 대한 설명으로 옳은 것은?
① 재공고입찰을 부쳤으나 입찰자 또는 낙찰자가 없어 유찰된 경우, 보증금과 기한을 제외하고는 최초 입찰에 정한 조건 및 예정가격을 변경하지 않는 범위 내에서 수의계약을 체결할 수 있다.
② 1차 입찰이 유찰되면 재공고입찰 절차를 거치지 않고 즉시 수의계약을 체결할 수 있다.
③ 유찰 수의계약 체결 시 예정가격을 최초 입찰 시보다 인상하여 수의계약 대상자에게 우대 제공할 수 있다.
④ 유찰 수의계약 대상자는 최초 입찰에 참가했던 업체로만 엄격히 제한되며 신규 업체는 참여할 수 없다.

문 9. 국가계약법 및 지방계약법상 2인 이상 전자견적 소액수의계약의 낙찰자 결정 방식에 관한 설명으로 가장 옳지 않은 것은?
① 나라장터(KONEPS) 등 지정정보처리장치를 통해 2인 이상으로부터 전자견적서를 제출받아 집행한다.
② 예정가격 대비 낙찰하한율(물품·일반용역 88%, 단순노무용역 90%, 공사 89.745% 등) 이상으로 최저 가격을 제출한 자를 계약상대자로 결정한다.
③ 소액수의계약은 별도의 적격심사(경영상태, 이행실적 평가) 절차를 거치지 않고 정해진 낙찰하한율 이상 최저가 제출자를 바로 선정한다.
④ 소액수의계약에서도 덤핑 방지를 위해 적격심사 신인도 가점 및 감점 배정표를 필수 적용하여 낙찰자를 선발한다.

문 10. 예정가격 작성 및 복수예비가격 메커니즘에 관한 설명으로 옳은 것은?
① 복수예비가격 15개 중 입찰 참가자가 가장 많이 추첨한 4개 예비가격을 산술평균하여 예정가격을 정할 때, 원 미만(소수점 이하) 금액은 올림 처리한다.
② 복수예비가격 15개 중 입찰 참가자들이 가장 많이 추첨한 4개의 예비가격을 산술평균하여 예정가격을 확정하며, 이때 1원 미만(소수점 이하) 금액은 절사(버림)한다.
③ 국가계약법 적용 입찰 시 복수예비가격 작성 범위는 기초금액의 ±5% 범위 내이다.
④ 예정가격은 입찰공고 시 사전에 대외 공개하는 것이 법적 원칙이다.

문 11. 목록정보시스템의 물품분류번호(8자리)와 세부품명번호(10자리)에 대한 설명으로 가장 옳지 않은 것은?
① 물품분류번호 8자리는 UNSPSC 국제 표준 분류 체계를 기반으로 구성된다.
② 세부품명번호 10자리는 물품분류번호 8자리에 2자리의 세부 속성을 추가하여 식별하는 번호이다.
③ 세부품명번호 10자리는 개별 공공기관이 계약 체결 시 임의로 생성하여 사용하는 독자적 자율 코드이다.
④ 세부품명번호 10자리는 중소기업자 간 경쟁제품 지정, 직접생산확인증명서 발급, MAS 계약의 기본 관리 단위로 작동한다.

문 12. 중소기업자 간 경쟁제품 및 직접생산확인 취소 처분에 관한 설명으로 옳지 않은 것은?
① 중소기업자 간 경쟁제품의 법정 지정 유효기간은 3년이다.
② 직접생산확인증명서의 법정 발급 유효기간은 2년이다.
③ 직접생산 확인을 받은 업체가 수주 후 타사에 하도급을 주거나 수입 완제품을 납품한 사실이 적발되면 직접생산확인이 취소된다.
④ 직접생산확인 취소 처분을 받은 업체는 취소된 날부터 즉시 다음 날 재신청하여 새 증명서를 발급받을 수 있다.

문 13. 「녹색제품 구매촉진에 관한 법률」상 녹색제품 인증의 구분 및 공공기관 구매 의무에 관한 설명으로 옳지 않은 것은?
① 녹색제품 3대 법정 인증은 환경표지인증, 우수재활용(GR)인증, 환경성적표지인증이다.
② 공공기관의 장은 당해 연도 녹색제품 구매이행계획을 수립·공표해야 한다.
③ 환경성적표지인증 연계 저탄소제품은 공공기관 매년 녹색제품 구매실적 공표 시 실적 금액에 합산되어 포함된다.
④ 환경표지는 환경부(한국환경산업기술원), GR인증은 산업통상자원부(자원순환산업진흥협회) 소관이다.

문 14. 혁신조달 관련 '구매자 면책제도'의 법적 적용 요건으로 가장 옳은 것은?
① 공공기관의 구매 담당 공무원이 혁신제품을 구매하여 사용함으로 인해 발생한 손실에 대해 고의나 중대한 과실이 없는 경우 민·형사상 및 행정상 책임을 면제한다.
② 구매자 면책제도는 구매 담당자에게 단순 과실이 있는 경우에도 책임을 엄중히 부과하는 제도이다.
③ 혁신제품 구매 후 손실이 발생하면 고의 유무와 상관없이 담당 공무원이 전액 사비로 배상해야 한다.
④ 구매자 면책 제도는 오직 대기업 제품을 구매했을 때만 적용된다.

문 15. 공공기관의 사회적 약자 기업 우선구매 법정 목표 비율의 연결이 옳지 않은 것은?
① 여성기업 제품: 물품·용역 구매액의 5% 이상, 공사 구매액의 3% 이상 (노력 의무)
② 장애인기업 제품: 총 구매액의 1% 이상 (노력 의무)
③ 중증장애인생산품: 공공기관 총 구매액의 1% 이상 (법정 강제 의무)
④ 중증장애인생산품: 총 구매액의 0.1% 이상 (자율 선택 사항)

문 16. 국가계약법상 발주기관이 설정한 부당특약의 대표적 유형으로 볼 수 없는 것은?
① 계약상대자의 이익을 부당하게 제한하거나 발주처의 위험을 시공사에게 전가하는 조항
② 법령에 규정된 물가변동 계약금액 조정(ESC) 청구권을 포기하도록 강제하는 조항
③ 설계변경으로 인한 계약금액 조정 시 법정 단가산정 기준보다 시공사에게 일방적으로 불리하게 적용하는 조항
④ 계약서에 계약상대자의 채무불이행 시 적용되는 법정 지체상금률 및 작성 기준을 명시한 조항

문 17. [최신 개정] 국가계약법과 지방계약법의 이의신청 및 재심 청구 기한 비교로 옳지 않은 것은?
① 국가계약법상 이의신청 기한: 처분을 안 날부터 25일 이내, 사유 발생일부터 30일 이내
② 국가계약분쟁조정위원회 재심 청구 기한: 결과를 통지받은 날부터 30일 이내
③ 지방계약법상 이의신청 기한: 처분을 안 날부터 15일 이내, 사유 발생일부터 20일 이내
④ 지방계약법상 이의신청 기한도 국가계약법과 전면 동일하게 안 날부터 25일 이내로 정정 개정되었다.

문 18. 우수조달물품 지정제도의 유효기간 및 연장 조건에 대한 설명으로 옳은 것은?
① 우수조달물품 지정 유효기간은 지정일로부터 1년이며 연장이 불가능하다.
② 우수조달물품 지정 유효기간은 지정일로부터 3년이며, 수출 실적, 기술 개발 투자, 고용 창출 등 법정 요건 충족 시 최대 3년 범위 내에서 연장 가능하다.
③ 우수조달물품 지정 유효기간은 10년 고정이다.
④ 우수조달물품으로 지정되면 나라장터 종합쇼핑몰 등록이 금지된다.

문 19. 공공입찰에서 민법상 청약과 승낙의 법리 적용에 관한 설명으로 가장 옳지 않은 것은?
① 발주기관의 입찰공고는 불특정 다수의 조달업체를 향한 '청약의 유인'에 해당한다.
② 입찰공고 자체가 구속력 있는 '청약'에 해당하므로, 발주기관은 공고 후 입찰 조건을 수정하거나 취소할 수 없다.
③ 조달업체의 투찰(입찰서 제출)은 발주기관에 대한 구속력 있는 '청약'에 해당한다.
④ 발주기관의 낙찰자 결정 및 통지는 '승낙'에 해당하며, 최종 서면 계약서 기명날인으로 본계약이 확정된다.

문 20. 민법상 도급계약에서 수급인의 하자담보책임에 관한 설명으로 옳지 않은 것은?
① 완성된 목적물에 하자가 있는 경우 도급인은 수급인에 대해 하자보수 또는 손해배상을 청구할 수 있다.
② 목적물의 하자로 인하여 계약의 목적을 달성할 수 없는 경우 도급인은 계약을 해제할 수 있다 (단, 건물 기타 토지의 공작물은 제외).
③ 수급인의 하자담보책임 제척기간은 목적물을 인수한 날부터 진행한다.
④ 수급인의 하자담보책임은 수급인의 고의 또는 과실이 증명되어야만 성립하는 과실책임이다.

문 21. 계약 해제 시 원상회복의무 및 손해배상 청구에 관한 설명으로 옳은 것은?
① 계약 해제는 계약을 소급하여 소멸시키며, 당사자 일방이 계약을 해제한 경우에도 상대방에 대한 손해배상 청구권 행사에 영향을 미치지 않는다.
② 계약이 해제되면 이미 이행된 부분에 대해 원상회복의무가 발생하지 않는다.
③ 계약 해제 시 손해배상은 오직 신뢰이익의 배상만 가능하며 이행이익 배상은 청구할 수 없다.
④ 계약 해지 시 소급하여 처음부터 계약이 무효가 된다.

문 22. 국가계약법 제28조에 따른 국가계약분쟁조정위원회의 조정 신청 대상 사건의 범위(추정가격)로 옳은 것은?
① 국가기관 종합공사 80억 원 이상, 전문/기타공사 7억 원 이상, 물품·용역 2.1억 원 이상인 계약의 분쟁
② 금액에 상관없이 모든 100만 원 이상 소액계약 분쟁
③ 오직 1,000억 원 이상 초대형 공사 분쟁
④ 외국 업체가 참여하는 국제입찰 분쟁은 대상에서 전면 제외됨

문 23. 부정당업자 입찰참가자격 제한 처분에 관한 설명으로 가장 옳지 않은 것은?
① 입찰 담합, 뇌물 제공, 계약 미체결, 부실 시공 등을 저지른 자에게 부과된다.
② 부정당업자 제재를 받으면 나라장터에 게재되어 전국 전 공공기관의 입찰 참가가 전면 차단된다.
③ 법정 부정당업자 입찰참가자격 제한 기간은 최소 6개월 이상 5년 이하이다.
④ 제재 처분을 내리기 전 당사자에게 의견 제출 및 청문 기회를 부여해야 한다.

문 24. 부정당업자 입찰참가자격 제한을 과징금 부과로 대체할 수 있는 사유에 해당하는 것은?
① 입찰 담합을 주도한 경우
② 입찰참가자격 제한으로 인해 유효한 경쟁 입찰이 성립하기 어렵거나 국가 사업 추진에 중대한 차질이 우려되는 경우
③ 발주기관 공무원에게 뇌물을 제공한 경우
④ 허위 서류를 제출하여 고의로 무효 입찰을 유도한 경우

문 25. 조달사업법상 불공정조달행위 신고 및 조사 절차에 대한 설명으로 옳은 것은?
① 불공정조달행위(직접생산 위반, 원산지 허위표시 등)를 신고한 자에게는 조사 결과에 따라 부당이득 환수금액 등의 일정 비율에 해당하는 신고포상금을 지급할 수 있다.
② 조달청장은 불공정조달행위 조사 권한이 없으므로 검찰에만 수사를 의뢰해야 한다.
③ 적발된 위반 업체에 대한 부당이득금 환수 처분은 법원의 형사 판결이 확정되어야만 집행 가능하다.
④ 불공정조달행위로 적발되더라도 나라장터 거래정지 처분은 부과할 수 없다.

문 26. 공기업·준정부기관이 감사원 등으로부터 계약 비위로 적발된 경우 조달청에 계약 사무를 의무 위탁해야 하는 요건으로 옳은 것은?
① 적발 통보를 받은 날부터 10일 이내에 조달청에 통보하고, 60일 이내에 이사회 의결을 거쳐 위탁을 신청해야 한다.
② 적발 통보를 받은 날부터 1년 이내에 자율적으로 결정한다.
③ 이사회 의결 없이 즉시 수의계약으로 전환한다.
④ 기획재정부장관이 직권으로 해당 기관을 폐쇄한다.

문 27. 국가계약법 및 지방계약법상 서면 계약서 작성을 생략할 수 있는 경우 제출받아야 하는 서류로 옳지 않은 것은?
① 승낙사항
② 견적서
③ 청구서 또는 수금확인서
④ 계약상대자의 인감증명서 및 10년 치 재무제표 원본

문 28. 희망수량경쟁입찰의 개념 및 단가 결정 방식에 대한 설명으로 가장 옳은 것은?
① 수요 수량이 다량인 물품을 구매할 때 입찰자가 공급 희망 수량과 단가를 투찰하도록 하고, 예정가격 이하 최저 단가 투찰자부터 순차적으로 희망 수량을 할당하여 낙찰자를 결정하는 방식이다.
② 가장 높은 단가를 제출한 자에게 전체 물량을 몰아주는 방식이다.
③ 단가를 사전에 무조건 고정하고 수량만 제비뽑기로 추첨하는 방식이다.
④ 오직 단일 공급자 1곳과만 체결하는 수의계약 방식이다.

문 29. 2단계 경쟁입찰과 종합심사낙찰제의 특성 비교로 옳은 것은?
① 2단계 경쟁입찰은 1단계 가격을 평가하고 2단계에서 기술을 평가하는 방식이다.
② 2단계 경쟁입찰은 1단계 규격(기술) 적격자를 선정한 후 2단계에서 최저가 투찰자를 낙찰자로 정하며, 종합심사낙찰제는 공사수행능력, 가격, 사회적 책임을 종합 합산하여 최고점자를 결정한다.
③ 두 방식 모두 무조건 최저가를 제출한 자가 자동 낙찰된다.
④ 종합심사낙찰제는 1,000만 원 이하 소액 물품 구매에만 제한적으로 적용된다.

문 30. 조달사업법 시행령상 의무 조달요청 대상 금액 이상이더라도 수요기관이 자체 조달할 수 있는 정당한 예외 사유에 해당하지 않는 것은?
① 재해복구 등 긴급한 사정이 있어 조달청에 요청할 시간적 여유가 없는 경우
② 국방 및 안보상 비밀 유지가 필요한 물자를 조달하는 경우
③ 해당 기관의 특수한 기술적 사정으로 자체 발주가 불가피하다고 인정되는 경우
④ 수요기관 계약 담당자의 단순 개인 선호나 행정 편의를 위해 자체 조달하려는 경우

문 31. PESTEL 분석의 6개 요소 중 '기술적(Technological) 요인'과 '사회문화적(Sociocultural) 요인'의 공공조달 적용 사례로 옳은 것은?
① 기술적 요인: AI, 디지털 전환, 클라우드 기반 SW 조달 확대 / 사회문화적 요인: 인구 구조 변화 및 저출생·고령화에 따른 사회복지 용역 수요 증가
② 기술적 요인: 탄소배출권 규제 / 사회문화적 요인: 국가계약법 개정
③ 기술적 요인: 금리 인상 / 사회문화적 요인: 환율 변동
④ 기술적 요인과 사회문화적 요인은 공공조달 환경 분석에서 고려되지 않는다.

문 32. Kraljic 매트릭스 품목 구분 중 '전략(Strategic) 품목'의 특징과 관리 전략으로 가장 옳은 것은?
① 공급 위험도는 낮고 재무적 영향은 큼 ➔ 경쟁 입찰 유도
② 공급 위험도는 높고 재무적 영향은 작음 ➔ 재고 확보 및 대체재 개발
③ 공급 위험도와 재무적 영향(지출 규모)이 모두 높은 품목으로, 장기적 전략 파트너십 구축, 핵심 기술 공동 개발, 공급망 다변화를 추진해야 한다.
④ 공급 위험도와 재무적 영향 모두 작음 ➔ 전자조달 절차 간소화

문 33. 공급자 선호 매트릭스(Supplier Preferencing)에서 구매 금액도 크고 거래 매력도도 높아 공급자가 발주기관을 핵심 고객으로 우대하는 영역은?
① 핵심 (Core) 영역
② 개발 (Development) 영역
③ 착취 (Exploitable) 영역
④ 방치 (Nuisance) 영역

문 34. 정성적 수요예측 기법인 델파이(Delphi) 기법의 주요 특징으로 옳지 않은 것은?
① 전문가 그룹을 대상으로 무기명 설문조사를 실시한다.
② 여러 차례에 걸쳐 설문 결과 요약을 피드백하며 의견 수렴·합의 도출한다.
③ 무기명성을 통해 권위 있는 특정 전문가의 독단적 의견 주도를 방지한다.
④ 전문가들이 한자리에 모여 공개 대면 토론을 진행하여 다수결로 의사결정을 내리는 방식이다.

문 35. 이번 달 예측 수요가 100개, 실제 수요가 120개이고 지수평활계수 \(\alpha = 0.3\)일 때, 지수평활법에 의한 다음 달 수요예측치는?
① 100개
② 106개
③ 110개
④ 120개

문 36. 공공자산 도입 시 순현재가치(NPV) 기법을 활용한 LCC 평가에 관한 설명으로 가장 옳지 않은 것은?
① 할인율(\(r\))이 상승하면 미래 발생 비용의 현재가치(\(PV\))는 감소한다.
② 자산의 생애주기 동안 발생하는 취득비, 운영비, 유지보수비, 폐기비를 종합 평가한다.
③ 자금의 시간가치를 고려하여 미래 비용을 현재가치로 할인 반영한다.
④ NPV 산정 시 자산 폐기 단계에서 발생하는 잔존가치(Salvage Value)는 미래 수입이므로 현재가치로 할인하여 총 LCC 비용에 합산하여 더해야 한다.

문 37. 과업지시서(SOW) 작성 시 '기술규격(Detail Spec)'의 단점으로 가장 옳은 것은?
① 공급자에게 자유로운 창의적 대안 제시 기회를 과도하게 부여한다.
② 제조 공정과 상세 치수를 과도하게 지정하여 과잉 스펙(Over-specification) 및 특정 업체의 독점을 유발하고 공급자의 기술 혁신을 저해할 수 있다.
③ 검수 및 품질 평가 기준이 모호해진다.
④ 시장 거래 가격을 대폭 인하시킨다.

문 38. 소프트웨어 사업의 규모 및 대가 산정을 위한 기능점수(Function Point) 모형에서 평가하는 데이터 기능 및 트랜잭션 기능 요소에 해당하지 않는 것은?
① 내부논리파일 (ILF)
② 외부연계파일 (EIF)
③ 외부입력 (EI), 외부출력 (EO), 외부조회 (EQ)
④ 개발 인력의 학력 및 연령 수

문 39. 정부 원가계산 작성기준상 '경비' 비목에 해당하는 항목으로만 옳게 짝지어진 것은?
① 전력비, 운반비, 외주가공비, 특허권사용료, 복리후생비
② 직접노무비, 간접노무비
③ 직접재료비, 간접재료비
④ 일반관리비, 이윤

문 40. 정부 원가계산 기준상 '이윤' 산출 공식 및 한도 요율에 대한 설명으로 가장 옳은 것은?
① 이윤 = [노무비 + 경비 + 일반관리비] × 이윤율 산식으로 계산하며, 재료비는 이윤 대상에서 배제된다. 법정 한도 요율은 공사 15%, 제조 25%, 용역 10% 이하이다.
② 이윤 = [재료비 + 노무비 + 경비] × 이윤율 산식으로 산정한다.
③ 이윤율 상한은 모든 계약 유형에서 50% 고정이다.
④ 재료비가 클수록 이윤 산정 금액도 비례하여 커진다.

문 41. 국가계약법상 개산계약 및 사후원가검토조건부 계약에 대한 설명으로 옳지 않은 것은?
① 개산계약은 개발 시제품 구매 등 사전에 단가를 확정할 수 없을 때 우선 대략의 금액으로 계약 후 정산하는 방식이다.
② 사후원가검토조건부 계약은 입찰 전 사후 원가 검토 기준을 명시하고 이행 완료 후 실제 원가를 정산하는 방식이다.
③ 사후원가검토조건부 계약은 입찰 전에 원가 단가를 완전히 확정하여 어떠한 경우에도 사후 정산을 허용하지 않는 계약 방식이다.
④ 정산 절차를 통해 부당하게 과다 계상된 원가 금액을 환수할 수 있다.

문 42. 입찰 전 시장조사 및 발주 준비 단계에서 활용되는 RFI, RFP, RFQ에 관한 설명으로 옳은 것은?
① RFI는 정식 기술 제안서 및 가격입찰서 제출을 요구하는 법적 구속력 있는 문서이다.
② RFQ는 규격이 정형화된 상용 물품의 단가 및 납기 조건을 비교하기 위해 공급자들에게 제출받는 견적요청서이다.
③ RFP를 제출받은 발주기관은 무조건 최저가를 제출한 자를 낙찰자로 선정해야 한다.
④ RFI를 발주하면 법적으로 해당 사업을 30일 이내에 반드시 정식 발주해야 한다.

문 43. 사전규격공개 제도 운영 중 조달업체로부터 규격 독점 등에 관한 이의제기가 접수되었을 때 발주기관의 법정 처리 절차로 옳은 것은?
① 이의제기가 접수된 날부터 5일 이내에 처리 결과를 나라장터에 공시해야 한다.
② 이의제기가 접수되면 해당 입찰 사업을 즉시 전면 취소해야 한다.
③ 이의제기 접수 후 1년 동안 답변을 유예할 수 있다.
④ 이의제기를 제출한 업체를 부정당업자로 즉시 제재한다.

문 44. 국가계약법상 입찰공고 기간 산정 기준 및 단축 요건에 대한 설명으로 옳지 않은 것은?
① 일반경쟁입찰의 기본 공고 기간은 마감일 전날부터 역산하여 최소 7일 전이다.
② 긴급 재해복구 및 재공고입찰 시 공고 기간을 5일 전까지 단축할 수 있다.
③ 협상에 의한 계약의 공고 기간은 추정가격이 고시금액 미만인 경우 최소 40일 전 공고가 필수이다.
④ WTO GPA 국제입찰의 기본 공고 기간은 최소 40일 전이다.

문 45. 국가계약법상 동일 구조물 공사나 단일 사업의 인위적 분할발주 금지에 대한 설명으로 옳은 것은?
① 경쟁입찰을 회피하고 수의계약을 체결하기 위해 사업을 인위적으로 분할하여 발주하는 행위는 엄격히 금지된다.
② 수의계약 한도 내로 맞추기 위해 1건 사업을 쪼개어 계약하는 행위는 행정 권장 사항이다.
③ 건설산업기본법 등 타 법령에서 분리발주를 의무화한 경우에도 분할발주 금지 위반에 해당한다.
④ 분할발주는 감사원 감사나 행정 처분 대상이 되지 않는다.

문 46. ISO 31000 표준 리스크 관리 대응 전략 중 '위험 전가(Transfer)'에 해당하는 구체적 수단으로 옳은 것은?
① 신규 고위험 사업의 추진을 전면 취소함
② 계약상대자에게 계약이행보증서, 손해보험 가입증서 제출을 요구하여 손실 위험을 보증기관이나 보험사에 이전함
③ 물가변동 조정 조항을 설정하여 충격을 완화함
④ 잔여 위험을 자체 예비비로 감수함

문 47. 기획재정부 계약예규 「협상에 의한 계약체결기준」상 제안서 평가 배점 한도 비율에 대한 설명으로 옳은 것은?
① 기술능력평가 80점, 입찰가격평가 20점 배점을 원칙으로 하며, 사업의 특성상 필요한 경우 기술 평가 배점을 90점까지 확대할 수 있다.
② 가격평가 100점 만점으로만 집행해야 한다.
③ 기술평가 배점은 최대 10점을 초과할 수 없다.
④ 정량적 평가는 무조건 평가위원회가 주관적으로 점수를 부여한다.

문 48. 공동수급체 구성 형태 중 '공동이행방식'과 '분담이행방식'의 법적 책임 차이에 관한 설명으로 가장 옳은 것은?
① 공동이행방식 구성원은 계약 이행에 대해 연대책임을 지며, 분담이행방식 구성원은 자신이 분담한 파트에 대해서만 개별 책임을 진다.
② 공동이행방식은 개별 책임이고 분담이행방식은 연대책임이다.
③ 두 방식 모두 어떠한 법적 책임도 지지 않는다.
④ 분담이행방식 대표사는 타 구성원의 불이행에 대해 전적으로 형사 처벌을 받는다.

문 49. 2단계 경쟁입찰(규격·가격 분리입찰)의 집행 절차에 대한 설명으로 옳은 것은?
① 가격입찰서를 먼저 개찰하여 최저가 투찰 업체를 선정한 후 규격을 평가한다.
② 1단계에서 규격입찰서와 가격입찰서를 동시 제출받아 규격 평가를 먼저 수행하고, 규격 통과자가 2인 이상인 경우에 한해 2단계 가격입찰서를 개찰한다.
③ 규격 통과자가 1인이면 가격입찰서를 개찰할 수 없다.
④ 2단계 경쟁입찰은 오직 건설 공사에만 적용된다.

문 50. 적격심사 평가 결과 최고 평점이 동점인 입찰자가 2인 이상 발생했을 때 낙찰자 결정 순서로 옳은 것은?
① 1순위: 적격심사 평가점수가 최고인 자 ➔ 2순위: 입찰가격이 최저인 자 ➔ 3순위: 나라장터 자동추첨
② 무조건 제비뽑기 추첨
③ 사업자등록일이 오래된 자
④ 입찰서 제출 시각이 빠른 자

문 51. 경제 위기 극복을 위한 한시적 계약 특례 적용 시 입찰보증금 및 계약보증금의 법정 인하 비율로 옳은 것은?
① 입찰보증금: 입찰금액의 2.5% 이상 / 계약보증금: 계약금액의 5% 이상
② 입찰보증금: 10% 이상 / 계약보증금: 20% 이상
③ 입찰보증금: 전면 면제 / 계약보증금: 전면 면제
④ 입찰보증금: 1% / 계약보증금: 1%

문 52. 공사계약 시 계약보증금 대신 제출하는 '공사이행보증서'의 법적 효력에 관한 설명으로 옳은 것은?
① 공사이행보증서는 오직 금전적인 손해만 보상하는 보증서이다.
② 시공사가 계약을 불이행할 경우 보증기관이 지정 보증시공업체를 투입하여 공사를 완성(역무 보증)하거나 보증금액을 납부(금전 보증)해야 한다.
③ 공사이행보증서를 제출하면 시공사는 공사 지연에 따른 지체상금을 전면 면제받는다.
④ 공사이행보증서는 추정가격 100만 원 이하 소액 공사에만 적용된다.

문 53. 장기계속공사계약에서 2차 연도 공사 이행 중 계약상대자의 귀책 사유로 계약이 해제된 경우 계약보증금 국고 귀속 범위는?
① 당해 2차 연도 계약보증금만 국고에 귀속된다.
② 총공사금액 전체의 계약보증금이 귀속된다.
③ 1차 연도부터 최종 연도까지의 모든 보증금이 소급 귀속된다.
④ 계약보증금 귀속이 면제된다.

문 54. 선금(선급금) 정산 공식 및 환수 사유에 대한 설명으로 가장 옳지 않은 것은?
① 선금은 원자재 확보 및 인건비 지급 등 당해 계약 이행 목적 외에 타 용도로 사용할 수 없다.
② 선금을 유용한 경우 잔액에 약정이자를 가산하여 강제 환수한다.
③ 기성대가를 지급할 때마다 [선금액 × (기성부분 대가 / 총계약금액)] 산식에 따라 정산 차감한다.
④ 계약상대자의 귀책 사유로 계약이 해제된 경우 미정산 선금 잔액에 대해 이자 없이 원금만 환수한다.

문 55. 발주기관의 준공검사 완료 법정 기한(14일) 및 계약상대자의 대금 청구 후 지급 법정 기한(5일)에 관한 설명으로 옳은 것은?
① 검사는 통지받은 날부터 14일 이내 완료해야 하며, 대금 지급은 청구받은 날부터 5일 이내에 집행해야 한다.
② 검사는 30일 이내, 대금 지급은 14일 이내 집행한다.
③ 검사는 60일 이내, 대금 지급은 30일 이내 집행한다.
④ 검사와 대금 지급 모두 기한 제한이 없다.

문 56. 국가계약법 시행규칙상 계약 유형별 1일당 지체상금률의 연결이 올바르지 않은 것은?
① 시설공사계약: 1,000분의 0.5 (0.05%)
② 물품 제조·구매계약: 1,000분의 0.75 (0.075%)
③ 일반 용역 및 기술 용역계약: 1,000분의 1.25 (0.125%)
④ 운송 및 보관계약: 1,000분의 0.5 (0.05%)

문 57. 계약금액 10억 원인 시설공사계약에서 시공사의 귀책 사유로 완공이 30일 지체되었다. 면제 일수가 없을 때 부과할 지체상금 금액은?
① 150만 원
② 1,500만 원
③ 3,000만 원
④ 1억 5,000만 원

문 58. 계약 이행 지체 시 지체상금 부과 대상에서 제외(면제)되는 정당한 사유로 볼 수 없는 것은?
① 태풍, 지진, 대형 화재 등 천재지변
② 감염병 예방에 따른 국가적 방역 통제 조치

문 76. [정답] ①
해설: 공공계약에서 하자담보책임기간이 만료되면 예치된 하자보수보증금은 즉시 계약상대자에게 반환해야 합니다.

해설: 수요기관 담당자의 단순 행정 편의나 번거로움은 MAS 2단계경쟁 예외 허용 사유에 해당하지 않습니다.

해설: 납품 물품의 제조상 결함으로 인한 제3자 손해에 대해서는 제조물책임법 및 계약 조건에 따라 계약상대자(제조·공급업체)가 모든 법적 배상 책임을 부담합니다.

문 79. [정답] ①
해설: 발주기관의 사정으로 공사 기간이 연장된 경우 연장 기간 동안 현장에 실제 투입된 인력의 노무비, 임차료, 보증서 연장 수수료 등 실비 간접비를 정산하여 지급받을 수 있습니다.

문 80. [정답] ①
해설: 지체상금은 민법상 손해배상액의 예정에 해당하므로, 지체상금을 부과한 경우 발주기관은 별도의 실제 손해액 입증 없이 법정 지체상금 금액을 손해 배상금으로 충당할 수 있습니다.
</script>

<script>
// 파싱(Parsing) 엔진
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱
    const aBlocks = aText.split(/^(?=문 \d+\.\s*\[정답\])/gm).filter(b => /^문 \d+\./.test(b));
    const ansMap = {};
    aBlocks.forEach(block => {
        const match = block.match(/문 (\d+)\.\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=문 \d+\.)/gm).filter(b => /^문 \d+\./.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/문 (\d+)\.\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (문 1 ~ 30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (문 31 ~ 50)",
    3: "제3과목: 공공계약관리 (문 51 ~ 80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;


    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
        
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);


    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }


    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

}

window.onload = renderQuiz;
</script>
</body>
</html>
