문 1. [공공조달의 본질] 공공조달의 본질적 특성과 민간구매(상업적 구매)의 차이에 대한 설명으로 가장 옳지 않은 것은?
① 공공조달은 국민의 세금과 공공 재정을 재원으로 하므로 이윤 극대화보다는 공익 실현, 투명성, 비용 대비 가치(VFM) 창출을 최우선 목표로 한다.
② 공공조달은 공정경쟁을 보장하기 위해 입찰 공고부터 계약 결과까지 전 과정을 대외에 공개하는 것을 원칙으로 한다.
③ 민간구매는 계약상대자 선정 시 사적 자치의 원칙에 따라 완전한 자율성이 보장되나, 공공조달은 법률과 적법절차원칙(Due Process)의 엄격한 통제를 받는다.
④ 공공조달과 민간구매 모두 구매관리의 5R(적정 품질, 적정 수량, 적정 가격, 적정 시기, 적정 공급원) 원칙을 적용하며, 공공조달에서는 이 중 '적정 가격(Price)'이 최우선되며 정책적 목적은 고려되지 않는다.

문 2. [성숙도 모델] 공공조달 성숙도 모델(Harland et al.)의 발전 단계에 관한 설명으로 가장 옳지 않은 것은?
① 1단계(행정적 구매)는 단순한 비품 및 원자재의 주문·발주 및 서류 처리 중심의 단기적 구매 활동 단계이다.
② 3단계(전략적 구매)는 조달 부서가 기관의 전략 수립에 참여하며 공급망 분석과 총소유비용(TCO) 개념을 도입하는 단계이다.
③ 5단계(지속가능/전략적 통합 조달)는 환경·사회적 가치(ESG) 및 정책적 목적을 조달 프로세스 전체에 통합하여 사회적 책임을 이행하는 단계이다.
④ 한국의 현 공공조달 체계는 나라장터(KONEPS) 중심의 완전한 전자화 및 사회적 책임조달 확대를 통해 가장 최상위 단계인 7단계(완전 자동화 및 인공지능 기반 예측 조달)에 완전 도달해 있다.

문 3. [법적 체계] 국가계약법과 지방계약법의 법적 체계 및 적용 범위에 대한 비교 설명으로 옳은 것은?
① 국가계약법은 중앙관서의 장 및 그 위임·위탁을 받은 계약관에게 적용되며, 지방계약법은 지방자치단체의 장 및 지방의회에만 적용된다.
② 지방자치단체가 발주하는 계약에서 부당한 특약을 설정한 경우 국가계약법과 달리 지방계약법에서는 해당 부당특약의 효력을 유효로 인정한다.
③ 정부구매협정(GPA)에 따른 국제입찰 대상 지자체 물품·용역 고시금액 기준은 약 3.5억 원 이상으로, 국가기관 고시금액 기준(약 2.3억 원 이상)보다 높다.
④ 공기업과 준정부기관의 계약 사무는 지방계약법을 우선 적용하며, 지방공기업은 국가계약법의 적용을 받는다.

문 4. [계약의 성질] 공공계약의 민법상 성질 및 원칙에 관한 설명으로 옳은 것을 모두 고른 것은?
가. 공공계약은 원칙적으로 국가 또는 지자체가 사경제 주체로서 체결하는 사법상 계약(도급, 위임, 매매 등)의 성격을 가진다.
나. 입찰 공고는 민법상 계약의 '청약'에 해당하고, 입찰자의 투찰 행위는 '승낙'에 해당한다.
다. 공공계약에는 민법상 쌍무계약의 동시이행 항변권(제536조)과 채무자위험부담주의(제537조)가 원칙적으로 적용된다.
라. 입찰보증금 납부 후 낙찰자로 선정되었으나 정당한 이유 없이 계약 체결을 거부하는 경우, 발주기관은 민법상 손해배상 청구와 별개로 입찰보증금을 국고 귀속시킬 수 있다.
① 가, 나
② 가, 다, 라
③ 나, 다
④ 가, 나, 다, 라

문 5. [UNCITRAL 모델법] UNCITRAL 공공조달모델법(2011)에 명시된 조달방법론에 대한 설명으로 가장 옳지 않은 것은?
① 공개입찰(Open Tendering)을 공공조달의 가장 기본적이고 우선적인 표준 방식으로 규정한다.
② 연속협상(Consecutive Negotiations)은 복수의 제안자와 동시에 가격 협상을 진행하여 최저가를 도출하는 방식이다.
③ 기본협정(Framework Agreements)은 일정 기간 동안 반복적으로 필요한 물품·용역에 대해 다수의 공급자와 사전에 기본 조건을 체결해 두는 제도이다.
④ 대화기반 제안요청(Request for Proposals with Dialogue)은 복잡하거나 혁신적인 과제에 대해 발주기관과 응찰자가 대화를 통해 과업을 구체화하는 방식이다.

문 6. [수의계약 사유] 수의계약 대상 사유 중 '경쟁이 불성립하여 금액 제한 없이 수의계약을 체결할 수 있는 경우'에 해당하지 않는 것은?
① 특허권, 실용신안권, 디자인등록이 된 물품으로서 생산자 또는 소지자가 오직 1인뿐인 경우
② 이미 도입된 설비의 부품 교체 시 타사 제품을 조달받으면 호환이 불가능한 경우
③ 특정인의 기술·용역·자격이 필요하여 학술연구용역이나 디자인 공모 당선작 설계를 위탁하는 경우
④ 추정가격이 3,000만 원인 일반 공사 계약으로서 현장 조사가 시급한 경우

문 7. [소액수의계약] 소액수의계약에서 '1인 견적 제출'만으로 계약을 체결할 수 있는 법정 금액 한도(추정가격 기준)로 옳지 않은 것은?
① 일반기업의 물품 제조·구매 및 용역 계약: 2,000만 원 이하
② 여성기업 및 장애인기업과의 물품·용역 계약: 5,000만 원 이하
③ 청년창업기업 및 취약계층 30% 이상 고용 마을기업과의 물품·용역 계약: 5,000만 원 이하
④ 단순 벤처기업 인증만을 보유한 일반 중소기업과의 물품·용역 계약: 5,000만 원 이하

문 8. [복지단체 수의계약] 사회적 약자 일자리 창출 및 복지단체의 직접 생산품에 대해 금액 제한 없이 수의계약을 체결할 수 있는 법정 대상이 아닌 것은?
① 보건복지부장관이 지정한 중증장애인생산품 생산시설(꿈드래)
② 고용노동부장관 인증을 받은 장애인 표준사업장
③ 국가보훈부장관이 지정한 국가유공자 자활용사촌 복지공장
④ 대표자가 만 39세 이하인 일반 청년창업기업

문 9. [중기간 경쟁제품] 중소기업제품 구매촉진 및 판로지원에 관한 법률상 '중소기업자 간 경쟁제품' 제도에 관한 설명으로 가장 옳지 않은 것은?
① 중소벤처기업부장관이 국내 판로 지원이 필요한 품목을 지정하며 유효기간은 3년이다.
② 지정된 경쟁제품에 대해서는 대기업의 입찰 참가가 원칙적으로 배제된다.
③ 경쟁제품 입찰에 참가하려는 중소기업은 유통업체라 하더라도 신용평가등급만 높으면 참가 자격을 얻는다.
④ 추정가격 10억 원 이상 공사에 포함되는 관급자재(자재흥전) 중 중기간 경쟁제품은 발주기관이 직접 구매하여 제공해야 한다.

문 10. [직접생산확인] 직접생산확인증명서에 관한 설명으로 가장 옳지 않은 것은?
① 중소기업자 간 경쟁제품 입찰에 참가하기 위한 필수 자격 요건이다.
② 발주기관이 직접 발급하며, 발급 유효기간은 발급일부터 3년이다.
③ 공장등록, 생산설비, 필수 생산인력 및 최근 원자재 구매실적 등을 종합 현장 조사하여 발급한다.
④ 직접생산을 위반하여 하도급을 주거나 타사 제품을 납품한 경우 직접생산 확인이 취소되고 부정당업자 제재 및 부당이득금 환수 대상이 된다.

문 11. [우선구매] 공공기관의 법정 우선구매 목표비율과 분모(기준 금액)의 연결이 올바르게 짝지어진 것은?
① 중소기업제품: 총 구매액의 50% 이상
② 기술개발제품: 총 구매액의 15% 이상
③ 창업기업제품: 중소기업 물품 구매액의 8% 이상
④ 여성기업제품: 공사 구매총액의 5% 이상

문 12. [녹색공공조달] 녹색공공조달(GPP) 및 녹색제품 3대 인증에 대한 설명으로 가장 옳지 않은 것은?
① 「녹색제품 구매촉진에 관한 법률」에 따라 공공기관은 녹색제품을 총 구매액의 50% 이상 구매하도록 노력해야 한다.
② 환경표지인증은 제품의 제조·유통·사용·폐기 등 전 과정에서 환경성을 종합 평가하여 환경부(한국환경산업기술원)가 부여한다.
③ 우수재활용(GR)인증은 국내 폐자원을 재활용하여 제조한 우수한 제품에 대해 산업통상자원부가 부여한다.
④ 환경성적표지인증은 기술개발제품으로 인정되어 수의계약 혜택이 즉시 부여되는 인증이다.

문 13. [혁신조달] 혁신조달(IPP) 및 혁신제품 제도에 대한 설명으로 가장 옳지 않은 것은?
① 혁신제품으로 지정되면 지정 유효기간(3년) 동안 금액 제한 없이 수의계약이 가능하다.
② 혁신시제품 시범구매 사업은 조달청 예산으로 우선 구매하여 공공기관에 제공 후 실증 테스트를 거친다.
③ 공공기관 구매담당자가 혁신제품을 구매하여 손실이 발생하더라도 고의나 중과실이 없으면 책임을 면제하는 구매자 면책 제도가 적용된다.
④ 혁신제품 인증은 유효기간 연장이 불가능하여 3년이 지나면 무조건 일반 제품으로 전환된다.

문 14. [협상계약 배점] 기획재정부 계약예규 「협상에 의한 계약체결기준」과 행정안전부 예규 「지방자치단체 입찰시 낙찰자 결정기준」의 제안서 평가 배점 기준 비교로 옳은 것은?
① 국가(기재부 예규)의 법정 기본 배점 비율은 기술능력 80점 : 입찰가격 20점이다.
② 지방(행안부 예규)의 법정 기본 배점 비율은 기술능력 70점 : 입찰가격 30점이다.
③ 국가 예규상 계약담당공무원은 사업 특성에 따라 ±20점 범위 내에서 배점한도를 가감 조정할 수 있다.
④ 지방 예규상 기술능력평가는 정성적 평가 80점으로만 구성된다.

문 15. [과락 기준] 협상에 의한 계약에서 가격 개찰 대상에서 배제되는 '과락'의 기준은?
① 기술능력평가 분야 배점한도의 50% 미만 득점자
② 기술능력평가 분야 배점한도의 70% 미만 득점자
③ 기술능력평가 분야 배점한도의 85% 미만 득점자
④ 기술능력평가 분야 배점한도의 90% 미만 득점자

문 16. [전자조달시스템] 전자조달시스템 및 연계 플랫폼의 기능에 관한 설명으로 가장 옳지 않은 것은?
① 나라장터(KONEPS)는 입찰공고, 투찰, 낙찰자 결정, 계약체결, 대금지급까지 전 과정을 처리하는 국가종합전자조달시스템이다.
② 벤처나라는 실적이 부족한 창업기업 및 벤처기업을 위한 전용 쇼핑몰로, 지정 유효기간은 6년이다.
③ 이음장터는 사전 단가계약 없이 추정가격 2,000만 원 이하 소액 용역·서비스를 공급자와 수요자가 직접 직거래하는 플랫폼이다.
④ 혁신장터는 중소기업자 간 경쟁제품만을 전용으로 매매하는 오픈마켓이다.

문 17. [목록정보] 나라장터 목록정보시스템의 품목 식별 체계에 관한 설명으로 옳은 것은?
① 물품분류번호는 10자리, 물품식별번호는 8자리로 구성된다.
② 물품분류번호 8자리와 물품식별번호 8자리가 결합하여 총 16자리의 물품식별번호가 완성된다.
③ 세부품명번호는 8자리 숫자로 구성되어 조달청 입찰공고의 기본 단위가 된다.
④ 동일한 규격의 상품이라도 제조회사가 달라지면 세부품명번호 10자리가 새로 부여된다.

문 18. [부당특약] 국가계약법령상 '부당특약' 설정 금지 규정에 대한 설명으로 가장 옳지 않은 것은?
① 발주기관은 계약상대자의 이익을 부당하게 제한하는 특약이나 조건을 정하여서는 아니 된다.
② 법령에 규정된 계약상대자의 권리를 부당하게 제한하거나 발주기관의 부담을 전가하는 특약은 무효이다.
③ 부당특약이 설정된 경우 계약상대자는 계약체결 후에는 어떠한 권리 구제도 신청할 수 없다.
④ 지방계약법 제6조 제3항에서도 부당특약의 효력을 무효로 명시하고 있다.

문 19. [PQ 심사] 입찰참가자격 사전심사(PQ) 제도에 관한 설명으로 가장 옳지 않은 것은?
① 난이도가 높거나 대형 공사 계약 시 입찰 참가 신청자의 시공경험, 기술능력, 경영상태 등을 사전 심사하는 제도이다.
② PQ 심사를 통과한 적격자에게만 입찰서 제출 자격이 부여된다.
③ 경영상태 평가 시 신용평가등급은 활용되지 않으며 오직 부채비율만으로 평가한다.
④ PQ 심사 기준 및 항목은 계약예규에 정해진 기준에 따른다.

문 20. [공동계약] 공동계약(컨소시엄)의 유형 중 '공동이행방식'과 '분담이행방식'의 비교 설명으로 옳은 것은?
① 공동이행방식은 구성원이 이행 비율에 따라 신용과 자금을 출자하고 계약 이행에 대해 연대하여 책임을 진다.
② 분담이행방식은 구성원 전체가 계약 전체 금액에 대해 연대 책임을 진다.
③ 공동이행방식은 공사 구간이나 과업 항목을 명확히 분할하여 각자 맡은 부분만 책임을 진다.
④ 주계약자관리방식에서는 부계약자가 전체 계약의 이행을 총괄 대표한다.

문 21. [불복 절차] 최신 개정 국가계약법상 중앙관서 장의 처분에 대한 불복 절차(이의신청 및 분쟁조정) 기한으로 옳은 것은?
① 이의신청: 처분을 안 날부터 15일 이내 / 사유 발생일부터 20일 이내
② 이의신청: 처분을 안 날부터 25일 이내 / 사유 발생일부터 30일 이내
③ 국가계약분쟁조정위원회 재심 청구: 이의신청 통지를 받은 날부터 20일 이내
④ 중앙관서 장의 이의신청 심사 회신 기한: 접수한 날부터 30일 이내

문 22. [지방계약 불복] 지방계약법상 이의신청 및 지방계약심의위원회 재심 청구 기한에 대한 설명으로 옳은 것은?
① 지방계약법상 이의신청 기한은 국가계약법과 동일하게 안 날부터 25일 이내이다.
② 지방계약법상 이의신청 기한은 처분을 안 날부터 15일 이내, 사유 발생일부터 20일 이내이다.
③ 지방계약심의위원회 재심 청구 기한은 통지받은 날부터 30일 이내이다.
④ 지자체 장의 이의신청 심사 회신 기한은 10일 이내이다.

문 23. [분쟁조정 대상] 국가계약분쟁조정위원회의 조정 대상이 되는 법정 최소 추정가격 기준의 연결이 올바른 것은?
① 물품·용역 계약: 추정가격 1억 원 이상
② 종합공사 계약: 추정가격 4억 원 이상
③ 전문공사 계약: 추정가격 2억 원 이상
④ 기타공사 계약: 추정가격 1.5억 원 이상

문 24. [조정 효력] 국가계약분쟁조정위원회의 조정 효력에 대한 설명으로 옳은 것은?
① 분쟁조정을 신청하면 해당 입찰 및 계약 집행 절차가 즉시 자동 정지된다.
② 조정안을 당사자가 수락하고 법정 기간 내 이의를 제기하지 않으면 민사소송법상 '재판상 화해'와 동일한 효력이 발생한다.
③ 조정위원회의 조정안은 행정심판 재결과 동일한 구속력을 가지며 불복 소송을 제기할 수 없다.
④ 조정 절차가 진행 중인 경우 당사자는 어떠한 민사소송도 제기할 수 없다.

문 25. [부정당업자 제재] 부정당업자 입찰참가자격 제한 처분에 관한 설명으로 가장 옳지 않은 것은?
① 입찰 담합, 허위 서류 제출, 정당한 사유 없는 계약 미체결 등이 대표적 제재 사유이다.
② 입찰참가자격 제한 기간의 법정 범위는 1개월 이상 2년 이하이다.
③ 처분을 받은 업체는 나라장터에 게재되어 전국 모든 공공기관의 입찰 및 하도급 참가가 차단된다.
④ 부정당업자 제재 처분 시 사전 청문(의견제출) 절차는 생략할 수 있다.

문 26. [과징금 대체] 부정당업자 제재 처분에 갈음하여 부과하는 '과징금 부과 대체 제도'에 대한 설명으로 가장 옳지 않은 것은?
① 입찰참가 자격을 제한하면 대국민 서비스 차질 등 공익을 해칠 우려가 있는 경우 적용할 수 있다.
② 과징금 부과 비율은 계약금액의 10% 이상 30% 이하 범위이다.
③ 입찰 담합이나 뇌물 제공 등 중대 비위 행위에 대해서도 과징금 대체 처분이 적극 권장된다.
④ 과징금을 납부 기한 내 미납 시 국세 체납 처분의 예에 따라 강제 징수된다.

문 27. [불공정조달] 불공정조달행위에 대한 조달청장의 조사 및 부당이득금 환수에 대한 설명으로 옳은 것은?
① 조달청장은 직접생산 위반이나 원산지 거짓 표시 등에 대해 조사권을 행사할 수 없다.
② 불공정조달행위로 위법하게 취득한 이득에 대해 부당이득금을 산정하여 국고 환수 처분을 내릴 수 있다.
③ 부당이득금 환수 처분은 부정당업자 제재 처분과 병과하여 부과할 수 없다.
④ 환수금 납부 기한은 통지받은 날부터 60일 이내이다.

문 28. [인지세법] 인지세법상 공공계약 체결 시 전자수입인지 납부 기준 및 분담 비율로 옳은 것은?
① 계약금액(VAT 포함) 2,000만 원 초과 시 부과하며, 발주기관이 전액 부담한다.
② 추정가격 5,000만 원 초과 시 부과하며, 계약상대자가 전액 부담한다.
③ 계약금액(VAT 포함) 5,000만 원 초과 시 부과하며, 발주기관과 계약상대자가 50:50으로 균등 분담한다.
④ 계약금액(VAT 포함) 1억 원 초과 시 부과하며, 50:50으로 분담한다.

문 29. [공기업 계약] 공기업·준정부기관 계약사무규칙상 수의계약 및 계약사무 위탁에 관한 설명으로 가장 옳지 않은 것은?
① 공기업·준정부기관은 계약 사무의 일부를 조달청장에게 위탁하여 체결할 수 있다.
② 감사원 감사 등에서 계약 사무 관련 위법 행위가 적발된 경우 지정된 기간 내 이사회 의결을 거쳐 처리해야 한다.
③ 공기업·준정부기관의 수의계약 기준은 국가계약법 시행령을 준용한다.
④ 공기업은 국가기관이 아니므로 부정당업자 제재 처분을 내릴 권한이 없다.

문 30. [유권해석] 공공조달 관련 유권해석 및 원칙에 관한 설명으로 가장 옳지 않은 것은?
① 중앙조달(조달청 위탁) 계약 체결 시 계약 집행 및 해석은 조달청의 관련 규정과 해석이 우선 적용된다.
② 계약 이행 중 해석이 대립할 때 발주기관의 독단적 해석이 언제나 절대적 구속력을 갖는다.
③ 법제처 유권해석은 행정기관에 대한 법적 참조 기준이 된다.
④ 계약 체결 후 법령이 개정된 경우 별도 부칙 규정이 없는 한 계약 체결 당시의 법령이 적용되는 것이 원칙이다.

문 31. [PEST 분석] 공공조달 계획 수립 시 사용되는 PEST 분석의 4가지 외부환경 요인으로 올바르게 짝지어진 것은?
① Political(정치), Economic(경제), Social(사회), Technological(기술)
② Price(가격), Product(제품), Place(유통), Promotion(홍보)
③ Performance(성능), Efficiency(효율), Safety(안전), Time(시간)
④ Policy(정책), Environment(환경), Security(보안), Trade(무역)

문 32. [Kraljic 매트릭스] Kraljic의 구매 포트폴리오 매트릭스에서 '병목 품목(Bottleneck Items)'의 특징과 조달 전략으로 옳은 것은?
① 구매 영향력이 크고 공급 위험이 낮아 가격 인하 및 제3자 단가계약(MAS)을 추진한다.
② 구매 영향력이 낮고 공급 위험이 높아 공급 안정성 확보, 재고 확보 및 장기 계약을 추진한다.
③ 구매 영향력과 공급 위험이 모두 높아 핵심 파트너십 및 수의계약을 추진한다.
④ 구매 영향력과 공급 위험이 모두 낮아 표준화 및 절차 간소화를 추진한다.

문 33. [수요예측] 정량적 수요예측 기법 중 '지수평활법(Exponential Smoothing)'에 대한 설명으로 옳은 것은?
① 전문가 집단에게 반복적인 설문조사를 실시하여 의견을 수렴하는 정성적 기법이다.
② 최근 시점의 실적치에 더 높은 가중치를 부여하여 예측치를 산출하는 시계열 기법이다.
③ 단순 과거 데이터의 산술평균만을 계산하여 다음 기의 수요를 예측하는 기법이다.
④ 독립변수와 종속변수 간의 상관관계를 선형 방정식으로 도출하는 기법이다.

문 34. [LCC 분석] 생애주기비용(LCC: Life Cycle Cost) 및 총소유비용(TCO) 분석에 관한 설명으로 가장 옳지 않은 것은?
① LCC는 제품의 기획·획득, 운영·유지보수, 폐기 및 처리까지 전 과정에 발생하는 총비용을 의미한다.
② 최초 구매 가격이 저렴하더라도 유지보수비나 에너지 소비량이 과다하면 LCC 관점에서 불리하다.
③ LCC 평가 시 미래에 발생하는 비용은 할인율을 적용하여 현재가치(PV)로 환산하여 평가한다.
④ 공공조달 최저가 낙찰제는 LCC 및 TCO 평가 개념을 완벽하게 반영하는 낙찰 방식이다.

문 35. [과업지시서] 과업지시서(SOW) 작성 시 '성능규격(Performance Specification)'과 '기술규격(Detail Specification)'의 비교로 가장 옳지 않은 것은?
① 성능규격은 원하는 최종 결과물이나 요구 성능만을 제시하여 업체의 기술 혁신을 유도한다.
② 기술규격은 재료, 치수, 제조 공정 등을 구체적으로 지정하므로 특정 업체 특혜 논란이 발생할 수 있다.
③ 성능규격을 사용하면 발주기관의 관리 감독 부하가 증가하여 공공조달에서 엄격히 금지된다.
④ 특정 규격이나 상표명을 지정하여 입찰 공고를 내는 것은 경쟁 제한 행위로 금지된다.

문 36. [예정가격 산정] 국가계약법령상 예정가격 작성 시 가격 결정의 법정 적용 우선순위로 올바른 것은?
① 거래실례가격 ➔ 원가계산에 의한 가격 ➔ 감정가격 ➔ 견적가격
② 원가계산에 의한 가격 ➔ 거래실례가격 ➔ 견적가격 ➔ 감정가격
③ 견적가격 ➔ 감정가격 ➔ 거래실례가격 ➔ 원가계산에 의한 가격
④ 감정가격 ➔ 거래실례가격 ➔ 원가계산에 의한 가격 ➔ 견적가격

문 37. [원가계산: 일반관리비] 제조업 제품 원가계산 구조에서 '일반관리비' 산정 방식 및 원가 요소에 관한 설명으로 옳은 것은?
① 일반관리비 = 제조순원가(재료비 + 노무비 + 경비) × 일반관리비율
② 일반관리비 = 직접재료비 × 일반관리비율
③ 일반관리비 산정 시 이윤이 포함된다.
④ 제조 일반관리비율의 법정 상한선은 업종 구분 없이 일률적으로 10%이다.

문 38. [원가계산: 이윤] 공공계약 원가계산 시 '이윤' 산정 공식으로 올바른 것은? (단, 일반 제조/용역 기준)

③ 이윤 = (재료비 + 노무비 + 경비 + 일반관리비) × 이윤율
④ 이윤 = 제조원가 총액 × 이윤율

문 39. [원가계산: 요율] 법정 원가계산 비목별 요율 상한선 연결이 가장 올바른 것은?
① 공사 일반관리비 법정 상한: 8% 이하 (실무 6% 이하)
② 제조 일반관리비 법정 상한: 전 업종 일률 15% 이하
③ 일반 용역 이윤 법정 상한: 25% 이하
④ 소프트웨어(SW) 개발 사업 이윤 법정 상한: 10% 이하

문 40. [복수예비가격] 예정가격 형성을 위한 '복수예비가격' 작성 메커니즘에 대한 설명으로 옳은 것은?
① 기초금액을 기준으로 국가계약법은 ±2%, 지방계약법은 ±3% 범위 내에서 15개의 복수예비가격을 작성한다.
② 입찰자가 투찰 시 무작위로 선택한 2개의 예비가격을 단순 산술평균한다.
③ 복수예비가격 작성 시 기초금액은 대외에 공개하지 않고 무조건 비공개한다.
④ 예정가격은 15개 예비가격 중 최고가와 최저가를 제외한 나머지 13개의 평균으로 결정한다.

문 41. [사전규격공개] 사전규격공개 제도에 관한 설명으로 가장 옳지 않은 것은?
① 입찰공고를 내기 전 제안요청서나 구매규격을 사전에 공개하여 입찰 참가 기회의 균등을 도모하는 제도이다.
② 사전규격공개 기간은 원칙적으로 5일 이상이다.
③ 사전규격공개 내용에 대해 업체가 이의를 제기한 경우 발주기관은 5일 이내에 처리 결과를 통지해야 한다.
④ 긴급 입찰이나 추정가격 2,000만 원 이하 계약 시에도 사전규격공개는 절대로 생략할 수 없다.

문 42. [입찰공고 기간] 계약 종류별 법정 입찰공고 기간(첫날 미산입) 연결이 올바르게 짝지어진 것은?
① 일반경쟁입찰: 7일 이상
② 협상에 의한 계약 (추정가격 고시금액 미만): 40일 이상
③ 긴급 입찰 및 재공고입찰: 10일 이상
④ 정부구매협정(GPA)에 따른 국제입찰: 15일 이상

문 43. [시장조사 문서] 시장조사 기법인 RFI, RFP, RFQ에 대한 설명으로 가장 옳지 않은 것은?
① RFI(정보요청서)는 사업 구상 초기 단계에서 시장의 기술 동향 및 공급자 정보를 수집하기 위해 발송한다.
② RFP(제안요청서)는 발주기관의 과업 요구사항을 명시하여 공급자로부터 제안서를 제출받기 위한 문서이다.
③ RFQ(견적요청서)는 구체적인 물품·서비스 규격이 확정된 후 가격 견적만을 요청하기 위해 사용한다.
④ RFQ를 발송하면 응찰자는 반드시 정성적 제안서를 작성하여 제출해야 한다.

문 44. [리스크 관리] 공공조달 리스크 대응 4대 전략(ISO 31000)과 그 예시의 연결이 옳지 않은 것은?
① 회피(Avoidance): 위법성이 있거나 위험이 극심한 사업 추진을 철회하거나 취소함.
② 완화(Mitigation): 계약 이행 보증서나 이행보증보험을 제출받아 손실을 대비함.
③ 전가(Transfer): 보험 가입이나 계약상 손해배상 특약을 통해 위험을 제3자에게 넘김.
④ 수용(Acceptance): 리스크 발생 가능성과 영향을 인지하고 잔여 리스크를 자체 수용함.

문 45. [개산계약] 개산계약 및 사후원가검토조건부 계약에 관한 설명으로 옳은 것은?
① 개산계약은 입찰 전 예정가격을 완벽히 확정할 수 있는 일반 물품 구매 시 체결한다.
② 사후원가검토조건부 계약은 계약 체결 시 정산 기준을 미리 정하고, 이행 완료 후 실제 투입 원가를 검증하여 정산한다.
③ 개산계약 체결 후에는 어떠한 원가 정산 절차도 거치지 않는다.
④ 사후원가검토조건부 계약 시 업체가 제출한 영수증은 검증 없이 전액 인정해야 한다.

문 46. [단가계약] 단가계약(Unit Price Contract)에 대한 설명으로 가장 옳지 않은 것은?
① 일정 기간 동안 계속적·반복적으로 필요한 물품이나 용역에 대해 단가를 정하여 체결하는 계약이다.
② 조달청의 제3자 단가계약은 전국 공공기관이 공통으로 이용할 수 있는 시스템이다.
③ 단가계약을 체결하면 수요기관은 별도 수의계약이나 총액 입찰 없이 납품요구서 발주만으로 구매할 수 있다.
④ 단가계약 체결 시 총 수량과 총 금액을 계약 체결 시점에 완벽히 확정해야만 한다.

문 47. [분할발주 금지] 조달 발주 시 '의도적 분할발주(쪼개기 계약)' 금지 원칙에 대한 설명으로 옳지 않은 것은?
① 동일 사업을 시기적으로 쪼개어 수의계약으로 체결하는 행위는 엄격히 금지된다.
② 수의계약 한도 회피 목적으로 공사나 물품을 분할하여 발주하면 감사 적발 및 처분 대상이 된다.
③ 사업의 특성상 전문공사(전기, 소방, 정보통신공사)를 관련 법령에 따라 분리발주하는 것은 위법한 쪼개기 발주에 해당한다.
④ 예산 조기 집행이나 효율적 공정 관리를 위한 합법적 분할 발주는 객관적 사유가 입증되어야 한다.

문 48. [공급자 선호] 공공조달 공급자 선호 매트릭스(Supplier Preferencing)에서 공급자가 공공기관을 바라보는 4가지 관점에 해당하지 않는 것은?
① 통합(Intergration): 공급자가 공공기관을 직접 인수합병하는 관점.
② 개발(Development): 현재 매출은 작으나 매력도가 높아 장기적 고객으로 육성하고자 함.
③ 착취(Exploit): 매출은 크나 매력도가 낮아 단기 이익을 극대화하고자 함.
④ 방치(Nuisance): 매출과 매력도가 모두 낮아 관심이 없거나 외면함.

문 49. [결정계수] 회귀분석(Regression Analysis)을 통한 수요예측 시 사용되는 결정계수($R^2$)의 의미로 옳은 것은?
① 독립변수가 종속변수를 설명하는 변동의 비율(설명력)을 나타내며 0과 1 사이의 값을 가진다.
② 수요예측의 오차 절대 평균을 의미한다.
③ 시계열 데이터의 계절적 변동 주기를 의미한다.
④ 데이터의 단순 평균값을 의미한다.

문 50. [기술개발제품] 성능인증(EPC) 및 신제품인증(NEP) 제품의 우선구매 및 수의계약에 관한 설명으로 옳은 것은?
① NEP 및 성능인증 제품은 중소기업이 직접 생산한 경우 인증 유효기간 범위 내에서 금액 제한 없이 수의계약이 가능하다.
② NEP 인증의 주무 부처는 중소벤처기업부이다.
③ 성능인증의 유효기간은 기본 10년이다.
④ NEP 제품은 대기업이 생산하더라도 중소기업 우대 수의계약 혜택을 동일하게 받는다.

문 51. [보증금 요율] 공공계약의 3대 보증금(입찰, 계약, 하자)의 법정 기본 보증 요율 연결이 올바른 것은?
① 입찰보증금: 입찰금액의 5% 이상 / 공사 계약보증금: 계약금액의 10% 이상 / 하자보수보증금: 2%~10%
② 입찰보증금: 입찰금액의 10% 이상 / 공사 계약보증금: 계약금액의 10% 이상 / 하자보수보증금: 15%
③ 입찰보증금: 입찰금액의 2% 이상 / 공사 계약보증금: 계약금액의 20% 이상 / 하자보수보증금: 5%
④ 입찰보증금: 입찰금액의 5% 이상 / 공사 계약보증금: 계약금액의 5% 이상 / 하자보수보증금: 1%

문 52. [공사이행보증서] 공사계약 체결 시 순수 금전적 계약보증금 제출에 갈음하여 보증기관이 시공을 직접 보증하는 '공사이행보증서'를 제출할 때의 법정 기본 보증 비율은?
① 계약금액의 20% 이상

문 53. [입찰보증금 귀속] 입찰보증금의 국고 귀속 사유 및 효과에 대한 설명으로 가장 옳지 않은 것은?
① 낙찰자가 정당한 이유 없이 낙찰 통지 후 10일 이내에 계약을 체결하지 않은 경우 국고 귀속된다.
② 전자입찰 시 제출한 입찰보증금 지급확약서(지급각서)에 따라 현금 납부 의무가 발생한다.
③ 입찰보증금이 국고 귀속되면 부정당업자 입찰참가자격 제한 처분은 면제된다.
④ 정당한 사유(불가항력 등)가 인정되는 경우에는 입찰보증금을 귀속시키지 아니할 수 있다.

문 54. [선금 관리] 선금(선급금) 지급 및 정산에 관한 설명으로 가장 옳지 않은 것은?
① 선금은 계약상대자의 원자재 확보 및 노무비 지급 등 원활한 이행을 지원하기 위해 지급한다.
② 선금 지급 시 계약상대자는 지급받는 선금액에 동액 이상의 이행보증보험증권을 제출해야 한다.
③ 선금은 계약 목적 달성을 위한 용도 외에 타 용도로 사용할 수 없다.
④ 계약이 중도 해지된 경우 선금 잔액 회수 시 이자 가산 환수는 엄격히 금지된다.

문 55. [기성대가] 기성대가 지급 및 검사 법정 기한에 관한 설명으로 옳은 것은?
① 검사원이 검사 신청을 받은 날부터 14일 이내에 검사를 완료해야 한다.
② 대가 지급 신청을 받은 날부터 10일 이내에 대금을 지급해야 한다.
③ 기성금 지급 시 선금 정산은 이루어지지 않는다.
④ 검사 기한 연장은 어떠한 경우에도 불가능하다.

문 56. [지체상금률] 계약 이행 지체 시 부과하는 지체상금률(1일당)의 법정 기준 연결이 올바른 것은?
① 공사: 0.05% (1,000분의 0.5) / 물품 제조·구매: 0.075% (1,000분의 0.75) / 용역: 0.125% (1,000분의 1.25)
② 공사: 0.1% / 물품: 0.1% / 용역: 0.1%
③ 공사: 0.125% / 물품: 0.05% / 용역: 0.075%
④ 공사: 0.075% / 물품: 0.125% / 용역: 0.05%

문 57. [지체상금 상한] 지체상금의 부과 상한선 및 면제 사유에 대한 설명으로 옳은 것은?
① 지체상금 총액은 계약금액의 30%를 초과할 수 없다.
② 천재지변 등 불가항력 사유로 지체된 경우에도 지체상금은 전액 부과된다.
③ 발주기관의 귀책사유로 공사가 지연된 기간에 대해서도 지체상금을 부과한다.
④ 검사 소요 기간이 법정 기한을 초과한 경우 초과된 일수는 지체일수에 산입한다.

문 58. [물가변동 ESC] 물가변동으로 인한 계약금액 조정(ESC)의 2대 필수 법정 요건으로 올바르게 짝지어진 것은?
① 계약체결 후 60일 경과 & 물가변동률 5% 이상 증감
② 계약체결 후 90일 경과 & 물가변동률 3% 이상 증감
③ 계약체결 후 180일 경과 & 물가변동률 10% 이상 증감
④ 계약체결 후 30일 경과 & 물가변동률 1% 이상 증감

문 59. [조정률 방식] 물가변동 계약금액 조정 산출 방식 중 '품목조정률'과 '지수조정률'에 대한 설명으로 옳지 않은 것은?
① 품목조정률은 비목별 가격 변동률을 직접 산출하여 적용하는 방식이다.
② 지수조정률은 한국은행 물가지수 등 통계 지수를 비목별 가중치에 곱하여 산출한다.
③ 동일한 계약에 대해 품목조정률과 지수조정률을 혼용하여 동시에 적용할 수 있다.
④ 계약상대자가 지수조정률 적용을 신청한 경우 특별한 사정이 없는 한 이에 따른다.

문 60. [신규비목 단가] 설계변경으로 인한 계약금액 조정 시 '신규 비목(당초 수량목록에 없던 비목)'의 단가 산정 원칙으로 옳은 것은?
① 설계변경 당시를 기준으로 산정한 단가에 낙찰률을 곱한 금액
② 발주기관이 작성한 예정가격 단가
③ 설계변경 당시를 기준으로 산정한 단가와 동 단가에 낙찰률을 곱한 금액의 범위 내에서 발주기관과 계약상대자가 상호 협의하여 결정한 단가 (50:50)
④ 계약상대자가 제출한 산출내역서상의 단가

문 61. [신기술 인센티브] 계약상대자의 신기술·신공법 제안으로 설계변경이 이루어져 공사비가 절감된 경우의 인센티브 규정으로 옳은 것은?
① 절감된 금액의 전액(100%)을 감액 조정한다.
② 절감액의 30%를 감액하고, 70%에 해당하는 금액을 계약상대자에게 인센티브로 인정(단가 감액 제한)한다.
③ 계약금액을 오히려 20% 증액해 준다.
④ 신기술 제안으로 인한 설계변경은 엄격히 금지된다.

문 62. [턴키 공사 설계변경] 일괄입찰(턴키) 및 대형공사 계약에서 설계변경 시 계약금액 증액 조정에 관한 설명으로 옳은 것은?
① 발주기관의 귀책사유가 없는 한 계약상대자의 제안이나 설계 오류로 인한 설계변경 시 계약금액을 증액할 수 없다.
② 턴키 공사는 어떠한 이유로도 설계변경이 불가능하다.
③ 물가변동으로 인한 계약금액 조정도 턴키 공사에서는 적용되지 않는다.
④ 계약상대자가 임의로 설계를 변경하여 증액을 요청하면 전액 수용해야 한다.

문 63. [간접비 실비 정산] 발주기관의 귀책사유로 공기 연장이 발생한 경우 간접비(간접노무비, 기타경비 등) 실비 정산에 대한 설명으로 옳은 것은?
① 공기 연장으로 추가 투입된 간접비는 실비 범위 내에서 계약금액을 증액 조정해 주어야 한다.
② 간접비 증액 청구는 준공 대가 지급 수령 후에도 제한 없이 청구할 수 있다.
③ 간접노무비 산정 시 실제 현장에 근무하지 않은 본사 직원 인건비도 포함된다.
④ 공기 연장 간접비 조정 시 승인된 변경 계약서나 현장 연장 근무 확인서 등 증빙서류는 필요 없다.

문 64. [하도급 직불] 건설공사 하도급 관리 및 '하도급대금 직접지급(직불)' 사유에 해당하지 않는 것은?
① 발주기관·원도급자·하수급인 3자가 하도급대금 직접지급에 합의한 경우
② 원도급자가 하도급대금을 2회 이상 지급 지체하여 하수급인이 직불을 요청한 경우
③ 하도급대금 지급보증서를 원도급자가 교부하지 않고 대금을 지체한 경우
④ 원도급자가 당해 공사로 대규모 흑자를 낸 경우

문 65. [하도급 통지] 건설공사 하도급 통지 및 승인 법정 기한으로 올바른 것은?
① 하도급 계약 체결일부터 30일 이내에 발주기관에 통지해야 한다.
② 하도급 승인 신청을 받은 발주기관은 10일 이내에 통지해야 한다.
③ 하도급 통지는 공사 준공 후 한 번에 제출한다.
④ 하도급 계약 체결 전 사전에만 통지할 수 있다.

문 66. [하도급지킴이] 전자조달 하도급 관리 시스템인 '하도급지킴이'에 관한 설명으로 가장 옳지 않은 것은?
① 하도급 대금, 노무비, 장비대금 등의 미지급 및 임금 체불을 방지하기 위한 전용 시스템이다.
② 하도급지킴이를 통한 노무비는 전용 약정 계좌를 거쳐 근로자 개인 계좌로 직접 지급된다.
③ 원도급자가 하도급 대금을 인출하여 타 용도로 무단 사용하는 것이 인출 제한 기능으로 차단된다.
④ 하도급지킴이는 민간 건설공사에만 의무 적용되며 공공공사에서는 사용이 금지된다.

문 67. [MAS 2단계경쟁] 다수공급자계약(MAS) 2단계경쟁 의무 적용 기준 금액(1회 납품요구금액 기준)으로 올바른 것은?
① 일반 물품: 5,000만 원 이상 / 중소기업자 간 경쟁제품: 1억 원 이상
② 일반 물품: 2,000만 원 이상 / 중소기업자 간 경쟁제품: 5,000만 원 이상
③ 일반 물품: 1억 원 이상 / 중소기업자 간 경쟁제품: 2억 원 이상
④ 일반 물품: 10억 원 이상 / 중소기업자 간 경쟁제품: 10억 원 이상

문 68. [우대가격 유지] MAS 계약상대자의 '우대가격 유지 의무' 및 위반 시 제재 조치에 대한 설명으로 옳은 것은?
① MAS 등록 가격을 시중 거래가격보다 높게 유지해도 아무런 제재가 없다.
② 시중 거래가격이 MAS 계약가격보다 저렴하게 판매된 경우 동등 이하로 단가를 인하해야 하며, 위반 시 거래정지 및 부당이득금 환수 처분을 받는다.
③ 우대가격 유지 의무는 대기업에만 적용되며 중소기업은 면제된다.
④ 우대가격 준수 여부는 계약 체결 시에만 검증하며 계약 기간 중에는 조사하지 않는다.

문 69. [SW 과업심의] 소프트웨어(SW) 사업 계약 관리 시 '과업심의위원회' 및 과업 변경에 관한 설명으로 가장 옳지 않은 것은?
① SW 사업의 과업 내용 변경 및 이에 따른 계약금액·기간 조정을 심의하기 위해 발주기관에 과업심의위원회를 설치·운영한다.
② 계약상대자는 과업 변경이 필요한 경우 발주기관의 장에게 과업 변경 신청을 할 수 있다.
③ 과업심의위원회 심의 결과 과업 변경이 확정된 경우 발주기관은 계약금액을 증액 조정해야 한다.
④ SW 사업에서 발주기관은 과업 변경이 발생하더라도 계약금액을 절대로 변경해 줄 수 없다.

문 70. [e-발주시스템] e-발주시스템을 통한 용역계약 관리에 관한 설명으로 옳지 않은 것은?
① 제안서 제출, 제안서 평가, 과업 관리 등 용역계약 전 과정을 온라인으로 처리하는 시스템이다.
② 제안서 평가위원의 평가 점수 및 결과가 투명하게 기록·관리된다.
③ e-발주시스템을 통해 서류 제출 비용과 행정 소요 시간을 절감할 수 있다.
④ e-발주시스템은 오직 종이 서류 제출만을 전담하는 인쇄용 프로그램이다.

문 71. [장기계속계약] 장기계속계약과 계속비계약의 비교 설명으로 가장 옳지 않은 것은?
① 장기계속계약은 총액과 총공기를 부의하고 매 연차별로 예산 범위 내에서 계약을 체결하는 방식이다.
② 계속비계약은 지방의회나 국회의 의결을 얻어 총액과 연차별 금액을 일괄 계약하는 방식이다.
③ 장기계속계약에서 계약보증금은 매 연차별 계약금액을 기준으로 적립하는 것이 원칙이다.
④ 장기계속계약의 연차별 계약이 이행 완료되면 해당 연차의 계약보증금은 국고에 무조건 귀속된다.

문 72. [해제와 해지] 계약의 해제(Cancellation)와 해지(Termination)의 법정 효력 비교로 옳은 것은?
① 해제는 소급효가 있어 계약이 처음부터 없었던 상태로 돌아가 원상회복 의무가 발생한다.
② 해지는 소급효가 있어 과거의 이행 부분까지 모두 무효로 만든다.
③ 해제는 장래에 향하여 계약 관계를 소멸시키는 행위이다.
④ 공공계약 이행 중 계약상대자의 귀책으로 중도 중단되는 경우 언제나 해제만 적용된다.

문 73. [해제·해지 시 청구] 발주기관의 귀책사유로 계약이 해제·해지된 경우 계약상대자가 청구할 수 있는 권리로 옳은 것은?
① 이미 이행한 부분에 대한 기성대금 청구 및 계약 해제로 인한 손해배상 청구
② 계약보증금의 국고 귀속
③ 부정당업자 입찰참가자격 제한 처분 수용
④ 어떠한 대금도 청구할 수 없다.

문 74. [하자보수보증] 하자담보책임기간 및 하자보수보증금 납부에 관한 설명으로 가장 옳지 않은 것은?
① 하자담보책임기간은 공종별로 1년에서 10년 범위 내에서 정해진다.
② 준공검사 완료 후 대가를 지급받기 전까지 하자보수보증금을 예치해야 한다.
③ 단순 소모품 구매나 단순 용역의 경우 하자보수보증금 납부를 면제할 수 있다.
④ 하자담보책임기간이 종료되면 하자보수보증금은 즉시 발주기관의 소유로 귀속된다.

문 75. [관급자재 관리] 공사계약 시 '관급자재(발주자 공급 자재)'의 관리 책임 및 관급자재 관리 위반 시 조치로 옳은 것은?
① 관급자재는 발주기관이 제공하므로 현장에 반입된 후 망실·훼손되더라도 시공사는 배상 책임이 없다.
② 시공사는 관급자재를 선량한 관리자의 주의의무로 보관·관리해야 하며, 시공사 귀책으로 망실 시 배상 책임을 진다.
③ 관급자재는 시공사가 임의로 타 현장에 전용하여 사용할 수 있다.
④ 관급자재에 하자가 있는 경우 시공사는 무조건 자기 비용으로 즉시 교체해야 한다.

문 76. [불가항력 이행지연] 계약 이행 중 발생한 불가항력(천재지변, 감염병 등) 사유로 인한 이행 지연 조치로 옳은 것은?
① 지체상금을 부과하고 계약을 즉시 해제한다.
② 불가항력 기간만큼 계약 기간을 연장하고 해당 기간에 대한 지체상금을 면제한다.
③ 계약상대자에게 벌금을 부과한다.
④ 불가항력 기간에도 계약상대자가 모든 손실을 전액 부담한다.

문 77. [대금 지급 기한] 공공계약의 대금 지급 법정 기한(검사 완료 후 대가 청구를 받은 날부터)으로 옳은 것은?
① 5일 이내 (재난 등 위기 극복 시 3일 이내)
② 14일 이내
③ 30일 이내
④ 60일 이내

문 78. [합병 시 제재 승계] 부정당업자 제재 처분을 받은 법인의 합병 시 제재 효력 승계 여부에 대한 설명으로 옳은 것은?
① 피합병법인(소멸법인)이 받은 부정당업자 제재 효력은 합병 후 존속법인에 승계된다.
② 법인이 합병되면 과거의 모든 부정당업자 제재 효력은 즉시 소멸한다.
③ 대표자가 동일한 신설 법인은 제재 효력을 절대 승계받지 않는다.
④ 합병 시 제재 효력 승계는 민사법상 불가능하다.

문 79. [분쟁조정 집행정지] 국가계약분쟁조정위원회의 분쟁 조정 신청 시 집행 정지에 관한 설명으로 옳은 것은?
① 분쟁 조정을 신청하면 별도의 정지 명령이 없어도 당해 입찰 및 계약 집행 절차가 자동 정지된다.
② 분쟁 조정을 신청하더라도 위원회의 별도 중지 명령이 없는 한 당해 입찰 및 계약 집행 절차가 자동으로 정지되는 것은 아니다.
③ 집행 정지는 오직 법원의 가처분 신청으로만 가능하다.
④ 분쟁 조정 신청 중에는 어떠한 계약 변경도 할 수 없다.

문 80. [직무 윤리] 공공조달관리사의 직무 윤리 및 전문성 원칙에 관한 설명으로 가장 옳지 않은 것은?

해설: 시공사는 관급자재에 대해 선량한 관리자의 주의의무를 다해야 하며, 시공사 귀책으로 망실·훼손 시 배상 책임을 진다.

해설: 천재지변 등 불가항력 사유로 이행이 지연되면 해당 기간만큼 계약 기간을 연장하고 지체상금을 면제합니다.

해설: 공공계약 대금 지급 법정 기한은 검사 완료 후 청구를 받은 날부터 5일 이내 (위기 극복 시 3일 이내)입니다.

해설: 피합병법인(소멸법인)이 받은 부정당업자 제재 효력은 합병 후 존속법인에 승계됩니다.

해설: 국가계약분쟁조정위원회에 분쟁 조정을 신청하더라도 위원회의 별도 중지 명령이 없는 한 입찰 및 계약 집행 절차가 자동 정지되지는 않습니다.

문 80. [정답] ④
해설: 위법한 부당특약이나 허위 서류 제출을 권장하는 것은 공공조달관리사의 직무 윤리와 전문성 원칙에 정면으로 위배됩니다.
</script>

<script>
// 정밀 매칭 파싱 엔진 (문항 번호 기준 완벽 고정)
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱 (문항 번호별로 정확히 맵핑)
    const ansMap = {};
    aText.split(/^(?=문 \d+\.)/gm).forEach(block => {
        const match = block.match(/문 (\d+)\.\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=문 \d+\.)/gm).filter(b => /^문 \d+\./.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/문 (\d+)\.\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (문 1 ~ 30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (문 31 ~ 50)",
    3: "제3과목: 공공계약관리 (문 51 ~ 80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;


    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
        
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);


    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }


    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

}

window.onload = renderQuiz;
</script>
