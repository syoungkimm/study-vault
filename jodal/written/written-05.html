문 1. 공공조달 성숙도 모델(Harland et al.)의 7단계 구조 중 'State 4(전략적 조달)'와 'State 5(통합 조달)' 단계의 특성 비교로 가장 옳은 것은?
① State 4는 단순히 관계 법령 및 내부 절차 준수(Compliance)만을 최우선으로 삼는 초기 단계이다.
② State 4는 내부 부서 간 협업을 넘어 공급망(Supply Chain) 전체의 총소유비용(TCO) 및 전 생애주기 가치(VFM) 극대화를 추진하는 단계이다.
③ State 5는 국가적 차원의 사회적 가치(ESG, 중소기업 육성, 탄소중립 등) 달성을 조달 정책의 최우선 목표로 삼는 단계이다.
④ State 5는 전사적 모듈화 및 전자인프라를 바탕으로 조달 프로세스가 내부 기능 간 연계·통합되어 표준화된 운영 효율성을 달성하는 단계이다.

문 2. 공공조달과 민간 상업 구매(Commercial Purchasing)의 본질적 차이점에 대한 설명으로 가장 옳지 않은 것은?
① 공공조달의 재원은 국민의 세금 및 공공 재정이므로 엄격한 투명성(Transparency)과 법적 책임성(Accountability)이 요구된다.
② 민간 구매는 사적 자치의 원칙에 따라 구매 당사자 간 합의만으로 계약 형태와 공급자를 자율적으로 선택할 수 있다.
③ 공공조달은 이윤 극대화가 유일한 목적이므로 공급자 선정 시 사기업의 비공개 은밀 협상 방식을 원칙으로 채택한다.
④ 공공조달은 국가계약법, 판로지원법 등 엄격한 법률적 절차에 의해 통제되며 공익 달성 및 사회적 약자 배려 등 정책적 목적을 동시 수행한다.

문 3. 공공조달 3대 구성체계(법적·조직적·운영적 체계)에 관한 설명으로 가장 옳지 않은 것은?
① 법적 체계는 헌법상 재정 기본원칙을 최상위로 하여 국가계약법·지방계약법·조달사업법 등의 법률과 시행령, 계약예규 등으로 위계화되어 있다.
② 조직적 체계에서 기획재정부와 행정안전부는 조달 관련 법령 및 제도 수립을 담당하고, 조달청은 중앙조달 집행 전문기관 역할을 수행하며, 감사원은 사후 통제 기관으로 기능한다.
③ 운영적 체계의 핵심인 국가종합전자조달시스템(나라장터, KONEPS)은 입찰공고, 투찰, 계약, 대금 지급까지 전 과정을 전자적으로 처리한다.
④ 대한민국의 현행 조달 조직 체계는 모든 공공기관의 구매를 조달청이 100% 전담 처리하는 완전 단일 중앙조달 체계만을 법적으로 강제하고 있다.

문 4. 국가계약법상 계약 체결 방식 중 '2단계 경쟁입찰'과 '규격·가격 동시입찰'의 절차적 차이에 대한 설명으로 옳은 것은?
① 2단계 경쟁입찰은 규격입찰서와 가격입찰서를 동시 제출받아 규격만 먼저 평가하고 가격은 나중에 개찰한다.
② 2단계 경쟁입찰은 1단계에서 규격(기술)제안서만 먼저 제출받아 평가하여 적격자를 선정한 후, 2단계에서 적격자만을 대상으로 가격입찰서를 제출받아 개찰한다.
③ 규격·가격 동시입찰은 규격 평가 결과 적격자가 1인뿐인 경우 가격입찰서를 개찰할 수 없다.
④ 두 방식 모두 1단계 규격 평가에서 부적격 판정을 받은 업체의 가격입찰서도 포함하여 함께 개찰한다.

문 5. [2026 최신개정] 국가계약법 및 지방계약법상 이의신청 및 분쟁조정 제도의 설명으로 옳은 것은?
① 국가계약법상 중앙관서의 장의 불이익 처분에 대한 이의신청은 처분을 안 날부터 25일 이내, 원인행위 발생일부터 30일 이내에 제기해야 한다.
② 지방계약법상 이의신청 기한도 국가계약법과 전면 동일하게 처분을 안 날부터 25일 이내로 정정 개정되었다.
③ 국가계약분쟁조정위원회의 조정안에 대해 당사자가 통지를 받은 날부터 10일 이내에 이의를 제기하지 않으면 조정이 성립한다.
④ 분쟁조정위원회에 조정이 신청되면 해당 입찰 절차는 법적으로 자동 즉시 정지된다.

문 6. 국가계약법 시행령상 제한경쟁입찰의 참가 자격 제한 요건에 대한 설명으로 가장 옳지 않은 것은?
① 실적 제한을 적용할 때 동등 이상 또는 유사 사업의 실적은 당해 계약목적물 규모 또는 양의 1배(100%) 이내로 제한해야 한다.
② 특수한 기술 또는 장비 보유 여부로 제한경쟁입찰을 부칠 수 있다.
③ 지역제한입찰은 법인등기부상 본점 소재지를 기준으로 제한해야 한다.
④ 지역제한입찰은 사업의 시급성이 인정되는 경우 추정가격 금액 규모(GPA 고시금액 이상 포함)와 상관없이 무제한 적용할 수 있다.

문 7. 수의계약 사유 중 '단독공급원(Sole Source)'과 '단일공급원(Single Source)'의 구분에 대한 설명으로 옳은 것은?
① 단독공급원은 시장에 대체 공급자가 다수 존재하나 긴급성 때문에 특정 1개사를 발주처가 지정하는 경우이다.
② 단독공급원은 특허, 독점적 기술 등으로 인해 시장에 대체 가능한 공급자가 오직 1곳만 존재하는 기술적 불가피 상태이다.
③ 단일공급원은 어떠한 경우에도 수의계약 사유가 될 수 없다.
④ 두 개념은 법적으로 전면 동일하며 구별할 실익이 없다.

문 8. 소액수의계약(1인 견적 및 2인 이상 전자견적) 진행 규정에 대한 설명으로 옳지 않은 것은?
① 일반 기업 대상 물품·용역의 1인 견적 수의계약 체결 한도는 추정가격 2,000만 원 이하이다.
② 여성기업, 장애인기업, 사회적기업, 청년창업기업은 물품·용역 추정가격 5,000만 원 이하까지 1인 견적 수의계약이 허용된다.
③ 추정가격 2,000만 원 초과 1억 원 이하인 소액수의계약은 나라장터를 통해 2인 이상 전자견적서를 받아 낙찰하한율 이상 최저가 투찰자를 선정한다.
④ 소액수의계약은 신속한 집행을 위해 덤핑 여부와 상관없이 무조건 0원에 투찰한 자를 즉시 낙찰자로 선정한다.

문 9. 입찰공고 및 사전규격공개 법정 기한 규정의 연결로 옳지 않은 것은?
① 일반경쟁입찰 공고 기간: 입찰서 제출 마감일 전날부터 역산하여 최소 7일 전
② 긴급공고 및 재공고입찰: 최소 5일 전까지 단축 가능
③ 협상에 의한 계약 (고시금액 이상 사업): 최소 40일 전
④ 사전규격공개 기간: 원칙적으로 최소 14일 이상 공개 필수

문 10. 입찰 관련 5대 금액(사업금액, 추정가격, 기초금액, 복수예비가격, 예정가격)의 개념 연결로 가장 옳은 것은?
① 추정가격은 부가가치세와 관급자재대를 포함한 총 금액이다.
② 기초금액은 발주기관이 조사한 원가 단가에 VAT를 합산하여 입찰공고 시 사전에 대외 공개하는 금액이다.
③ 복수예비가격은 무조건 기초금액의 ±10% 범위 내에서 15개를 생성한다.
④ 예정가격은 투명성을 위해 입찰공고문에 기초금액과 함께 사전에 대외 공개해야 한다.

문 11. 국가물품 목록정보시스템의 세부품명번호 10자리에 대한 설명으로 가장 옳지 않은 것은?
① 물품분류번호 8자리에 2자리의 세부 속성 코드를 결합하여 완성된다.
② 세부품명번호 10자리는 중소기업자 간 경쟁제품 지정의 기본 법정 단위이다.
③ 세부품명번호 10자리는 직접생산확인증명서 발급 및 MAS 단가계약의 기준 단위가 된다.
④ 세부품명번호 10자리는 개별 제조업체가 자율적으로 임의 생성하여 나라장터에 입력하는 코드이다.

문 12. 「중소기업제품 구매촉진 및 판로지원에 관한 법률」상 중소기업자 간 경쟁제품 및 직접생산확인제도 설명으로 옳지 않은 것은?
① 중소기업자 간 경쟁제품의 법정 지정 유효기간은 3년이다.
② 직접생산확인증명서의 법정 발급 유효기간은 2년이다.
③ 직접생산확인을 받은 업체가 수주 후 타사에 하도급을 주거나 완제품을 단순 수입 납품하다 적발되면 직접생산확인이 취소된다.
④ 직접생산확인이 취소된 업체는 취소된 날부터 즉시 다음 날 동일 품목에 대해 재신청할 수 있다.

문 13. 공공기관의 법정 사회적 약자 기업 우선구매 목표비율 및 성격 연결이 올바른 것은?
① 여성기업 제품: 물품·용역 5% 이상, 공사 3% 이상 (노력 의무)
② 장애인기업 제품: 총 구매액의 10% 이상 (강제 의무)
③ 중증장애인생산품: 총 구매액의 1% 이상 (노력 의무)
④ 기술개발제품: 중소기업 물품 구매액의 50% 이상 (강제 의무)

문 14. 조달청 '혁신제품 지정제도' 및 '구매자 면책제도'에 관한 설명으로 가장 옳지 않은 것은?
① 혁신제품으로 지정되면 지정일로부터 3년간 금액 제한 없이 수의계약 체결이 가능하다.
② 혁신제품을 구매하여 사용한 담당 공무원에게 고의나 중대한 과실이 없는 경우 발생한 손실에 대해 책임을 면제한다.
③ 혁신제품 구매 금액은 공공기관 경영평가 및 혁신구매 목표제 실적 산정 대상에서 전액 제외된다.
④ 조달청 예산으로 우선 구매하여 공공기관에 제공·테스트하는 시범구매 사업이 운영된다.

문 15. 「녹색제품 구매촉진에 관한 법률」상 녹색제품 3대 인증 및 공공기관 구매 관리에 관한 설명으로 옳지 않은 것은?
① 녹색제품 3대 인증은 환경표지인증, 우수재활용(GR)인증, 환경성적표지인증이다.
② 공공기관의 장은 매년 녹색제품 구매이행계획을 수립·공표해야 한다.
③ 환경성적표지 연계 저탄소제품은 공공기관 매년 녹색제품 구매실적 공표 시 실적 합산 금액에서 제외된다.
④ 환경표지는 환경부(한국환경산업기술원), GR인증은 산업통상자원부(자원순환산업진흥협회) 소관이다.

문 16. 국가계약법 제5조 제3항 및 제4항에 따른 부당특약의 사법상 효력에 대한 설명으로 가장 옳은 것은?
① 발주기관이 계약상대자의 이익을 부당하게 제한하는 부당특약을 설정을 한 경우 강행규정 위반으로서 당사자 간 각서 유무와 상관없이 사법상 무효가 된다.
② 부당특약이 설정되더라도 계약 당사자 간 서명 날인이 완료되면 유효한 특약으로 인정된다.
③ 부당특약에 대해서는 민사소송을 제기할 수 없다.
④ 부당특약은 발주처의 행정 목적을 위해 법적으로 적극 권장된다.

문 17. 국가계약법과 지방계약법의 법령상 주요 규정 차이점에 대한 설명으로 옳지 않은 것은?
① 서면 계약서 작성 생략 금액 기준: 국가계약법 3,000만 원 이하 vs 지방계약법 5,000만 원 이하
② 복수예비가격 작성 범위: 국가계약법 기초금액 ±2% vs 지방계약법 기초금액 ±3%
③ 주민참여감독자 제도: 지방계약법에만 존재하는 고유한 감독 제도이다.
④ WTO GPA 적용 국제입찰 고시금액 기준: 국가기관과 지방자치단체의 금액 기준이 전면 동일하다.

문 18. 나라장터 연계 전문몰 5종(종합쇼핑몰, 혁신장터, 벤처나라, 디지털서비스몰, 이음장터)에 대한 설명으로 옳지 않은 것은?
① 종합쇼핑몰: MAS 및 제3자 단가계약 물품의 납품요구 시스템
② 벤처나라: 창업 7년 이내 및 벤처기업의 초기 공공조달 판로 지원 전용몰
③ 디지털서비스몰: 클라우드, SaaS, AI 등 디지털서비스 전용 마켓
④ 이음장터: 100억 원 이상 대형 토목공사 자재 직거래 전용 플랫폼

문 19. 공공입찰 절차에서 민법상 법리 연계에 대한 설명으로 가장 옳지 않은 것은?
① 발주기관의 입찰공고는 '청약의 유인'에 해당한다.
② 조달업체의 투찰(입찰서 제출)은 '청약'에 해당한다.
③ 나라장터 서버에 입력·접수된 입찰서라 할지라도 입찰자는 마감 전이면 임의로 자유롭게 철회·수정할 수 있다.
④ 발주기관의 낙찰자 결정 통지는 '승낙'에 해당하며, 최종 서면 계약서 기명날인으로 본계약이 확정 성립한다.

문 20. 민법상 도급계약(제664조)에서 수급인의 하자담보책임 및 계약 해제 제한에 관한 설명으로 옳은 것은?
① 완공된 목적물이 건물 기타 토지의 공작물인 경우, 하자가 아무리 중대하더라도 도급인은 계약을 소급 해제할 수 없으며 하자보수 및 손해배상만 청구할 수 있다.
② 건물이 완공된 후 하자가 발생하면 도급인은 언제든지 건물을 철거하고 계약을 즉시 소급 해제할 수 있다.
③ 수급인의 하자담보책임은 수급인의 고의·과실이 입증되어야만 성립하는 과실책임이다.
④ 수급인은 하자에 대해 어떠한 법적 책임도 지지 않는다.

문 21. 민법상 동시이행의 항변권(제536조) 및 위험부담(제537조)이 공공계약에 적용되는 법리로 옳은 것은?
① 발주처가 선금 지급 의무를 불이행하더라도 시공사는 착공을 거부할 수 없다.
② 천재지변 등 쌍방 귀책 사유 없는 불가항력으로 목적물이 유실된 경우, 채무자위험부담주의에 따라 시공사는 미시공 부분 대금을 청구할 수 없다.
③ 시공사의 고의로 목적물이 파손된 경우에도 발주처가 위험을 전적으로 부담한다.
④ 공공계약에는 민법상 쌍무계약 법리가 일절 적용되지 않는다.

문 22. 부정당업자 입찰참가자격 제한 처분 및 과징금 대체 제도에 대한 설명으로 가장 옳지 않은 것은?
① 입찰 담합, 뇌물 제공, 부실 시공, 계약 미체결 등을 저지른 자에게 부과된다.
② 부정당업자 제재를 받으면 나라장터에 게재되어 전국 전 공공기관의 입찰 참가가 전면 차단된다.
③ 제재 기간은 1개월 이상 2년 이하 범위에서 부과된다.
④ 입찰 담합이나 뇌물 제공 등 중대 비위 행위도 예외 없이 과징금 부과 처분으로 대체할 수 있다.

문 23. 부정당업자 제재 처분을 회피할 목적으로 법인을 신설하거나 합병한 경우 법적 효력 승계에 대한 설명으로 옳은 것은?
① 제재 회피 목적으로 설립된 실질적 동일 법인에게도 기존 부정당업자 제재 효력이 승계된다.
② 법인을 신설하면 기존 제재 효력은 무조건 즉시 소멸한다.
③ 대표자가 바뀌면 기존 제재 효력이 소멸한다.
④ 합병 법인은 기존 제재 효력을 승계하지 않는다.

문 24. 조달청 불공정조달행위 조사 및 부당이득금 환수 조치에 관한 설명으로 옳지 않은 것은?
① 직접생산 위반, 원산지 거짓 표시 등 적발 시 부당이득금(차액 + 가산금)을 산정하여 국고 환수한다.
② 적발된 품목에 대해 일정 기간 나라장터 거래정지 처분을 내릴 수 있다.
③ 불공정조달행위 신고자에게는 부당이득 환수금액 등에 따라 신고포상금을 지급할 수 있다.
④ 부당이득금 환수 처분은 법원의 형사 판결이 확정되어야만 집행할 수 있다.

문 25. 공기업·준정부기관이 감사원 등으로부터 계약 비위로 적발된 경우 조달청에 계약 사무를 의무 위탁해야 하는 법정 절차 요건은?
① 적발 통보일부터 10일 이내 통보 후 60일 이내 이사회 의결을 거쳐 위탁 신청
② 적발 통보일부터 30일 이내 이사회 의결
③ 적발 통보일부터 1년 이내 위탁
④ 기획재정부장관이 직권으로 수의계약 집행

문 26. 국가계약법 및 지방계약법상 서면 계약서 작성을 생략할 수 있는 법정 금액 기준 연결이 올바른 것은?
① 국가계약법: 3,000만 원 이하 / 지방계약법: 5,000만 원 이하
② 국가계약법: 5,000만 원 이하 / 지방계약법: 3,000만 원 이하
③ 국가계약법: 1억 원 이하 / 지방계약법: 1억 원 이하
④ 두 법률 모두 금액 상관없이 계약서 작성을 생략할 수 없다.

문 27. 희망수량경쟁입찰의 낙찰자 및 단가 결정 메커니즘에 대한 설명으로 가장 옳은 것은?
① 수요 수량이 다량인 물품 구매 시 입찰자가 공급 희망 수량과 단가를 투찰하고, 예정가격 이하 최저 단가자부터 순차적으로 희망 수량을 할당하여 낙찰자를 결정한다.
② 최고 단가를 제출한 자에게 전체 수량을 몰아주는 방식이다.
③ 단가를 고정하고 수량만 제비뽑기 추첨하는 방식이다.
④ 오직 단일 공급자 1곳과만 체결하는 수의계약 방식이다.

문 28. 조달사업법상 공공기관이 조달청에 의무적으로 계약 체결을 요청해야 하는 '의무 조달요청' 금액 기준 연결이 잘못된 것은?
① 수요물자: 추정가격 1억 원 이상
② 종합공사: 추정가격 30억 원 이상
③ 전문공사 및 전기·소방공사: 추정가격 3억 원 이상
④ 수요물자: 추정가격 1,000만 원 이상

문 29. 국가계약분쟁조정위원회의 조정 재심 청구 기한 및 조정안 확정 효력으로 옳은 것은?
① 이의신청 회신을 받은 날부터 30일 이내에 재심을 청구해야 한다.
② 통지받은 날부터 10일 이내에 재심을 청구해야 한다.
③ 조정위원회의 조정안은 당사 수락 여부와 상관없이 직권으로 확정판결 효력을 갖는다.
④ 분쟁조정이 신청되면 당해 입찰 집행 절차가 법적으로 자동 즉시 정지된다.

문 30. 정부구매카드(클린카드)를 활용한 소액구매 지침으로 옳은 것은?
① 공식 입찰공고나 정식 계약서 작성 없이 500만 원 이하 소액 구매 시 카드로 결제하여 간소화 집행할 수 있다.
② 500만 원 이하 구매 시에도 반드시 10일간 전자입찰 공고를 부쳐야 한다.
③ 정부구매카드로 결제된 내역은 감사원 감사 대상에서 제외된다.
④ 정부구매카드는 유흥업소에서도 자유롭게 사용할 수 있다.

문 31. 거시환경 분석 기법인 PESTEL 분석의 6개 요인과 공공조달 사례의 연결이 옳지 않은 것은?
① Political (정치적): 정부의 국정과제 및 중소기업 지원 정책 기조
② Economic (경제적): 환율 급등, 금리 인상, 인플레이션 및 원자재 가격 폭등
③ Sociocultural (사회문화적): 저출생·고령화에 따른 사회복지 및 돌봄 서비스 조달 수요 증가
④ Environmental (환경적): 국가계약법 및 지방계약법의 수의계약 조문 개정

문 32. Kraljic 구매 포트폴리오 매트릭스 중 '병목(Bottleneck) 품목'의 특성과 최적 조달 전략으로 옳은 것은?
① 공급 위험도는 높고 재무적 영향(지출 규모)은 작음 ➔ 안전재고 확보, 장기 계약 체결, 대체재 및 대체 공급업체 발굴
② 공급 위험도는 낮고 재무적 영향은 큼 ➔ 경쟁 입찰 및 단가계약
③ 공급 위험도와 재무적 영향 모두 큼 ➔ 전략적 파트너십 구축
④ 공급 위험도와 재무적 영향 모두 작음 ➔ 전자조달 절차 간소화

문 33. 공급자 선호 매트릭스(Supplier Preferencing) 사분면 중, 발주기관의 구매 금액도 작고 거래 매력도도 낮아 공급자가 무관심하거나 거래를 기피하는 영역은?
① 방치 (Nuisance) 영역
② 착취 (Exploitable) 영역
③ 개발 (Development) 영역
④ 핵심 (Core) 영역

문 34. 정성적 수요예측 기법인 델파이(Delphi) 기법과 전문가 패널 조사의 비교 설명으로 옳지 않은 것은?
① 델파이 기법은 전문가들의 익명성을 보장하여 특정 권위자의 의견 독점을 방지한다.
② 델파이 기법은 여러 차례 서면 설문을 반복하고 요약 결과를 피드백하여 의견을 수렴한다.
③ 전문가 패널 조사는 전문가들이 한자리에 모여 공개 대면 토론을 거쳐 의사결정을 내린다.
④ 델파이 기법은 과거 시계열 데이터만을 이용한 선형 회귀방정식 산출 방식이다.

문 35. 이번 달 예측 수요가 500개, 실제 수요가 600개이고 지수평활계수 \(\alpha = 0.4\)일 때, 지수평활법에 의한 다음 달 수요예측치는?
① 500개
② 540개
③ 560개
④ 600개

문 36. 생애주기비용(LCC) 평가 시 자금의 시간가치를 고려하는 순현재가치(NPV) 산정 메커니즘으로 가장 옳지 않은 것은?
① 취득비, 운영비, 유지보수비, 폐기비 등 전 생애주기 비용을 할인율을 적용하여 현재가치로 환산한다.
② 할인율(\(r\))이 상승하면 미래 발생 비용의 현재가치(\(PV\))는 감소한다.
③ 폐기 단계에서 회수되는 잔존가치(Salvage Value)는 미래 수입이므로 총 LCC 비용에서 차감(공제)하여 산정한다.
④ 잔존가치는 미래 손실이므로 할인율을 적용하지 않고 총 LCC 비용에 합산하여 더한다.

문 37. 요구사항 명세서 작성 시 '기술규격(Detail Spec)'과 '성능규격(Performance Spec)'의 장단점 비교로 옳지 않은 것은?
① 기술규격은 상세 치수와 공정을 지정하므로 특정 브랜드의 독점을 유발할 수 있다.
② 성능규격은 목표 성능과 기능만을 지정하므로 공급자의 기술 혁신과 창의적 대안 제출을 유도한다.
③ 기술규격을 적용하면 공급자의 기술 재량권이 대폭 확대된다.
④ 성능규격을 적용하면 과잉 스펙(Over-specification)을 방지할 수 있다.

<script>
// 파싱(Parsing) 엔진
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱
    const aBlocks = aText.split(/^(?=문 \d+\.\s*\[정답\])/gm).filter(b => /^문 \d+\./.test(b));
    const ansMap = {};
    aBlocks.forEach(block => {
        const match = block.match(/문 (\d+)\.\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=문 \d+\.)/gm).filter(b => /^문 \d+\./.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/문 (\d+)\.\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (문 1 ~ 30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (문 31 ~ 50)",
    3: "제3과목: 공공계약관리 (문 51 ~ 80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;


    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
        
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);


    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }


    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

}

window.onload = renderQuiz;
</script>
</body>
</html>
