[Q01] 「국가를 당사자로 하는 계약에 관한 법률 시행령」과 「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」상 계약서 작성 생략 및 수의계약에 관한 설명으로 가장 올바르지 않은 것은?
① 국가계약법상 계약금액이 3,000만 원 이하인 계약을 체결하는 경우 계약서 작성을 생략할 수 있다.
② 지방계약법상 계약금액이 5,000만 원 이하인 계약을 체결하는 경우 계약서 작성을 생략할 수 있다.
③ 국가계약법상 추정가격 2,000만 원 이하의 물품 제조·구매 계약은 1인으로부터 받은 견적서에 의하여 수의계약을 체결할 수 있다.
④ 지방계약법상 추정가격 5,000만 원 이하의 공사·물품·용역 계약은 사업자의 자격 조건과 관계없이 무조건 1인 견적 수의계약이 허용된다.

[Q02] 공공조달 관련 개별 법률상 1인 견적 제출 수의계약 한도가 추정가격 5,000만 원 이하로 상향 적용되는 대상 기업 및 조건으로 가장 옳지 않은 것은?
① 「여성기업지원법」에 따른 여성기업
② 「장애인기업활동 촉진법」에 따른 장애인기업
③ 「중소기업창업 지원법」에 따른 청년창업기업(대표자가 만 39세 이하이고 창업 후 7년 이내인 기업)
④ 「벤처기업육성에 관한 특별조치법」에 따라 벤처기업 확인을 받은 단순 벤처기업

[Q03] 공공조달 관련 법령상 금액 제한 없이 100% 직접 수의계약 체결이 가능한 대상만을 올바르게 고른 것은?
ㄱ. 「중증장애인생산품 우선구매 특별법」에 따라 지정된 중증장애인생산품 생산시설
ㄴ. 「장애인고용촉진 및 직업재활법」에 따른 장애인 표준사업장 생산품 (장애인 근로자 10인 이상 등 요건 충족)
ㄷ. 「조달사업에 관한 법률」에 따라 지정된 우수조달물품 및 혁신제품
ㄹ. 「중소기업자간 경쟁제품 지정 고시」에 따라 지정된 모든 중소기업자 간 경쟁제품
① ㄱ, ㄴ
② ㄱ, ㄷ
③ ㄱ, ㄴ, ㄷ
④ ㄱ, ㄴ, ㄷ, ㄹ

[Q04] 국가계약법령과 지방계약법령상 이의신청 및 국가계약분쟁조정위원회(지방계약심의위원회) 조정 신청 법정 기한에 대한 설명으로 옳은 것은?
① 국가계약법상 이의신청은 불이익 처분을 안 날부터 15일 이내, 사유 발생일부터 20일 이내에 제기해야 한다.
② 지방계약법상 이의신청은 불이익 처분을 안 날부터 25일 이내, 사유 발생일부터 30일 이내에 제기해야 한다.
③ 국가계약법상 이의신청 회신에 불복하여 분쟁조정을 신청하려는 자는 통지받은 날부터 30일 이내에 재심을 청구해야 한다.
④ 지방계약법상 이의신청 회신에 불복하여 조정을 신청하려는 자는 통지받은 날부터 30일 이내에 재심을 청구해야 한다.

[Q05] 사회적 약자 기업 및 정책적 목적 달성을 위한 법정 우선구매 목표 비율에 대한 설명 중 가장 올바르지 않은 것은?
① 공공기관은 중소기업 제품을 총 구매액의 50% 이상 구매하여야 한다.
② 공공기관은 중소기업 물품 구매액 중 기술개발제품을 15% 이상 우선구매하여야 한다.
③ 공공기관은 창업기업 제품을 총 구매액의 8% 이상 구매하여야 한다.
④ 공공기관은 장애인 표준사업장 생산품을 공사 금액을 포함한 총 구매액의 1% 이상 의무 구매하여야 한다.

[Q06] 공공조달에 관한 WTO 정부조달협정(GPA) 및 국제입찰 고시금액 기준에 관한 설명으로 가장 올바르지 않은 것은?
① 국가기관이 발주하는 물품 및 용역 계약의 국제입찰 적용 고시금액은 추정가격 2.3억 원 이상이다.
② 지방자치단체가 발주하는 물품 및 용역 계약의 국제입찰 적용 고시금액은 추정가격 3.5억 원 이상이다.
③ 국가기관이 발주하는 공사 계약의 국제입찰 적용 고시금액은 추정가격 88억 원 이상이다.
④ 지방자치단체가 발주하는 공사 계약의 국제입찰 적용 고시금액은 추정가격 100억 원 이상이다.

[Q07] 공공계약의 법적 성격 및 민법 규정과의 연계에 관한 설명으로 가장 옳지 않은 것은?
① 공공계약은 원칙적으로 국가나 지자체가 사경제 주체로서 체결하는 사법상 계약에 해당한다.
② 발주기관이 행하는 입찰공고는 민법상 계약의 '청약'에 해당하고, 입찰자의 투찰 행위는 '승낙'에 해당한다.
③ 공공계약은 당사자 쌍방이 서로 대가적 의미를 가지는 채무를 부담하는 쌍무계약이자 유상계약이다.
④ 공공계약에서 불가항력으로 인한 계약 이행 불능 발생 시 채무자위험부담주의(민법 제537조)에 따라 처리된다.

[Q08] 공공조달 8대 기본가치(원칙) 중 "비용 대비 가치(VFM: Value for Money)"에 대한 설명으로 가장 올바르지 않은 것은?
① 단기적인 최저 낙찰 가격만을 의미하는 것이 아니라 생애주기비용(LCC)을 종합 고려하는 개념이다.
② 조달 목적물의 품질, 성능, 유지보수 편의성, Durable Life 등을 통합적으로 평가한다.
③ 최고가 입찰 방식을 통해서만 VFM 달성이 가능하므로 소액계약에는 적용되지 않는다.
④ 공공자금 집행의 효율성과 성과를 극대화하기 위한 공공조달의 핵심 가치이다.

[Q09] Harland 등의 공공조달 발전 성숙도 모델(Procurement Maturity Model) 7단계 중 한국 공공조달의 현재 주요 위치이자 전자조달과 전략적 조달이 결합된 단계로 가장 적절한 것은?
① State 1 (수동적 행정 단계)
② State 3 (원가 절감 중시 단계)
③ State 5~6 (전자조달 및 전략적·정책적 조달 단계)
④ State 7 (완전 자동화 및 인간 배제 단계)

[Q10] 국가계약법령상 부정당업자에 대한 입찰참가자격 제한 처분에 관한 설명으로 가장 올바르지 않은 것은?
① 부정당업자 입찰참가자격 제한 기간의 법정 범위는 1개월 이상 2년 이하이다.
② 부정당업자 제재 처분을 받은 자는 나라장터에 게재되어 전국 모든 공공기관의 입찰 참가가 전면 차단된다.
③ 담합이나 뇌물 제공 등 중대 비위 행위로 적발된 경우에도 과징금 부과 대체 제도를 우선 적용해야 한다.
④ 부정당업자 제재 처분에 갈음하여 부과하는 과징금 부과 비율은 계약금액의 10% 이상 30% 이하 범위이다.

[Q11] 조달청 불공정조달행위 조사 및 부당이득금 환수에 관한 설명으로 옳지 않은 것은?
① 직접생산 위반, 원산지 거짓 표시, 제출 서류 위변조 등은 불공정조달행위 조사 대상이다.
② 불공정조달행위로 적발된 경우 위법하게 취득한 이득에 대해 부당이득금 환수 처분을 내릴 수 있다.
③ 부당이득금 환수 처분을 받은 조달업체가 납부 기한 내 미납 시 국세 체납 처분의 예에 따라 강제 징수한다.
④ 부당이득금 환수를 당한 조달업체는 부정당업자 입찰참가자격 제한 처분을 면제받는다.

[Q12] 「인지세법」상 공공계약 체결 시 전자수입인지 납부 기준 및 부담 비율에 관한 설명으로 옳은 것은?
① 추정가격 2,000만 원을 초과하는 계약 체결 시 인지세 납부 의무가 발생한다.
② 부가가치세를 포함한 계약금액이 5,000만 원을 초과하는 계약 체결 시 인지세 납부 의무가 발생한다.
③ 전자수입인지 비용은 전액 계약상대자인 조달업체가 부담하는 것이 원칙이다.
④ 전자수입인지 비용은 전액 발주기관인 공공기관이 부담하는 것이 원칙이다.

[Q13] 「지방자치단체를 당사자로 하는 계약에 관한 법률」상 주민참여감독 대상 공사 및 금액 기준으로 옳은 것은?
① 추정가격 1억 원 이하의 마을진입로 확장공사
② 추정가격 30억 원 이상의 대형 복합 건축공사
③ 추정가격 3,000만 원 이하의 단순 소모품 구매 계약
④ 추정가격 10억 원 초과 전문 소방공사

[Q14] 「공기업·준정부기관 계약사무규칙」상 계약사무 처리 기준 및 조달청 위탁에 관한 설명으로 가장 올바르지 않은 것은?
① 공기업·준정부기관의 계약에 관하여 규정하지 않은 사항은 국가계약법령을 준용한다.
② 일정 규모 이상의 대형 공사 및 물품 구매 계약은 조달청장에게 위탁하여 체결해야 한다.
③ 계약사무 처리 중 임직원의 비위 사실이 감사원 등에 적발된 경우 10일 이내에 통보하고 60일 이내에 이사회 의결을 거쳐 조치해야 한다.
④ 공기업·준정부기관은 수의계약 대상을 임의로 확장할 수 있으며 국가계약법상 수의계약 한도를 준수할 필요가 없다.

[Q15] 「중소기업자간 경쟁제품 직접생산확인제도」에 관한 설명으로 가장 올바르지 않은 것은?
① 중소기업자 간 경쟁제품 시장에 참여하려는 중소기업은 직접생산확인증명서를 구비해야 한다.
② 직접생산확인증명서의 발급 주관 기관은 중소벤처기업부(수탁기관: 중소기업중앙회)이다.
③ 직접생산확인증명서의 법정 유효기간은 발급일부터 3년이다.
④ 하도급 생산이나 단순 완제품 완성품 수입 판매 행위는 직접생산 위반에 해당하여 취소 처분을 받는다.

[Q16] 공공조달에서 녹색제품 3대 인증에 해당하지 않는 것은?
① 환경부의 「환경표지인증」
② 산업통상자원부의 「우수재활용(GR)인증」
③ 환경부의 「환경성적표지인증(저탄소제품)」
④ 국토교통부의 「건설신기술(NET)인증」

해설: 공공조달관리사는 공정성, 투명성, 전문성을 바탕으로 법령 기준을 엄수해야 합니다.
</script>

<script>
// 정밀 매칭 파싱 엔진 (문항 번호 기준 완벽 고정)
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱 (문항 번호별로 정확히 맵핑)
    const ansMap = {};
    aText.split(/^(?=\[Q\d+\])/gm).forEach(block => {
        const match = block.match(/\[Q(\d+)\]\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=\[Q\d+\])/gm).filter(b => /^\[Q\d+\]/.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/\[Q(\d+)\]\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (Q01 ~ Q30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (Q31 ~ Q50)",
    3: "제3과목: 공공계약관리 (Q51 ~ Q80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;


    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
        
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);


    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }


    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

}

window.onload = renderQuiz;
</script>
