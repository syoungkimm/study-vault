문 1. 공공조달 주체 3분법(수요자, 공급자, 이해관계자)에 따른 조달청의 법적 지위에 관한 설명으로 가장 옳지 않은 것은?
① 조달청이 경기도청의 요청을 받아 첨단 도로교통시스템 구축계약을 대행 체결하는 경우, 조달청의 지위는 '이해관계자(계약 수탁자)'이다.
② 조달청이 세종 청사 자체 운영에 필요한 소모성 사무용품을 직접 구매하여 사용하는 경우, 조달청의 지위는 '수요자(발주기관)'이다.
③ 조달청이 대행하는 구매계약에서 실제 물품을 인수하여 납품받고 예산을 집행하는 기관이 '수요자'이다.
④ 조달청은 중앙조달을 대행할 때 물품을 공급하는 입찰참가자에 해당하므로 법적 지위는 '공급자'이다.

문 2. 대한민국 공공조달의 거시경제적 위상과 특성에 관한 설명으로 가장 옳은 것은?
① 한국 공공조달 시장의 연간 전체 규모는 약 20조 원대로, GDP의 1% 미만에 불과하다.
② 공공조달 규모는 일반적으로 국가 GDP의 약 12~15%, 일반정부 총지출의 약 1/3을 차지하여 정책 실현의 핵심 수단이 된다.
③ 공공조달은 세금을 재원으로 하지 않으므로 계약 관련 정보의 대외 공개 의무가 배제된다.
④ 공공조달은 이윤 극대화를 최우선 목적으로 하므로 민간 기업의 상업적 구매행위와 목적 및 취지가 전적으로 일치한다.

문 3. 현대적(광의의) 의미의 공공조달과 8대 핵심가치에 대한 설명으로 가장 옳지 않은 것은?
① 현대적 공공조달은 단순 구매·소모를 넘어 구매력을 활용하여 정부 정책 성과를 견인하는 전략적 조달(SPP)을 의미한다.
② 공공조달의 8대 핵심가치에는 비용 대비 가치(VFM), 경쟁성, 투명성, 청렴성, 책임성, 효율성, 공정성, 지속가능성이 포함된다.
③ 비용 대비 가치(VFM)는 최초 구매 가격만을 기준으로 최저가 투찰자를 낙찰하는 자산 취득 방식만을 의미한다.
④ 공공조달의 정책적 차원 목표에는 중소기업 육성, 친환경 녹색제품 구매, 기술혁신 지원, 사회적 약자 기업 지원이 포함된다.

문 4. 공공조달 관련 법령과 주무 소관 부처의 연결이 올바르지 않은 것은?
① 국가를 당사자로 하는 계약에 관한 법률 - 재정경제부
② 지방자치단체를 당사자로 하는 계약에 관한 법률 - 행정안전부
③ 조달사업에 관한 법률 - 조달청
④ 중소기업제품 구매촉진 및 판로지원에 관한 법률 - 과학기술정보통신부

문 5. 국가계약법 제5조(계약의 원칙) 및 부당특약에 관한 설명으로 가장 옳은 것은?
① 국가계약은 국가가 우월적 공권력 주체로서 체결하는 공법상 계약이므로 사적 자치의 원칙이 적용되지 않는다.
② 발주기관이 계약상대자의 계약상 이익을 부당하게 제한하거나 위험을 전가하는 부당특약을 설정한 경우 사법상 무효가 된다.
③ 부당특약이 설정되었더라도 당사자 간 합의 서명이 완료되면 당해 부당특약은 법적으로 완전한 유효성을 갖는다.
④ 계약상대자는 부당특약으로 손해가 발생하더라도 행정소송만을 제기할 수 있고 사법상 구제는 신청할 수 없다.

문 6. 경쟁입찰 중 지명경쟁입찰의 법정 성립 요건으로 올바른 숫자의 조합은?
지명경쟁입찰에 부치는 경우 원칙적으로 ( ㄱ )인 이상을 지명하여야 하고, 지명된 자 중 ( ㄴ )인 이상의 유효한 입찰참가가 있어야 입찰이 성립한다.
① ㄱ: 3, ㄴ: 2
② ㄱ: 5, ㄴ: 2
③ ㄱ: 5, ㄴ: 3
④ ㄱ: 10, ㄴ: 5

문 7. 경쟁입찰 유찰에 따른 수의계약 체결 규정에 대한 설명으로 가장 옳지 않은 것은?
① 경쟁입찰이 2회 이상 유찰된 경우 법령에 따라 수의계약을 체결할 수 있다.
② 유찰에 따라 수의계약을 체결할 때에는 최초 입찰에 부칠 때 정한 보증금과 기한을 제외하고는 최초의 가격 및 조건을 변경할 수 없다.
③ 유찰 수의계약 시 발주기관은 계약상대자 유치를 위해 예정가격을 최초 입찰 시보다 인상하여 제시할 수 있다.
④ 당해 최초 입찰에 참가하지 않았던 신규 업체도 유찰 수의계약의 상대자가 될 수 있다.

문 8. 소액수의계약(1인 견적 및 2인 이상 전자견적) 기준에 관한 설명으로 옳은 것은?
① 일반 기업 대상 물품·용역의 1인 견적 수의계약 한도는 추정가격 5,000만 원 이하이다.
② 여성기업, 장애인기업, 사회적기업, 청년창업기업 대상 물품·용역의 1인 견적 수의계약 한도는 추정가격 5,000만 원 이하이다.
③ 2인 이상 전자견적 소액수의계약(물품·용역)은 추정가격 2억 원 이하 구간에서 집행한다.
④ 소액수의계약은 덤핑 방지를 위해 모든 건에 대해 서면 적격심사(이행실적 평가)를 필수 이행해야 한다.

문 9. 국가계약법령상 입찰공고 기간 규정의 연결이 올바르지 않은 것은?
① 일반경쟁입찰: 입찰서 제출 마감일 전날부터 역산하여 최소 7일 전
② 긴급공고 및 재공고입찰: 최소 5일 전까지 단축 가능
③ 협상에 의한 계약 (고시금액 미만 사업): 최소 40일 전 공고 필수
④ WTO GPA 적용 국제입찰: 최소 40일 전

문 10. 사전규격공개(사전규격공시) 제도 운영에 관한 설명으로 가장 옳지 않은 것은?
① 입찰 공고 전 규격을 대외 공개하여 특정 업체에 유리한 독소 조항을 예방하고 공정성을 높이는 제도이다.
② 사전규격공개 기간은 원칙적으로 최소 5일 이상이다.
③ 사전규격공개에 대해 조달업체의 이의제기가 접수된 경우, 접수일로부터 5일 이내에 처리 결과를 나라장터에 공시해야 한다.
④ 추정가격 5,000만 원 미만의 소액계약 및 긴급 재해복구 사업에도 예외 없이 사전규격공개를 필수 이행해야 한다.

문 11. 추정가격(Estimated Price)과 예정가격(Predetermined Price)의 비교 설명으로 가장 옳은 것은?
① 추정가격은 개찰 직전에 결정하고, 예정가격은 입찰공고 전에 산정한다.
② 추정가격은 부가가치세를 포함하여 산정하고, 예정가격은 부가가치세를 제외하여 산정한다.
③ 추정가격은 입찰공고 전에 부가가치세를 제외하여 산정함으로써 입찰 방법 및 GPA 국제입찰 대상 여부를 판단하는 기준이 되며, 예정가격은 개찰 직전에 부가가치세를 포함하여 결정되는 낙찰자 결정 기준이다.
④ 예정가격은 투명성 확보를 위해 입찰공고문에 기초금액과 함께 사전에 대외 공개하는 것을 법적 원칙으로 한다.

문 12. 복수예비가격 작성 및 예정가격 확정 산식에 관한 설명으로 옳지 않은 것은?
① 국가계약법 적용 입찰 시 복수예비가격 15개는 기초금액의 ±2% 범위 내에서 작성된다.
② 지방계약법 적용 입찰 시 복수예비가격 15개는 기초금액의 ±3% 범위 내에서 작성된다.
③ 예정가격은 15개 예비가격 중 입찰 참가자들이 다빈치 추첨한 4개 예비가격의 산술평균으로 결정된다.
④ 4개 예비가격을 산술평균하여 예정가격을 확정할 때 발생한 원 미만(소수점 이하) 금액은 반올림하여 원 단위로 올린다.

문 13. 국가물품 목록정보시스템의 번호 체계에 관한 설명으로 옳은 것은?
① 물품목록번호(16자리) = 물품분류번호(8자리) + 물품식별번호(8자리)
② 물품목록번호는 총 10자리의 숫자로 구성된다.
③ 세부품명번호 10자리는 개별 제조업체의 모델명 및 시리얼번호를 의미한다.
④ 물품분류번호 8자리는 HS 코드를 기반으로 부여된다.

문 14. 나라장터 연계 전문몰 5종(종합쇼핑몰, 혁신장터, 벤처나라, 디지털서비스몰, 이음장터)의 기능 연결로 올바르지 않은 것은?
① 종합쇼핑몰 - 다수공급자계약(MAS) 및 제3자 단가계약 물품 납품요구
② 혁신장터 - 혁신제품 지정 및 시제품 시범구매 사업 관리
③ 벤처나라 - 창업기업 및 벤처기업의 초기 공공조달 판로 지원
④ 디지털서비스몰 - 지역 소상공인 및 사회적경제기업의 일상 소액 용역 직거래

문 15. 조달청 '혁신제품 지정제도'에 관한 설명으로 가장 옳지 않은 것은?
① 혁신제품으로 지정되면 지정일로부터 3년간 금액 제한 없이 수의계약 체결이 가능하다.
② 혁신제품을 구매하여 사용한 담당 공무원에게 고의·중과실이 없으면 손실 발생 시 책임을 면제하는 '구매자 면책제도'가 적용된다.
③ 혁신제품 구매 실적은 공공기관 평가 및 혁신구매 목표제 실적 산정 대상에서 전액 제외된다.
④ 조달청 예산으로 우선 구매하여 공공기관에 제공·테스트하는 '시범구매 사업'이 운영된다.

문 16. 조달청 '우수조달물품 지정제도'의 법정 유효기간 및 연장 조건으로 옳은 것은?
① 기본 유효기간 1년 (연장 불가)
② 기본 유효기간 3년 (수출 실적, 고용 창출 등 요건 충족 시 최대 3년 범위 내 연장 가능)
③ 기본 유효기간 5년 고정
④ 기본 유효기간 10년

문 17. 「중소기업제품 구매촉진 및 판로지원에 관한 법률」상 중소기업자 간 경쟁제품 및 직접생산확인제도에 관한 설명으로 옳지 않은 것은?
① 중소기업자 간 경쟁제품의 법정 지정 유효기간은 3년이다.
② 직접생산확인증명서의 법정 발급 유효기간은 2년이다.
③ 직접생산확인을 받은 업체가 수주 후 타사에 하도급을 주거나 수입 완제품을 납품하다 적발되면 직접생산확인이 취소된다.
④ 직접생산확인이 취소된 업체는 취소된 날부터 즉시 다음 날 재신청하여 새로 발급받을 수 있다.

문 18. 법정 공공구매 목표비율 5종에 대한 설명 중 산정 분모(기준)가 다른 하나는?
① 중소기업 제품 구매목표: 총 구매액의 50% 이상
② 여성기업 제품 구매목표: 물품·용역 구매액의 5% 이상, 공사 구매액의 3% 이상
③ 장애인기업 제품 구매목표: 총 구매액의 1% 이상
④ 기술개발제품 구매목표: 중소기업 물품 구매액의 15% 이상

문 19. 사회적 약자 기업 및 복지 단체 생산품 우선구매 제도 중 법적 구속력이 가장 강력한 '강제 의무 구매(1% 이상)' 품목은?
① 여성기업 제품
② 장애인기업 제품
③ 중증장애인생산품
④ 사회적기업 제품

문 20. 「녹색제품 구매촉진에 관한 법률」상 녹색제품 3대 인증 및 구매 관리에 관한 설명으로 옳지 않은 것은?
① 녹색제품 3대 인증에는 환경표지인증, 우수재활용(GR)인증, 환경성적표지인증이 포함된다.
② 공공기관은 당해 연도 구매 총액의 50% 이상을 녹색제품으로 구매하도록 노력해야 한다.
③ 저탄소제품인증은 공공기관 매년 녹색제품 구매실적 공표 시 실적 합산 금액에 포함된다.
④ 환경표지는 환경부(한국환경산업기술원), GR인증은 산업통상자원부(자원순환산업진흥협회) 소관이다.

문 21. 공공입찰의 민법상 법리 연계 및 입찰서 제출 효과에 관한 설명으로 옳지 않은 것은?
① 발주기관의 입찰공고는 '청약의 유인'에 해당한다.
② 조달업체의 투찰(입찰서 제출)은 '청약'에 해당한다.
③ 입찰서가 나라장터 서버에 접수·기록된 후라도 입찰자는 마감 전이면 입찰서를 자유롭게 철회·변경할 수 있다.
④ 발주기관의 낙찰자 결정 통지는 '승낙'에 해당하며, 최종 서면 계약서 기명날인으로 본계약이 확정 성립한다.

문 22. 민법상 계약의 해제와 해지에 관한 설명으로 가장 옳은 것은?
① 해제는 계속적 계약에서 장래를 향해서만 효력을 소멸시킨다.
② 해지는 일시적 계약에서 체결 시점으로 소급하여 계약을 무효화한다.
③ 계약의 해제 또는 해지는 상대방에 대한 손해배상 청구권 행사에 영향을 미치지 아니한다.
④ 계약이 해제되더라도 이행된 급부에 대해 원상회복의무는 발생하지 않는다.

문 23. 민법상 도급계약과 위임계약의 비교 설명으로 옳지 않은 것은?
① 도급계약은 '일의 완성'을 목적으로 하고, 위임계약은 '사무 처리'를 목적으로 한다.
② 도급계약에서 수급인은 완공된 목적물의 하자에 대해 무과실 하자담보책임을 진다.
③ 위임계약에서 수임인은 선량한 관리자의 주의의무(선관주의의무)를 다해야 한다.
④ 도급계약과 위임계약 모두 완공 후에는 어떠한 경우에도 손해배상을 청구할 수 없다.

문 24. 민법 제668조 단서에 따른 건물 기타 토지의 공작물 도급계약에 관한 설명으로 옳은 것은?
① 완성된 공작물에 하자가 중대하더라도 도급인은 계약을 소급 해제할 수 없으며, 하자보수 및 손해배상만 청구할 수 있다.
② 완공된 건물에 하자가 있으면 도급인은 건물을 철거하고 계약을 즉시 소급 해제할 수 있다.
③ 수급인은 하자에 대해 아무런 법적 책임을 지지 않는다.
④ 공작물 도급계약에는 민법 규정이 적용되지 않는다.

문 25. WTO 정부조달협정(GPA) 적용 대상 국제입찰의 추정가격 기준금액(고시금액)으로 옳은 세트는?
① 국가기관 물품·용역: 약 2.3억 원 이상 / 국가기관 공사: 약 88억 원 이상
② 지방자치단체 물품·용역: 약 2.3억 원 이상 / 지자체 공사: 약 88억 원 이상
③ 국가기관 물품·용역: 약 5.0억 원 이상 / 국가기관 공사: 약 100억 원 이상
④ 지자체 물품·용역: 약 7.1억 원 이상 / 지자체 공사: 약 300억 원 이상

문 26. [2026 최신개정] 국가계약법 제28조에 따른 이의신청 및 재심 청구 기한으로 올바른 것은?
① 이의신청: 안 날부터 25일 이내, 사유 발생일 30일 이내 / 재심 청구: 30일 이내
② 이의신청: 안 날부터 10일 이내, 사유 발생일 15일 이내 / 재심 청구: 15일 이내
③ 이의신청: 안 날부터 15일 이내, 사유 발생일 20일 이내 / 재심 청구: 20일 이내
④ 이의신청: 안 날부터 60일 이내, 사유 발생일 90일 이내 / 재심 청구: 60일 이내

문 27. 국가계약분쟁조정위원회의 조정 절차 및 법적 효력에 관한 설명으로 옳은 것은?
① 조정 신청이 접수되면 입찰 집행 절차가 즉시 자동 정지된다.
② 조정위원회의 조정안을 당사자가 수락하고 15일 이내에 이의를 제기하지 않으면 민사소송법상 '재판상 화해'와 동일한 효력이 발생한다.
③ 조정위원회의 조정안은 당사 수락 여부와 상관없이 무조건 확정판결 효력을 갖는다.
④ 분쟁조정위원회는 행정안전부에 설치되어 운영된다.

문 28. 부정당업자 입찰참가자격 제한(행정처분)과 계약보증금 국고귀속(사법상 권리행사)의 쟁송 방법 연결로 올바른 것은?
① 부정당업자 제한: 항고소송(행정소송) / 계약보증금 국고귀속: 민사소송

① 위위반 업체에 대해 부당이득금(차액 + 가산금)을 산정하여 국고 환수하고, 나라장터 거래정지 처분을 부과할 수 있다.

③ 적발된 업체에 대한 부당이득금 환수 처분은 법원의 형사 판결이 확정되어야만 집행 가능하다.
④ 불공정조달행위 신고자에게는 어떠한 경우에도 신고포상금을 지급할 수 없다.

① 초기구매비, 운영비, 유지보수비, 폐기비용 등 전 생애주기 비용을 합산한다.
② 자금의 시간가치를 고려하여 미래 비용을 현재가치로 할인 반영한다.
③ 할인율(\(r\))이 상승하면 미래 발생 비용의 현재가치(\(PV\))는 감소한다.
④ 자산 폐기 단계에서 발생하는 잔존가치(Salvage Value)는 미래 수입이므로 총 LCC 비용에 합산하여 더해야 한다.

문 37. 요구사항 명세서 작성 시 '성능규격(Performance Spec)'의 장점으로 가장 옳은 것은?

④ 검수 절차를 전면 생략할 수 있게 해준다.

③ 평가위원은 평가 대상 업체와 사전에 사적으로 접촉해서는 안 된다.

문 45. 적격심사 낙찰자 결정 메커니즘에 대한 설명으로 가장 옳은 것은?

④ 가격협상 시 발주기관은 예정가격을 초과한 금액으로 협상단가를 증액해 줄 수 있다.

문 47. 2단계 경쟁입찰(규격·가격 분리입찰)과 규격·가격 동시입찰의 결정적 차이점에 대한 설명으로 옳은 것은?

문 48. 공동수급체(컨소시엄) 구성 방식 중 '공동이행방식'과 '분담이행방식'의 법적 책임 비교로 옳은 것은?

<script>
// 파싱(Parsing) 엔진
function buildQuizData() {
    const qText = document.getElementById('raw-questions').textContent;
    const aText = document.getElementById('raw-answers').textContent;
    const quizData = [];
    
    // 1. 해설 데이터 파싱
    const aBlocks = aText.split(/^(?=문 \d+\.\s*\[정답\])/gm).filter(b => /^문 \d+\./.test(b));
    const ansMap = {};
    aBlocks.forEach(block => {
        const match = block.match(/문 (\d+)\.\s*\[정답\]\s*([①②③④])/);
        if (match) {
            const id = parseInt(match[1]);
            const ansChar = match[2];
            let ansNum = 1;
            if(ansChar === '②') ansNum = 2;
            if(ansChar === '③') ansNum = 3;
            if(ansChar === '④') ansNum = 4;
            
            const expMatch = block.match(/해설:\s*([\s\S]*)/);
            let explanation = expMatch ? expMatch[1].trim() : "";
            
            ansMap[id] = { answer: ansNum, explanation: `[정답] ${ansChar}<br><br>해설: ${explanation}` };
        }
    });

    // 2. 문제 및 보기 파싱
    const qBlocks = qText.split(/^(?=문 \d+\.)/gm).filter(b => /^문 \d+\./.test(b));
    qBlocks.forEach(block => {
        const parts = block.split(/(?=[①②③④])/);
        if (parts.length < 5) return; 
        
        const qTitleMatch = parts[0].match(/문 (\d+)\.\s*([\s\S]*)/);
        if (!qTitleMatch) return;
        
        const id = parseInt(qTitleMatch[1]);
        const questionTitle = "문 " + id + ". " + qTitleMatch[2].trim();
        
        const options = [];
        for (let i = 1; i <= 4; i++) {
            if (parts[i]) options.push(parts[i].trim());
        }

        let subject = 1; // 기본 1과목
        if (id >= 31 && id <= 50) subject = 2; // 2과목
        if (id >= 51 && id <= 80) subject = 3; // 3과목

        quizData.push({
            id: id,
            subject: subject,
            question: questionTitle,
            options: options,
            answer: ansMap[id] ? ansMap[id].answer : 1,
            explanation: ansMap[id] ? ansMap[id].explanation : "해설이 누락되었습니다."
        });
    });
    return quizData;
}

const quizData = buildQuizData();

const subjectNames = {
    1: "제1과목: 공공조달과 법제도 이해 (문 1 ~ 30)",
    2: "제2과목: 공공조달계획 수립 및 분석 (문 31 ~ 50)",
    3: "제3과목: 공공계약관리 (문 51 ~ 80)"
};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    let currentSubject = 0;

    quizData.forEach((q, index) => {
        if (q.subject !== currentSubject) {
            currentSubject = q.subject;
            container.innerHTML += `<h2 class="subject-title">${subjectNames[currentSubject]}</h2>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, i) => {
            optionsHtml += `
                <label id="label-q${q.id}-opt${i+1}">
                    <input type="radio" name="q${q.id}" value="${i+1}"> ${opt}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="question-box" id="box-q${q.id}">
                <div class="question-title">${q.question}</div>
                <div class="options">${optionsHtml}</div>
                <div class="explanation" id="exp-q${q.id}">${q.explanation}</div>
            </div>
        `;
    });
}

function gradeExam() {
    let subjectScores = { 1: { correct: 0, total: 30 }, 2: { correct: 0, total: 20 }, 3: { correct: 0, total: 30 } };
    let unselected = false;


    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (!selected) unselected = true;
        
    });

    if (unselected) {
        if(!confirm("풀지 않은 문제가 있습니다. 그래도 제출하시겠습니까?")) return;
    }

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : 0;
        
        document.getElementById(`label-q${q.id}-opt${q.answer}`).classList.add('correct-option');
        if (userAns !== 0 && userAns !== q.answer) {
            document.getElementById(`label-q${q.id}-opt${userAns}`).classList.add('wrong-option');
        }

        document.getElementById(`exp-q${q.id}`).style.display = 'block';

        if (userAns === q.answer) {
            subjectScores[q.subject].correct++;
        }
        
        document.getElementsByName(`q${q.id}`).forEach(el => el.disabled = true);
    });

    const score1 = Math.round((subjectScores[1].correct / subjectScores[1].total) * 100);
    const score2 = Math.round((subjectScores[2].correct / subjectScores[2].total) * 100);
    const score3 = Math.round((subjectScores[3].correct / subjectScores[3].total) * 100);
    const average = Math.round((score1 + score2 + score3) / 3);


    let passFail = "합격";
    let message = "축하합니다! 합격 기준을 충족하셨습니다.";
    
    if (score1 < 40 || score2 < 40 || score3 < 40) {
        passFail = "불합격 (과락 발생)";
        message = "과락이 발생했습니다. 40점 미만인 과목을 집중적으로 복습해 주세요.";
    } else if (average < 60) {
        passFail = "불합격 (평균 미달)";
        message = "평균 점수가 60점에 미달합니다. 전체적인 복습이 필요합니다.";
    }


    const resultBoard = document.getElementById('result-board');
    resultBoard.style.display = 'block';
    resultBoard.innerHTML = `
        <h2>📊 최종 채점 결과</h2>
        <p><b>제1과목:</b> ${score1}점 &nbsp;|&nbsp; <b>제2과목:</b> ${score2}점 &nbsp;|&nbsp; <b>제3과목:</b> ${score3}점</p>
        <h3 style="color: #c0392b;">총 평균: ${average}점 [ ${passFail} ]</h3>
        <p>${message}</p>
        <p style="font-size: 0.9em; color: #555;">(하단으로 스크롤하여 문제별 해설을 확인하세요)</p>
    `;
    
    document.getElementById('submit-btn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

}

window.onload = renderQuiz;
</script>
</body>
